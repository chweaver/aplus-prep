xposed listening service offers a direct avenue in. The tell: open service ports = an exposed listening service; default credentials = an unchanged out-of-box password; removable device = a USB or similar media vector; unsecure networks = connecting over unprotected networks."},{"id":"q114","domain":"D2","family":"attack-vectors","question":"A traveling employee joins a free, open public Wi-Fi hotspot with no encryption, and an attacker on that network intercepts their traffic. Which vector is this?","options":["open service ports","removable device","unsecure networks","default credentials"],"correctIndex":2,"explanation":"unsecure networks. The unprotected network itself exposes the traffic. The tell: unsecure networks = connecting over unprotected networks; open service ports = an exposed listening service; removable device = a USB media vector; default credentials = an unchanged factory password."},{"id":"q115","domain":"D2","family":"supply-chain","question":"A company outsources the running of its entire helpdesk, servers, and patching to a third party that operates all of it remotely. Which supply-chain party is this?","options":["vendor","managed service provider (MSP)","supplier","hardware provider"],"correctIndex":1,"explanation":"managed service provider (MSP). A third party that actually runs your IT operations day to day. The tell: MSP = runs your IT operations; vendor = sells you a product or service; supplier = provides parts or materials upstream; hardware provider = supplies devices."},{"id":"q116","domain":"D2","family":"supply-chain","question":"Which supply-chain party provides the raw parts or components upstream that get built into a finished product?","options":["managed service provider (MSP)","software provider","supplier","vendor"],"correctIndex":2,"explanation":"supplier. Supplies upstream parts and materials that feed into a product. The tell: supplier = upstream parts/materials; MSP = operates your IT; software provider = supplies applications; vendor = sells a finished product or service."},{"id":"q117","domain":"D2","family":"supply-chain","question":"A company buys a finished, packaged endpoint protection product from a firm that sells it commercially. Which supply-chain party is this?","options":["managed service provider (MSP)","vendor","supplier","hardware provider"],"correctIndex":1,"explanation":"vendor. A vendor sells you a finished product or service. The tell: vendor = sells a finished product/service; MSP = runs your IT operations for you; supplier = provides upstream parts or materials; hardware provider = supplies physical devices."},{"id":"q118","domain":"D2","family":"supply-chain","question":"Which supply-chain party specifically supplies the finished physical devices and equipment an organization uses?","options":["software provider","supplier","managed service provider (MSP)","hardware provider"],"correctIndex":3,"explanation":"hardware provider. It supplies the physical devices and equipment. The tell: hardware provider = supplies finished devices; software provider = supplies applications; supplier = provides upstream parts or raw materials; MSP = operates your IT for you."},{"id":"q119","domain":"D2","family":"app-vulns","question":"An attacker submits ' OR '1'='1 into a login form and the backend returns every user row from the database. Which vulnerability was exploited?","options":["cross-site scripting (XSS)","buffer overflow","memory injection","SQL injection (SQLi)"],"correctIndex":3,"explanation":"SQL injection (SQLi). Crafted input alters the SQL query sent to the database. The tell: SQLi = inject SQL to hit the database; XSS = inject script that runs in another user's browser; buffer overflow = write past a buffer boundary; memory injection = insert code into a running process's memory."},{"id":"q120","domain":"D2","family":"app-vulns","question":"An attacker posts a comment containing a script tag; when other users view the page, the script runs in their browsers and steals their session cookies. Which vulnerability is this?","options":["cross-site scripting (XSS)","SQL injection (SQLi)","malicious update","buffer overflow"],"correctIndex":0,"explanation":"cross-site scripting (XSS). Injected script executes in other users' browsers. The tell: XSS = script runs in a victim's browser; SQLi = malicious SQL hits the database; malicious update = trojanized software update; buffer overflow = overflowing a fixed memory region."},{"id":"q121","domain":"D2","family":"app-vulns","question":"Writing more data into a fixed-length memory region than it can hold, overwriting adjacent memory, describes which vulnerability?","options":["memory injection","buffer overflow","SQL injection (SQLi)","malicious update"],"correctIndex":1,"explanation":"buffer overflow. Data spills past a buffer boundary and corrupts neighboring memory. The tell: buffer overflow = write past a buffer boundary; memory injection = insert code into a live process's memory; SQLi = inject SQL into a query; malicious update = poisoned software update."},{"id":"q122","domain":"D2","family":"app-vulns","question":"Attackers compromise a software vendor's update server and push a trojanized patch that installs a backdoor on every customer that updates. Which vulnerability is this?","options":["malicious update","memory injection","buffer overflow","SQL injection (SQLi)"],"correctIndex":0,"explanation":"malicious update. A trusted update channel delivers trojanized code. The tell: malicious update = a trojanized software update; memory injection = insert code into a running process's memory; buffer overflow = write past a buffer boundary; SQLi = inject SQL into a database query."},{"id":"q123","domain":"D2","family":"app-vulns","question":"Inserting and executing malicious code directly within the address space of a running process describes which vulnerability?","options":["buffer overflow","memory injection","cross-site scripting (XSS)","malicious update"],"correctIndex":1,"explanation":"memory injection. Code is inserted straight into a live process's memory. The tell: memory injection = insert code into a running process; buffer overflow = write past a buffer boundary to overwrite memory; XSS = inject script that runs in another user's browser; malicious update = a trojanized update."},{"id":"q124","domain":"D2","family":"race-conditions","question":"A program verifies a user's permission to a file, then a split second later opens it, but an attacker swaps the file during that gap. The exploited window between verify and access is called what?","options":["time-of-check (TOC)","time-of-use (TOU)","time-of-check to time-of-use (TOCTOU)","race condition"],"correctIndex":2,"explanation":"time-of-check to time-of-use (TOCTOU). The exploit is the gap spanning from when the check happens to when the resource is used. The tell: TOCTOU = the whole check-to-use exploit window; time-of-check = the instant permission is validated; time-of-use = the instant the resource is actually used; race condition = the general timing-dependent flaw class."},{"id":"q125","domain":"D2","family":"race-conditions","question":"In a TOCTOU flaw, the exact moment at which the resource's permission is validated is called the ___.","options":["time-of-use (TOU)","race condition","TOCTOU window","time-of-check (TOC)"],"correctIndex":3,"explanation":"time-of-check (TOC). This is the moment the check or validation is performed. The tell: time-of-check = when permission is verified; time-of-use = when the resource is actually accessed; race condition = the broad timing-dependent bug; TOCTOU window = the exploitable gap between the two."},{"id":"q126","domain":"D2","family":"race-conditions","question":"A bug whose outcome depends on the unpredictable ordering or timing of two concurrent events is generally called a ___.","options":["race condition","time-of-check (TOC)","time-of-use (TOU)","TOCTOU"],"correctIndex":0,"explanation":"race condition. The result hinges on which event wins the timing. The tell: race condition = outcome depends on event timing/order; time-of-check = the validation instant; time-of-use = the access instant; TOCTOU = the specific check-to-use exploit gap."},{"id":"q127","domain":"D2","family":"race-conditions","question":"In a TOCTOU vulnerability, the exact moment the resource is actually accessed or consumed, after it was validated, is called the ___.","options":["race condition","time-of-check (TOC)","time-of-use (TOU)","TOCTOU window"],"correctIndex":2,"explanation":"time-of-use (TOU). This is the instant the resource is actually used. The tell: time-of-use = when the resource is accessed; time-of-check = when permission is validated; race condition = the general timing-dependent flaw class; TOCTOU window = the exploitable gap between check and use."},{"id":"q128","domain":"D2","family":"race-conditions","question":"Two threads each read an account balance of $100 at the same time and each subtract $80, leaving a wrong balance because their operations interleaved. This flaw is best classed as a ___.","options":["time-of-check (TOC)","time-of-use (TOU)","TOCTOU window","race condition"],"correctIndex":3,"explanation":"race condition. The wrong result stems from unsynchronized concurrent operations whose timing collides. The tell: race condition = outcome depends on event timing/order; time-of-check = the validation instant; time-of-use = the access instant; TOCTOU window = the specific check-to-use exploit gap."},{"id":"q129","domain":"D2","family":"race-conditions","question":"Which statement correctly pairs the two moments in a TOCTOU flaw?","options":["Time-of-check and time-of-use are the same instant.","Time-of-use always occurs before time-of-check.","Neither term relates to timing.","Time-of-check is when permission is validated; time-of-use is when the resource is actually accessed."],"correctIndex":3,"explanation":"time-of-check is when permission is validated; time-of-use is when the resource is actually accessed. The exploit lives in the gap between them. The tell: time-of-check = the validation instant; time-of-use = the access instant; race condition = the broad timing-dependent bug; TOCTOU = the specific check-to-use exploit window."},{"id":"q130","domain":"D2","family":"system-vulns","question":"An attacker exploits a hypervisor flaw to break out of a guest virtual machine and run code directly on the host. Which vulnerability is this?","options":["resource reuse","VM escape","side loading","jailbreaking"],"correctIndex":1,"explanation":"VM escape. Breaking out of a guest to reach the hypervisor or host. The tell: VM escape = guest breaks out to the host; resource reuse = leftover data in reallocated memory or storage; side loading = installing apps outside the official store; jailbreaking = removing OS restrictions for root."},{"id":"q131","domain":"D2","family":"system-vulns","question":"A vulnerability for which no patch yet exists because the vendor is not even aware of it is called a ___.","options":["end-of-life","legacy","zero-day","misconfiguration"],"correctIndex":2,"explanation":"zero-day. No fix exists because the flaw is unknown to the vendor. The tell: zero-day = no patch exists yet; end-of-life = vendor stopped supporting the product; legacy = outdated but still running; misconfiguration = an insecure setting choice."},{"id":"q132","domain":"D2","family":"system-vulns","question":"A user removes the manufacturer's operating system restrictions on their phone to gain full root access and install unapproved software. Which term describes this?","options":["side loading","resource reuse","firmware vulnerability","jailbreaking"],"correctIndex":3,"explanation":"jailbreaking. Stripping OS restrictions to obtain root control of the device. The tell: jailbreaking = remove OS restrictions for root; side loading = install an app from outside the official store; resource reuse = leftover data in reused storage; firmware vulnerability = a flaw in low-level device code."},{"id":"q133","domain":"D2","family":"system-vulns","question":"A product the vendor has stopped selling and no longer issues security patches for is described as ___.","options":["legacy","end-of-life","misconfiguration","firmware vulnerability"],"correctIndex":1,"explanation":"end-of-life. The vendor has ceased support and patching. The tell: end-of-life = vendor stopped selling and supporting it; legacy = outdated but still running; misconfiguration = an insecure setting choice; firmware vulnerability = a flaw in low-level device code."},{"id":"q134","domain":"D2","family":"system-vulns","question":"A cloud tenant is assigned storage that was not properly wiped and still contains a previous tenant's leftover data. Which vulnerability is this?","options":["misconfiguration","VM escape","side loading","resource reuse"],"correctIndex":3,"explanation":"resource reuse. Reallocated storage still holds another party's residual data. The tell: resource reuse = leftover data in reallocated memory or storage; misconfiguration = an insecure setting; VM escape = a guest breaking out to the host; side loading = installing apps outside the official store."},{"id":"q135","domain":"D2","family":"malware","question":"A piece of malware spreads across the network entirely on its own by exploiting a service, with no user needing to open or run anything. Which type is it?","options":["worm","virus","trojan","logic bomb"],"correctIndex":0,"explanation":"worm. It self-replicates over the network without any user action. The tell: worm = self-spreads with no user action; virus = needs a host file and user action; trojan = disguised as legitimate software; logic bomb = payload triggered by a condition or date."},{"id":"q136","domain":"D2","family":"malware","question":"Malware encrypts a company's files and demands payment for the decryption key. Which type is it?","options":["spyware","ransomware","rootkit","keylogger"],"correctIndex":1,"explanation":"ransomware. It encrypts data and extorts a payment for recovery. The tell: ransomware = encrypts and extorts; spyware = secretly collects activity; rootkit = hides at the OS/kernel level for persistence; keylogger = records keystrokes."},{"id":"q137","domain":"D2","family":"malware","question":"Which malware hides itself at the kernel or operating-system level to conceal its presence and maintain persistent privileged access?","options":["trojan","bloatware","rootkit","virus"],"correctIndex":2,"explanation":"rootkit. It burrows into the OS/kernel to stay hidden and keep control. The tell: rootkit = kernel-level hiding for persistence; trojan = disguised as legitimate; bloatware = unwanted preinstalled software; virus = needs a host file and user action to spread."},{"id":"q138","domain":"D2","family":"malware","question":"A disgruntled administrator plants code set to wipe the databases automatically if his account is ever removed from the payroll system. Which malware is this?","options":["worm","spyware","keylogger","logic bomb"],"correctIndex":3,"explanation":"logic bomb. A dormant payload that detonates when a specific condition is met. The tell: logic bomb = fires on a condition or date; worm = self-replicates across the network; spyware = secretly collects activity; keylogger = records keystrokes."},{"id":"q139","domain":"D2","family":"malware","question":"Software disguised as a legitimate program that the user willingly installs, but which carries a hidden malicious payload, is which type?","options":["trojan","virus","worm","bloatware"],"correctIndex":0,"explanation":"trojan. It masquerades as legitimate so the user installs it themselves. The tell: trojan = disguised as legitimate; virus = needs a host file and user action to propagate; worm = self-spreads with no user action; bloatware = unwanted preinstalled software."},{"id":"q140","domain":"D2","family":"malware","question":"Software silently records every keystroke a user types, capturing passwords and messages, then sends them to an attacker. Which type is it?","options":["spyware","trojan","rootkit","keylogger"],"correctIndex":3,"explanation":"keylogger. It specifically captures keystrokes. The tell: keylogger = records keystrokes; spyware = secretly collects activity broadly; trojan = disguised as legitimate software; rootkit = hides at the OS/kernel level for persistence."},{"id":"q141","domain":"D2","family":"malware","question":"A malicious program embeds itself in a document macro and spreads only when a user opens that file and enables content. Which type is it?","options":["virus","worm","trojan","spyware"],"correctIndex":0,"explanation":"virus. It needs a host file and user action to propagate. The tell: virus = needs a host file and user action; worm = self-spreads with no user action; trojan = disguised as legitimate software; spyware = secretly collects user activity."},{"id":"q142","domain":"D2","family":"malware","question":"Malware covertly monitors a user's browsing habits and harvests activity data without consent, but does not specifically log keystrokes. Which type is it?","options":["keylogger","bloatware","spyware","rootkit"],"correctIndex":2,"explanation":"spyware. It secretly gathers a broad range of user activity. The tell: spyware = secretly collects activity; keylogger = records keystrokes specifically; bloatware = unwanted preinstalled software; rootkit = kernel-level hiding for persistence."},{"id":"q143","domain":"D2","family":"ddos-network","question":"An attacker sends tiny queries to open DNS resolvers that each generate responses dozens of times larger, and it is this response-to-request size multiplier that overwhelms the victim. Which DDoS characteristic does this describe?","options":["reflected DDoS","amplified DDoS","on-path attack","credential replay"],"correctIndex":1,"explanation":"amplified DDoS. A small request yields a hugely larger response directed at the victim. The tell: amplified = small request produces a giant response; reflected = spoof the victim's source so third parties reply to the victim; on-path = attacker sits between two parties; credential replay = capture and resend valid credentials."},{"id":"q144","domain":"D2","family":"ddos-network","question":"An attacker spoofs the victim's IP as the source so that many innocent third-party servers send all of their replies to the victim instead of the attacker. Which attack is this?","options":["amplified DDoS","on-path attack","reflected DDoS","DNS attack"],"correctIndex":2,"explanation":"reflected DDoS. Spoofing the victim's source address makes third parties bounce traffic to the victim. The tell: reflected = spoofed victim source, third parties reply to victim; amplified = small request yields a huge response; on-path = attacker positioned between the parties; DNS attack = poisoning or hijacking name resolution."},{"id":"q145","domain":"D2","family":"ddos-network","question":"An attacker quietly positions between a user and the gateway, relaying and altering the traffic flowing in both directions. Which attack is this?","options":["credential replay","reflected DDoS","DNS attack","on-path attack"],"correctIndex":3,"explanation":"on-path attack. The attacker sits between two parties to read and modify traffic. The tell: on-path = attacker between the two parties reading/altering traffic; credential replay = resend captured valid credentials; reflected DDoS = spoofed source floods the victim; DNS attack = tamper with name resolution."},{"id":"q146","domain":"D2","family":"ddos-network","question":"An attacker captures a valid session token off the wire and resends it later to authenticate as the legitimate user. Which attack is this?","options":["credential replay","on-path attack","amplified DDoS","DNS attack"],"correctIndex":0,"explanation":"credential replay. Captured valid credentials or tokens are reused to impersonate the user. The tell: credential replay = capture and resend valid credentials/session; on-path = actively sit between the parties; amplified DDoS = tiny request yields a huge response; DNS attack = poison or hijack name resolution."},{"id":"q147","domain":"D2","family":"ddos-network","question":"An attacker poisons a resolver's cache so users typing the bank's domain are silently sent to a fraudulent server. Which attack is this?","options":["reflected DDoS","DNS attack","credential replay","on-path attack"],"correctIndex":1,"explanation":"DNS attack. It corrupts name resolution to redirect victims. The tell: DNS attack = poison or hijack name resolution; reflected DDoS = spoofed victim source floods the victim; credential replay = resend captured valid credentials; on-path = attacker positioned between the two parties."},{"id":"q148","domain":"D2","family":"ddos-network","question":"An attacker sets up a rogue access point broadcasting the same SSID as the corporate Wi-Fi to lure devices into connecting. Which category of attack is this?","options":["DNS attack","credential replay","amplified DDoS","wireless attack"],"correctIndex":3,"explanation":"wireless attack. It abuses the wireless medium with a rogue access point. The tell: wireless attack = target the Wi-Fi or radio layer (rogue AP, evil twin); DNS attack = tamper with name resolution; credential replay = resend captured credentials; amplified DDoS = a small request yields a huge response."},{"id":"q149","domain":"D2","family":"ddos-network","question":"What primarily distinguishes an amplified DDoS from a reflected DDoS?","options":["Amplification exploits a large response-to-request size ratio, while reflection spoofs the victim's source so third parties reply to the victim.","They are identical attacks.","Reflection uses malware while amplification uses phishing.","Amplification only works against DNS servers."],"correctIndex":0,"explanation":"amplification exploits the response-size multiplier, while reflection spoofs the victim's source so third parties reply to the victim. Amplification is about response size, reflection about a spoofed source. The tell: amplified = small request yields a huge response; reflected = spoof victim source so third parties reply to the victim; the two are often combined but are distinct mechanisms."},{"id":"q150","domain":"D2","family":"app-attacks","question":"An attacker uses ../../ sequences in a URL to read the server's /etc/passwd file located outside the web root. Which attack is this?","options":["injection","directory traversal","request forgery (CSRF)","replay attack"],"correctIndex":1,"explanation":"directory traversal. Path sequences climb out of the web root to reach unauthorized files. The tell: directory traversal = ../ path tricks to read files outside the web root; injection = insert malicious input into an interpreter; request forgery = trick a user into sending a state-changing request; replay = resend captured valid traffic."},{"id":"q151","domain":"D2","family":"app-attacks","question":"A logged-in user clicks an attacker's link that silently submits a hidden fund-transfer request using the user's active session. Which attack is this?","options":["privilege escalation","replay attack","request forgery (CSRF)","directory traversal"],"correctIndex":2,"explanation":"request forgery (CSRF). The victim's authenticated session is abused to send a state-changing request they did not intend. The tell: request forgery = trick a user's browser into a state-changing action; privilege escalation = gain rights beyond those granted; replay = resend captured traffic; directory traversal = ../ file-path abuse."},{"id":"q152","domain":"D2","family":"app-attacks","question":"A standard user exploits a flaw to gain administrator rights far beyond what they were assigned. Which attack is this?","options":["injection","request forgery (CSRF)","replay attack","privilege escalation"],"correctIndex":3,"explanation":"privilege escalation. The attacker elevates to higher rights than were granted. The tell: privilege escalation = gain higher rights than assigned; injection = insert malicious input into an interpreter; request forgery = trick a user into a state-changing request; replay = resend captured valid traffic."},{"id":"q153","domain":"D2","family":"app-attacks","question":"An attacker records a legitimate API request and later resends the identical request to repeat the action, such as re-triggering a payment. Which attack is this?","options":["injection","replay attack","request forgery (CSRF)","directory traversal"],"correctIndex":1,"explanation":"replay attack. Captured valid traffic is retransmitted to repeat an action. The tell: replay = resend captured valid traffic; injection = insert malicious input into an interpreter; request forgery = trick a user's browser into a state-changing request; directory traversal = ../ path tricks to read files outside the web root."},{"id":"q154","domain":"D2","family":"app-attacks","question":"Which attack category inserts malicious input into an interpreter so the input is executed as a command?","options":["directory traversal","request forgery (CSRF)","injection","replay attack"],"correctIndex":2,"explanation":"injection. Untrusted input is executed by an interpreter. The tell: injection = insert malicious input into an interpreter; directory traversal = ../ path tricks to reach files outside the web root; request forgery = trick a user into a state-changing request; replay = resend captured valid traffic."},{"id":"q155","domain":"D2","family":"crypto-attacks","question":"An attacker interferes with a TLS handshake to force the client and server to fall back to an old, weak SSL cipher. Which attack is this?","options":["downgrade attack","collision attack","birthday attack","rainbow table attack"],"correctIndex":0,"explanation":"downgrade attack. It coerces the parties into a weaker protocol or cipher. The tell: downgrade = force a weaker protocol/cipher such as TLS to SSL; collision = two inputs share one hash; birthday = probability trick that finds collisions faster; rainbow table = precomputed hash lookups to crack passwords."},{"id":"q156","domain":"D2","family":"crypto-attacks","question":"Finding two different inputs that produce the exact same hash output is which attack?","options":["downgrade attack","collision attack","birthday attack","brute-force attack"],"correctIndex":1,"explanation":"collision attack. Two distinct inputs map to an identical hash. The tell: collision = two inputs, same hash; downgrade = force a weaker cipher; birthday = probability method that speeds up finding collisions; brute-force = exhaustively try every possibility."},{"id":"q157","domain":"D2","family":"crypto-attacks","question":"A probabilistic method that exploits the math of shared coincidences to find hash collisions far faster than expected is the ___ attack.","options":["collision attack","downgrade attack","birthday attack","rainbow table attack"],"correctIndex":2,"explanation":"birthday attack. It uses the birthday paradox to locate collisions with fewer attempts than intuition suggests. The tell: birthday = probability shortcut to collisions; collision = simply two inputs sharing a hash; downgrade = force a weaker protocol; rainbow table = precomputed hash lookups."},{"id":"q158","domain":"D2","family":"crypto-attacks","question":"A researcher produces two completely different files that generate an identical hash digest, letting a malicious file pose as a trusted one. Which attack does this exemplify?","options":["downgrade attack","birthday attack","rainbow table attack","collision attack"],"correctIndex":3,"explanation":"collision attack. Two distinct inputs map to the same hash. The tell: collision = two different inputs, same hash; birthday = a probability shortcut that finds collisions faster; downgrade = force a weaker protocol or cipher; rainbow table = precomputed hash lookups to crack passwords."},{"id":"q159","domain":"D2","family":"crypto-attacks","question":"During connection setup, an attacker strips the strong cipher options so the two endpoints negotiate an obsolete, breakable algorithm. Which attack is this?","options":["birthday attack","downgrade attack","collision attack","brute-force attack"],"correctIndex":1,"explanation":"downgrade attack. It forces the parties onto a weaker cipher. The tell: downgrade = force a weaker protocol or cipher; birthday = probability trick to find collisions; collision = two inputs sharing a hash; brute-force = exhaustively try every possibility."},{"id":"q160","domain":"D2","family":"crypto-attacks","question":"How does a birthday attack relate to a collision attack?","options":["A birthday attack is a probability technique that finds hash collisions faster than brute force.","A birthday attack downgrades ciphers to weaker versions.","A collision attack only works against encryption keys, not hashes.","They are unrelated to one another."],"correctIndex":0,"explanation":"a birthday attack is a probability technique that finds hash collisions faster than brute force. It leverages the birthday paradox to reach a collision sooner. The tell: birthday = probability shortcut to collisions; collision = simply two inputs sharing one hash; downgrade = force a weaker protocol; brute-force = try every possibility exhaustively."},{"id":"q161","domain":"D2","family":"password-attacks","question":"An attacker tries just three very common passwords against 5,000 different accounts, deliberately staying under each account's lockout threshold. Which attack is this?","options":["dictionary attack","brute force","credential stuffing","password spraying"],"correctIndex":3,"explanation":"password spraying. A few common passwords are tried broadly across many accounts to dodge lockouts. The tell: spraying = few passwords across many accounts; dictionary = a wordlist against an account; brute force = exhaust all combinations on one account; credential stuffing = reuse breached username/password pairs."},{"id":"q162","domain":"D2","family":"password-attacks","question":"An attacker targets one specific admin account and exhaustively tries every possible character combination until one works. Which attack is this?","options":["brute force","password spraying","dictionary attack","credential stuffing"],"correctIndex":0,"explanation":"brute force. Exhaustively trying all combinations against a single account. The tell: brute force = try every combination on one account; spraying = a few passwords across many accounts; dictionary = try a curated wordlist; credential stuffing = replay breached credential pairs."},{"id":"q163","domain":"D2","family":"password-attacks","question":"Trying passwords drawn from a curated wordlist of likely and commonly used terms against an account is a ___ attack.","options":["password spraying","dictionary attack","credential stuffing","brute force"],"correctIndex":1,"explanation":"dictionary attack. It runs a wordlist of probable passwords rather than every combination. The tell: dictionary = wordlist of likely passwords; spraying = a few passwords across many accounts; credential stuffing = reuse breached pairs; brute force = exhaustively try all combinations."},{"id":"q164","domain":"D2","family":"password-attacks","question":"Attempting a small set of very common passwords across a large number of different accounts to avoid triggering lockouts is called ___.","options":["brute force","dictionary attack","password spraying","credential stuffing"],"correctIndex":2,"explanation":"password spraying. A few passwords are tried broadly to stay under lockout limits. The tell: spraying = a few passwords across many accounts; brute force = exhaust all combinations on one account; dictionary = try a wordlist against an account; credential stuffing = reuse breached username/password pairs."},{"id":"q165","domain":"D2","family":"password-attacks","question":"What is the key difference between a brute-force attack and password spraying?","options":["Brute force hammers one account with many guesses, while spraying tries a few passwords across many accounts.","They are the same attack.","Brute force uses a wordlist, while spraying uses breached credentials.","Spraying always locks out every account it touches."],"correctIndex":0,"explanation":"brute force hammers one account with many guesses, while spraying tries a few passwords across many accounts. Brute force concentrates on one target, spraying spreads thin to dodge lockouts. The tell: brute force = exhaust combinations on one account; spraying = a few passwords across many accounts; dictionary = a wordlist against an account; credential stuffing = replay breached pairs."},{"id":"q166","domain":"D2","family":"password-attacks","question":"An attacker feeds a list of the 10,000 most common leaked passwords into a cracking tool aimed at a single captured password hash. Which attack is this?","options":["password spraying","dictionary attack","brute force","credential stuffing"],"correctIndex":1,"explanation":"dictionary attack. It runs a curated wordlist rather than every possible combination. The tell: dictionary = a wordlist of likely passwords; spraying = a few passwords across many accounts; brute force = exhaustively try all combinations; credential stuffing = reuse breached credential pairs."},{"id":"q167","domain":"D2","family":"indicators","question":"A user logs in from New York and, eight minutes later, a second successful login for the same account appears from Singapore. Which indicator is this?","options":["concurrent session usage","account lockout","impossible travel","out-of-cycle logging"],"correctIndex":2,"explanation":"impossible travel. Two logins are too far apart geographically to be physically possible in the time elapsed. The tell: impossible travel = distant logins too close in time; concurrent session usage = same account active in multiple sessions at once; account lockout = failed attempts locking the account; out-of-cycle logging = log entries at unusual times."},{"id":"q168","domain":"D2","family":"indicators","question":"Analysts find the security log has a two-hour gap right around the time of a suspected breach, hinting at tampering. Which indicator is this?","options":["out-of-cycle logging","blocked content","resource inaccessibility","missing logs"],"correctIndex":3,"explanation":"missing logs. Gaps in the record suggest deletion or tampering. The tell: missing logs = gaps that imply tampering; out-of-cycle logging = entries at unusual times; blocked content = filtering stopping access; resource inaccessibility = services suddenly unavailable."},{"id":"q169","domain":"D2","family":"indicators","question":"Overnight, batch job log entries appear timestamped at 3 a.m. when no jobs are ever scheduled to run at that hour. Which indicator is this?","options":["out-of-cycle logging","missing logs","impossible travel","concurrent session usage"],"correctIndex":0,"explanation":"out-of-cycle logging. Activity logged at abnormal times signals something unexpected. The tell: out-of-cycle logging = entries at unusual times; missing logs = gaps suggesting tampering; impossible travel = distant logins too close in time; concurrent session usage = one account active in multiple sessions."},{"id":"q170","domain":"D2","family":"indicators","question":"Multiple critical file shares suddenly become unavailable to all staff at once, a possible sign of ransomware or a denial-of-service event. Which indicator is this?","options":["resource consumption","resource inaccessibility","account lockout","blocked content"],"correctIndex":1,"explanation":"resource inaccessibility. Services abruptly become unreachable, a hallmark of ransomware or DoS. The tell: resource inaccessibility = services suddenly unavailable; resource consumption = abnormal spike in CPU, memory, or bandwidth; account lockout = an account locked by failed logins; blocked content = filtering denying access."},{"id":"q171","domain":"D2","family":"indicators","question":"The same user account is simultaneously logged in and active from three different IP addresses in different cities at once. Which indicator is this?","options":["impossible travel","concurrent session usage","account lockout","out-of-cycle logging"],"correctIndex":1,"explanation":"concurrent session usage. One account is active in multiple sessions at the same time. The tell: concurrent session usage = same account active in multiple sessions at once; impossible travel = distant logins too close in time to be physical; account lockout = failed attempts locking the account; out-of-cycle logging = entries at unusual times."},{"id":"q172","domain":"D2","family":"indicators","question":"Monitoring shows a server's CPU and outbound bandwidth pinned near 100 percent, far above baseline, with no legitimate cause. Which indicator is this?","options":["resource inaccessibility","blocked content","missing logs","resource consumption"],"correctIndex":3,"explanation":"resource consumption. An abnormal spike in resource usage points to malicious activity. The tell: resource consumption = abnormal spike in CPU, memory, or bandwidth; resource inaccessibility = services suddenly unavailable; blocked content = filtering denying access; missing logs = gaps suggesting tampering."},{"id":"q173","domain":"D2","family":"indicators","question":"Employees report being repeatedly locked out each morning, coinciding with bursts of failed logins from an unknown host. Which indicator is this?","options":["account lockout","concurrent session usage","impossible travel","blocked content"],"correctIndex":0,"explanation":"account lockout. Repeated failed logins trip the lockout threshold. The tell: account lockout = failed attempts locking accounts; concurrent session usage = one account active in multiple sessions at once; impossible travel = distant logins too close in time; blocked content = filtering denying access."},{"id":"q174","domain":"D2","family":"mitigations","question":"To limit lateral movement, the network team splits a flat LAN into separate VLAN zones for finance, HR, and guests. Which mitigation is this?","options":["decommissioning","isolation","segmentation","configuration enforcement"],"correctIndex":2,"explanation":"segmentation. Dividing the network into separate zones to contain movement. The tell: segmentation = split the network into zones; isolation = fully cut a single host off; decommissioning = securely retire an asset; configuration enforcement = push and hold a secure config."},{"id":"q175","domain":"D2","family":"mitigations","question":"Allowing ONLY explicitly approved programs to execute and blocking everything else by default is which mitigation?","options":["least privilege","configuration enforcement","patching","application allow list"],"correctIndex":3,"explanation":"application allow list. Only sanctioned applications are permitted to run. The tell: application allow list = only approved apps may run; least privilege = minimum rights needed for a task; configuration enforcement = push and hold a secure config; patching = fix known flaws in software."},{"id":"q176","domain":"D2","family":"mitigations","question":"A compromised host is immediately cut off from all network connectivity so it can communicate with nothing while it is investigated. Which mitigation is this?","options":["isolation","segmentation","decommissioning","least privilege"],"correctIndex":0,"explanation":"isolation. The single host is fully severed from the network. The tell: isolation = fully cut one host off; segmentation = divide the network into zones; decommissioning = securely retire an asset; least privilege = grant only the minimum rights needed."},{"id":"q177","domain":"D2","family":"mitigations","question":"A junior analyst is granted only the exact read access needed for their task and nothing more, limiting what a compromise of their account could reach. Which mitigation is this?","options":["configuration enforcement","least privilege","segmentation","patching"],"correctIndex":1,"explanation":"least privilege. Access is held to the minimum required for the task. The tell: least privilege = minimum rights needed; configuration enforcement = push and hold a secure config; segmentation = split the network into zones; patching = fix known software flaws."},{"id":"q178","domain":"D2","family":"mitigations","question":"An old file server is powered down, its data securely wiped, and it is formally removed from the asset inventory and the network. Which mitigation is this?","options":["isolation","patching","decommissioning","hardening"],"correctIndex":2,"explanation":"decommissioning. The asset is securely retired and removed from service. The tell: decommissioning = securely retire an asset; isolation = fully cut a live host off the network; patching = fix known flaws; hardening = reduce the attack surface of a system in use."},{"id":"q179","domain":"D3","family":"containerization","question":"A DevOps team packages an application with only its libraries and dependencies so that it shares the host operating system kernel and starts in seconds. Which technology are they using?","options":["containerization","virtualization","serverless","microservices"],"correctIndex":0,"explanation":"containerization. Sharing the host kernel and bundling only the app plus its dependencies is the lightweight container model. The tell: containerization = shares host kernel, packages app plus deps; virtualization = full guest OS per VM on a hypervisor; serverless = provider runs your functions with no server to manage; microservices = one app split into small independent services."},{"id":"q180","domain":"D3","family":"containerization","question":"A cloud model where the provider fully manages the underlying servers and runs your code as event-triggered functions billed per execution is called what?","options":["virtualization","containerization","serverless","microservices"],"correctIndex":2,"explanation":"serverless. No server to provision or manage plus per-execution billing of functions is the serverless model. The tell: serverless = provider runs functions, no server to manage; virtualization = full guest OS per VM; containerization = shares host kernel with bundled deps; microservices = app split into small independent services."},{"id":"q181","domain":"D3","family":"containerization","question":"An operations team provisions and configures its entire cloud environment from declarative template files kept in version control, so rebuilds are fully automated and repeatable. What is this practice?","options":["virtualization","containerization","microservices","infrastructure as code (IaC)"],"correctIndex":3,"explanation":"infrastructure as code (IaC). Provisioning infrastructure from declarative, version-controlled templates is IaC. The tell: infrastructure as code = provision infrastructure from code/templates; virtualization = full guest OS per VM; containerization = shares host kernel with bundled deps; microservices = app split into small independent services."},{"id":"q182","domain":"D3","family":"containerization","question":"A hosting provider runs several isolated servers on one physical machine, each carrying its own complete guest operating system managed by a hypervisor. Which technology is this?","options":["Containerization","Serverless","Microservices","Virtualization"],"correctIndex":3,"explanation":"Virtualization. Each guest ships a full OS on a hypervisor, unlike containers that share the host kernel. The tell: containerization = share the host kernel, package app plus dependencies only; serverless = provider runs event-triggered functions with no server to manage; microservices = one app split into small independent services."},{"id":"q183","domain":"D3","family":"containerization","question":"An e-commerce platform is broken into small, independently deployable services such as cart, payment, and catalog that communicate over APIs and scale separately. Which design is this?","options":["Microservices","Containerization","Virtualization","Serverless"],"correctIndex":0,"explanation":"Microservices. Splitting one app into small, independently deployed and scaled services is the microservices pattern. The tell: containerization = shared-kernel packaging of app plus dependencies; virtualization = a full guest OS per VM on a hypervisor; serverless = provider-run event functions."},{"id":"q184","domain":"D3","family":"containerization","question":"Compared with running full virtual machines, which approach is lighter because the packaged units share the host operating system kernel instead of each shipping a complete guest OS?","options":["Virtualization","Serverless","Containerization","IaC"],"correctIndex":2,"explanation":"Containerization. Sharing the host kernel avoids a full guest OS per instance, so containers are lighter than VMs. The tell: virtualization = full guest OS per VM on a hypervisor; serverless = provider runs functions with no servers to manage; IaC = provision infrastructure from code or templates."},{"id":"q185","domain":"D3","family":"isolation-models","question":"A defense contractor keeps a classified analysis workstation with no network cabling, no wireless, and data moved only by inspected removable media. Which isolation model is this?","options":["logical segmentation","SDN","on-premises","air-gapped"],"correctIndex":3,"explanation":"air-gapped. A total physical disconnection from any network is an air gap. The tell: air-gapped = physically no network connection; logical segmentation = VLAN/subnet separation on shared hardware; SDN = software-controlled network via control/data plane split; on-premises = hosted in your own facility."},{"id":"q186","domain":"D3","family":"isolation-models","question":"Separating departments into different VLANs and subnets that ride the same physical switches, with no physical isolation, is best described as what?","options":["air-gapped","SDN","logical segmentation","decentralized"],"correctIndex":2,"explanation":"logical segmentation. Separating traffic by VLAN or subnet on shared hardware is logical, not physical, isolation. The tell: logical segmentation = VLAN/subnet separation on shared hardware; air-gapped = physically no network connection; SDN = software-controlled network via control/data plane split; decentralized = distributed control across many points."},{"id":"q187","domain":"D3","family":"isolation-models","question":"A network team manages forwarding behavior centrally through a software controller that programs the switches, cleanly separating the control plane from the data plane. What is this?","options":["SDN","air-gapped","logical segmentation","centralized"],"correctIndex":0,"explanation":"SDN. Separating the control plane from the data plane and programming forwarding via a software controller defines software-defined networking. The tell: SDN = control/data plane split via software controller; air-gapped = no network connection at all; logical segmentation = VLAN/subnet separation; centralized = a single point of control generally."},{"id":"q188","domain":"D3","family":"isolation-models","question":"An organization routes every configuration and management decision through one control point that all devices depend on. Which model does this describe?","options":["Decentralized","Centralized","Air-gapped","Logical segmentation"],"correctIndex":1,"explanation":"Centralized. One control point that everything depends on is centralized management. The tell: decentralized = control distributed across many independent points; air-gapped = physically no network connection at all; logical segmentation = VLANs or subnets separating traffic on shared hardware."},{"id":"q189","domain":"D3","family":"isolation-models","question":"Authority for decisions is spread across many independent nodes so that no single node is in charge. Which model is this?","options":["Centralized","Air-gapped","Decentralized","SDN"],"correctIndex":2,"explanation":"Decentralized. Distributing control across many independent nodes with no single authority is decentralized. The tell: centralized = one control point everything depends on; air-gapped = physically isolated with no network link; SDN = a software controller that splits the control plane from the data plane."},{"id":"q190","domain":"D3","family":"embedded-systems","question":"A water utility uses a supervisory system to monitor and control pumping stations spread across hundreds of miles, collecting telemetry and issuing commands from a central control room. Which term fits best?","options":["IoT","RTOS","ICS","SCADA"],"correctIndex":3,"explanation":"SCADA. Wide-area supervisory monitoring and control of remote industrial sites is SCADA. The tell: SCADA = wide-area supervisory layer that monitors/controls ICS; ICS = the industrial control systems running the physical process; IoT = internet-connected consumer/smart devices; RTOS = OS with guaranteed real-time timing."},{"id":"q191","domain":"D3","family":"embedded-systems","question":"An operating system that guarantees deterministic response within strict time limits, used in airbag controllers and medical infusion pumps, is called what?","options":["RTOS","embedded systems","IoT","ICS"],"correctIndex":0,"explanation":"RTOS. Guaranteed timing for real-time tasks is the defining trait of a real-time operating system. The tell: RTOS = OS with guaranteed real-time timing; embedded system = special-purpose computer inside a larger device; IoT = internet-connected smart devices; ICS = industrial control systems running physical processes."},{"id":"q192","domain":"D3","family":"embedded-systems","question":"A household installs internet-connected smart thermostats, cameras, and doorbells that report to a phone app. Which category do these consumer devices fall under?","options":["ICS","IoT","SCADA","RTOS"],"correctIndex":1,"explanation":"IoT. Internet-connected consumer smart devices are the Internet of Things. The tell: ICS = industrial control systems that run physical processes; SCADA = the supervisory layer that monitors and controls ICS over wide areas; RTOS = an operating system with guaranteed real-time timing."},{"id":"q193","domain":"D3","family":"embedded-systems","question":"A manufacturing plant uses networked controllers and sensors to directly operate and regulate assembly-line machinery on the factory floor. Which term best describes these systems?","options":["IoT","RTOS","ICS","SCADA"],"correctIndex":2,"explanation":"ICS. Industrial control systems directly operate physical processes on the plant floor. The tell: IoT = internet-connected consumer smart devices; RTOS = a real-time OS with guaranteed timing; SCADA = the supervisory layer that monitors and controls ICS across wide areas, rather than the floor-level machinery control itself."},{"id":"q194","domain":"D3","family":"arch-considerations","question":"The architectural property of absorbing component failures while continuing to serve users and recovering automatically is best described as what?","options":["availability","resilience","scalability","responsiveness"],"correctIndex":1,"explanation":"resilience. Continuing to serve and self-recover through failure is resilience, not simply being up right now. The tell: resilience = recover and keep serving under failure; availability = uptime at this moment; scalability = grow to handle more load; responsiveness = latency of the response."},{"id":"q195","domain":"D3","family":"arch-considerations","question":"Unable to fully eliminate a threat, an organization buys cyber insurance to shift the financial impact of a potential breach to a third party. Which architecture consideration does this reflect?","options":["risk transference","resilience","scalability","cost"],"correctIndex":0,"explanation":"risk transference. Shifting the financial impact to a third party such as an insurer is risk transference. The tell: risk transference = shift risk to a third party (insurance/vendor); resilience = recover and keep serving under failure; scalability = grow to handle more load; cost = the expense of the design itself."},{"id":"q196","domain":"D3","family":"arch-considerations","question":"A streaming service designs its platform so it can smoothly add capacity to absorb a tenfold jump in concurrent viewers during a live event. Which architecture consideration is this?","options":["Scalability","Resilience","Responsiveness","Availability"],"correctIndex":0,"explanation":"Scalability. The ability to grow to handle more load is scalability. The tell: resilience = recover and keep serving under failure; responsiveness = the latency of the response; availability = whether the service is up right now."},{"id":"q197","domain":"D3","family":"arch-considerations","question":"Which architecture consideration specifically concerns how quickly a system returns an answer to a user request, measured as latency?","options":["Availability","Scalability","Responsiveness","Resilience"],"correctIndex":2,"explanation":"Responsiveness. It is about latency, how fast a request is answered. The tell: availability = whether the service is up at all; scalability = the ability to grow with load; resilience = recovering and continuing to serve under failure."},{"id":"q198","domain":"D3","family":"fail-modes","question":"A network firewall loses connectivity to its management system and, by configuration, continues to pass all traffic so the business stays online. Which behavior is this?","options":["fail-open","fail-closed","fail-secure","fail-safe"],"correctIndex":0,"explanation":"fail-open. Permitting traffic on failure to favor availability is fail-open. The tell: fail-open = permits traffic on failure (favors availability); fail-closed = blocks traffic on failure (favors security), the network pair with fail-open; fail-secure = a physical lock that stays locked on power loss to protect assets; fail-safe = a physical lock that unlocks on power loss to protect people."},{"id":"q199","domain":"D3","family":"fail-modes","question":"When a data center loses power, the electronic maglocks on its doors release so occupants can evacuate. Because the design prioritizes protecting human life over securing the room, which failure mode term best describes it?","options":["fail-open","fail-closed","fail-secure","fail-safe"],"correctIndex":3,"explanation":"fail-safe. Unlocking on power loss to protect human life is fail-safe. The tell: fail-safe = physical lock unlocks on power loss to protect people (life safety); fail-secure = physical lock stays locked on power loss to protect assets; fail-open = network control that permits traffic on failure; fail-closed = network control that blocks traffic on failure."},{"id":"q200","domain":"D3","family":"fail-modes","question":"A network access control gateway is configured so that if it cannot reach its policy server, it denies all traffic rather than risk letting anything through. Which behavior is this?","options":["fail-open","fail-safe","fail-closed","fail-secure"],"correctIndex":2,"explanation":"fail-closed. Blocking traffic on failure to favor security is fail-closed, the network pair of fail-open. The tell: fail-closed = blocks traffic on failure (favors security); fail-open = permits traffic on failure (favors availability); fail-safe = physical lock unlocks on power loss for people; fail-secure = physical lock stays locked on power loss for assets."},{"id":"q201","domain":"D3","family":"fail-modes","question":"A vault door is wired so that if building power is lost, the electronic lock stays locked to keep the contents protected. Which failure mode is this?","options":["Fail-safe","Fail-secure","Fail-open","Fail-closed"],"correctIndex":1,"explanation":"Fail-secure. On failure the door stays locked to protect assets. The tell: fail-safe = the door unlocks on failure to protect people (life safety); fail-open and fail-closed = the network-device pair (permit versus block traffic), not physical door locks."},{"id":"q202","domain":"D3","family":"fail-modes","question":"For a network device, which failure mode favors availability by continuing to permit traffic when the device can no longer enforce its rules?","options":["Fail-closed","Fail-secure","Fail-safe","Fail-open"],"correctIndex":3,"explanation":"Fail-open. On failure the network device keeps permitting traffic, favoring availability. The tell: fail-closed = blocks traffic on failure to favor security; fail-safe and fail-secure = the physical door-lock pair (unlock for life safety versus stay locked for assets), not network devices."},{"id":"q203","domain":"D3","family":"fail-modes","question":"An inline content filter is configured so that if its scanning engine crashes, it stops forwarding packets entirely rather than let unfiltered traffic pass. Which behavior is this?","options":["Fail-open","Fail-secure","Fail-safe","Fail-closed"],"correctIndex":3,"explanation":"Fail-closed. On failure the network device blocks traffic, favoring security over availability. The tell: fail-open = permits traffic on failure to favor availability; fail-safe and fail-secure = physical door locks (unlock for life safety versus stay locked for assets), not network devices."},{"id":"q204","domain":"D3","family":"active-passive","question":"A monitoring sensor is cabled to a switch SPAN port, where it receives a mirrored copy of network traffic rather than sitting in the traffic path. Which connection method is this?","options":["active","inline","passive","tap/monitor"],"correctIndex":3,"explanation":"tap/monitor. Receiving a mirrored copy via a SPAN port or tap, unable to affect the live flow, is a tap/monitor deployment. The tell: tap/monitor = receives a mirrored copy via SPAN/tap, cannot affect traffic; inline = traffic actually flows through the device; active = device role that can block; passive = device role that only observes."},{"id":"q205","domain":"D3","family":"active-passive","question":"A prevention appliance is installed directly in the traffic path so every packet must pass through it, allowing it to drop malicious packets in real time. Which deployment is this?","options":["tap/monitor","inline","passive","active"],"correctIndex":1,"explanation":"inline. Sitting in the path so all traffic flows through it is an inline deployment. The tell: inline = traffic flows through the device (can drop); tap/monitor = receives only a mirrored copy; active = the role of a device that can block; passive = observes only, cannot block."},{"id":"q206","domain":"D3","family":"active-passive","question":"Which term describes a device's role when it can only observe traffic and has no ability to block or modify it?","options":["inline","tap/monitor","active","passive"],"correctIndex":3,"explanation":"passive. A device that only observes and cannot block is passive by role. The tell: passive = observes only, cannot block (role); active = in-path role that can block; inline = deployment where traffic flows through; tap/monitor = deployment receiving a mirrored copy."},{"id":"q207","domain":"D3","family":"active-passive","question":"In terms of its role, a device that can drop or modify packets in real time, as opposed to one that can only watch, is described as what?","options":["Active","Passive","Inline","Tap"],"correctIndex":0,"explanation":"Active. On the role axis, a device that can act on traffic (block or modify) is active, versus passive which only watches. The tell: passive = observes only and cannot block; inline = a placement term (traffic flows through it), not the act-versus-observe role; tap = the connection that feeds a mirrored copy to a passive device."},{"id":"q208","domain":"D3","family":"active-passive","question":"A security appliance is cabled so that all production traffic physically flows through it between two network segments. Which placement term describes this?","options":["Tap","Inline","Passive","Active"],"correctIndex":1,"explanation":"Inline. Traffic physically passing through the device is inline placement. The tell: tap = a connection that mirrors a copy off to the side; passive = a role that can only observe; active = the role capable of blocking, which an inline device can be, but the question asks about placement."},{"id":"q209","domain":"D3","family":"active-passive","question":"An analyzer receives only a mirrored copy of traffic and can never drop a packet, so in terms of acting on traffic its role is best described as what?","options":["Inline","Active","Tap","Passive"],"correctIndex":3,"explanation":"Passive. A device that can only observe and never block has a passive role. The tell: active = can block or modify in the path; inline = a placement where traffic flows through the device; tap = the connection method feeding the mirrored copy, but the resulting role is passive."},{"id":"q210","domain":"D3","family":"jump-proxy","question":"Unlike a proxy server, which brokers and filters client requests to services, which system is a hardened gateway host that administrators connect through to reach internal machines?","options":["proxy server","jump server","reverse proxy","forward proxy"],"correctIndex":1,"explanation":"jump server. A hardened admin pivot host you connect through to manage internal systems is a jump server. The tell: jump server = hardened admin pivot host you connect through; proxy server = intermediary that forwards/filters client requests; reverse proxy = sits in front of servers handling inbound client requests; forward proxy = sits in front of internal clients making outbound requests."},{"id":"q211","domain":"D3","family":"jump-proxy","question":"An appliance placed in front of an organization's web servers accepts all inbound client requests, filters them, caches frequently requested content, and shields the servers' internal addresses. Which system is this?","options":["reverse proxy","jump server","forward proxy","load balancer"],"correctIndex":0,"explanation":"reverse proxy. Brokering inbound client traffic in front of servers, with filtering, caching, and server shielding, is a reverse proxy. The tell: reverse proxy = broker in front of servers for inbound client traffic; forward proxy = broker in front of internal clients for outbound requests; load balancer = distributes requests across multiple servers for throughput, not a request filter; jump server = hardened admin gateway pivot host."},{"id":"q212","domain":"D3","family":"jump-proxy","question":"Internal users' outbound web requests all route through a device that filters and caches them on the clients' behalf before they reach the internet. Which system is this?","options":["jump server","reverse proxy","forward proxy","load balancer"],"correctIndex":2,"explanation":"forward proxy. Brokering internal clients' outbound requests with filtering and caching is a forward proxy. The tell: forward proxy = broker for internal clients' outbound requests; reverse proxy = broker in front of servers for inbound traffic; load balancer = distributes inbound requests across multiple servers for throughput; jump server = hardened admin gateway pivot host."},{"id":"q213","domain":"D3","family":"jump-proxy","question":"Administrators must first log into one hardened gateway host, and only from there can they open management sessions to servers in the protected internal zone. Which system is this?","options":["Forward proxy","Jump server","Reverse proxy","Proxy server"],"correctIndex":1,"explanation":"Jump server. It is a hardened pivot host that admins connect through to reach internal systems. The tell: proxy server = an intermediary that forwards and filters client requests to services; forward proxy = brokers outbound client web requests; reverse proxy = fronts servers for inbound requests. A jump server is an admin access pivot, not a request broker."},{"id":"q214","domain":"D3","family":"jump-proxy","question":"Which system's defining purpose is to serve as a secure administrative pivot, giving operators a single controlled entry point into an isolated management network?","options":["Reverse proxy","Proxy server","Forward proxy","Jump server"],"correctIndex":3,"explanation":"Jump server. Its purpose is a controlled administrative pivot into a protected network. The tell: proxy server = an intermediary that forwards and filters client requests; forward proxy = brokers outbound client requests; reverse proxy = fronts servers for inbound client requests. None of the proxies is an administrative access gateway."},{"id":"q215","domain":"D3","family":"jump-proxy","question":"Which term names the single hardened intermediary host, sometimes called a bastion host, that provides a controlled choke point for administrative access into a segmented network?","options":["Jump server","Proxy server","Forward proxy","Reverse proxy"],"correctIndex":0,"explanation":"Jump server. Also called a bastion host, it is the hardened choke point for admin access into a segmented network. The tell: proxy server = a broker that forwards and filters client requests to services; forward proxy = handles outbound client web requests; reverse proxy = fronts servers for inbound client requests. The proxies broker application requests, not administrative sessions."},{"id":"q216","domain":"D3","family":"ips-ids","question":"An IDS and this control share the same detection engine, but this one is placed inline and actively drops malicious packets before they reach hosts. Which control is it?","options":["IDS","IPS","HIDS","HIPS"],"correctIndex":1,"explanation":"IPS. Same detection as an IDS but inline with the power to block makes it an IPS. The tell: IPS = inline network control that detects and blocks; IDS = detects and alerts only, passive and out of band; HIDS = host-based detection/alert on one system; HIPS = host-based prevention that blocks locally on one host."},{"id":"q217","domain":"D3","family":"ips-ids","question":"A sensor on a SPAN port watches network traffic and raises alerts when it sees suspicious patterns, but it is out of band and cannot stop anything. Which control is this?","options":["IPS","HIPS","HIDS","IDS"],"correctIndex":3,"explanation":"IDS. Out-of-band detection and alerting with no ability to block is an IDS. The tell: IDS = passive network detection and alerting, out of band; IPS = inline network detection that also blocks; HIDS = host-based detection/alert only; HIPS = host-based prevention that blocks on one host."},{"id":"q218","domain":"D3","family":"ips-ids","question":"A HIPS can block threats locally on a host. Which control also runs on a single host but only monitors and alerts, taking no blocking action?","options":["IPS","IDS","HIDS","HIPS"],"correctIndex":2,"explanation":"HIDS. A host agent that only detects and alerts, without blocking, is a HIDS. The tell: HIDS = host-based detection/alert only on one system; HIPS = host-based control that also blocks locally; IDS = network-wide detection/alert only; IPS = inline network detection that blocks."},{"id":"q219","domain":"D3","family":"ips-ids","question":"A network sensor analyzes copies of packets and raises alerts when it matches attack signatures, but by design it cannot drop or reset any connection. Which control is this?","options":["HIDS","IPS","IDS","HIPS"],"correctIndex":2,"explanation":"IDS. A network sensor that only detects and alerts, out of band, with no blocking, is an IDS. The tell: IPS = a network device that also blocks inline; HIDS = host-based detect and alert on one system; HIPS = host-based blocking. Network plus alert-only equals IDS."},{"id":"q220","domain":"D3","family":"ips-ids","question":"Deployed inline at the network edge, this control inspects every packet and automatically drops or resets connections matching malicious signatures before they reach internal hosts. Which control is it?","options":["IPS","IDS","HIDS","HIPS"],"correctIndex":0,"explanation":"IPS. Inline network placement plus active blocking makes it an IPS. The tell: IDS = network detect and alert only, out of band; HIDS = host-based detect and alert; HIPS = host-based blocking on a single endpoint. Same detection engine, different response and placement."},{"id":"q221","domain":"D3","family":"ips-ids","question":"IDS and IPS use the same detection methods. Which statement correctly captures the core difference between them?","options":["The IDS blocks traffic inline while the IPS only alerts","Both are inline but only the IDS can modify packets","The IDS runs only on hosts while the IPS runs only on networks","The IPS is placed inline and can block traffic while the IDS is out of band and only alerts"],"correctIndex":3,"explanation":"The IPS is inline and blocks, the IDS is out of band and only alerts. That placement-and-response split is the whole distinction. The tell: IDS = detect and alert only, passive, out of band; IPS = detect and block, active, inline; the detection engine is identical in both."},{"id":"q222","domain":"D3","family":"firewalls","question":"A security team deploys a device specifically to inspect HTTP requests to a public web application and block SQL injection and cross-site scripting attempts. Which device is this?","options":["NGFW","WAF","UTM","Layer 4 firewall"],"correctIndex":1,"explanation":"WAF. Protecting a web application from injection and cross-site scripting at the application layer is a web application firewall. The tell: WAF = protects web apps from injection/XSS at Layer 7; NGFW = app-aware firewall with deep inspection and identity; UTM = all-in-one appliance bundling many security functions; Layer 4 firewall = filters only by port and IP."},{"id":"q223","domain":"D3","family":"firewalls","question":"A single all-in-one appliance that bundles firewalling, antivirus, intrusion prevention, and content filtering into one box is known as what?","options":["UTM","WAF","NGFW","Layer 7 firewall"],"correctIndex":0,"explanation":"UTM. Bundling many security functions into one appliance is unified threat management. The tell: UTM = one appliance bundling many security functions; WAF = protects web apps from injection/XSS; NGFW = app-aware firewall with deep packet inspection and identity; Layer 7 firewall = filters by application-layer content."},{"id":"q224","domain":"D3","family":"firewalls","question":"A Layer 4 firewall filters only by port and IP address. Which firewall type extends this with application awareness, deep packet inspection, and user identity integration?","options":["WAF","UTM","NGFW","Layer 4 firewall"],"correctIndex":2,"explanation":"NGFW. Adding application awareness, deep inspection, and identity to traditional filtering defines a next-generation firewall. The tell: NGFW = adds app awareness, deep inspection, and identity; Layer 4 firewall = filters only by port and IP; WAF = protects web apps from injection/XSS; UTM = all-in-one bundle of security functions."},{"id":"q225","domain":"D3","family":"firewalls","question":"A firewall makes allow and deny decisions purely on source and destination IP addresses and TCP or UDP port numbers, with no awareness of the application data inside. At which layer does it operate?","options":["Layer 7","Layer 4","WAF","NGFW"],"correctIndex":1,"explanation":"Layer 4. Filtering only by IP and port with no application awareness is Layer 4 filtering. The tell: Layer 7 = inspects application content; WAF = Layer 7 protection specifically for web apps; NGFW = adds application awareness and deep inspection on top of Layer 4 filtering."},{"id":"q226","domain":"D3","family":"firewalls","question":"A next-generation firewall inspects the actual application payload to tell apart and control specific apps, such as a chat client versus a file-sharing tool. This deep, content-aware filtering happens at which layer?","options":["UTM","Layer 4","WAF","Layer 7"],"correctIndex":3,"explanation":"Layer 7. Content-aware filtering that identifies specific applications happens at the application layer. The tell: Layer 4 = filters only by port and IP; UTM = an all-in-one appliance bundling several security functions; WAF = Layer 7 protection built specifically for web applications, not general app control."},{"id":"q227","domain":"D3","family":"port-auth","question":"The standard that keeps a switch port or wireless association blocked until the connecting device successfully authenticates is called what?","options":["EAP","802.1X","PEAP","EAP-TLS"],"correctIndex":1,"explanation":"802.1X. Port-based access control that holds the port closed until authentication succeeds is 802.1X. The tell: 802.1X = the port gate that stays closed until authentication succeeds; EAP = the authentication framework 802.1X carries; PEAP = an EAP method tunneling credentials in server-side TLS; EAP-TLS = an EAP method requiring mutual client and server certificates."},{"id":"q228","domain":"D3","family":"port-auth","question":"802.1X does not define the actual authentication exchange itself; instead it transports a flexible framework within which methods like PEAP and EAP-TLS operate. What is that framework?","options":["802.1X","PEAP","EAP","EAP-TLS"],"correctIndex":2,"explanation":"EAP. The extensible authentication framework carried by 802.1X, under which specific methods run, is EAP. The tell: EAP = the authentication framework carried by 802.1X; 802.1X = the port gate that invokes it; PEAP = a specific EAP method tunneling in server-side TLS; EAP-TLS = a specific EAP method using mutual certificates."},{"id":"q229","domain":"D3","family":"port-auth","question":"A laptop plugged into a conference-room jack cannot pass any traffic until it authenticates; the authentication exchange runs inside this standard, which acts as the gate controlling port access. Which standard is the gate?","options":["EAP","EAP-TLS","802.1X","PEAP"],"correctIndex":2,"explanation":"802.1X. It is the port-based access control gate that stays closed until authentication succeeds. The tell: EAP = the authentication framework carried through the gate; EAP-TLS and PEAP = specific EAP methods, not the port-control standard itself."},{"id":"q230","domain":"D3","family":"port-auth","question":"Methods such as EAP-TLS and PEAP are specific implementations of which broader authentication framework?","options":["EAP","802.1X","EAP-TLS","PEAP"],"correctIndex":0,"explanation":"EAP. Extensible Authentication Protocol is the framework, and EAP-TLS and PEAP are methods within it. The tell: 802.1X = the port-based gate that carries EAP; EAP-TLS and PEAP = the specific methods themselves, not the overarching framework they run inside."},{"id":"q231","domain":"D3","family":"secure-tunnels","question":"Remote employees connect to internal applications through a browser over TCP port 443, with no full VPN client installed on their machines. Which tunneling technology is this?","options":["IPSec","TLS VPN","SD-WAN","SASE"],"correctIndex":1,"explanation":"TLS VPN. A transport-layer tunnel over port 443 that is clientless-friendly is a TLS VPN. The tell: TLS VPN = transport/application-layer tunnel over port 443, clientless-friendly; IPSec = network-layer tunnel using AH/ESP, common for site-to-site; SD-WAN = software-defined WAN link optimization between sites; SASE = SD-WAN converged with cloud-delivered security."},{"id":"q232","domain":"D3","family":"secure-tunnels","question":"Two data centers are connected by a permanent encrypted tunnel operating at the network layer using ESP for confidentiality and integrity. Which technology is this?","options":["TLS VPN","SD-WAN","SASE","IPSec"],"correctIndex":3,"explanation":"IPSec. A network-layer tunnel using ESP for site-to-site connectivity is IPSec. The tell: IPSec = network-layer tunnel (AH/ESP), site-to-site; TLS VPN = transport-layer tunnel over port 443; SD-WAN = software-defined WAN optimization between sites; SASE = SD-WAN plus cloud-delivered security as one service."},{"id":"q233","domain":"D3","family":"secure-tunnels","question":"A software-defined overlay that dynamically steers branch traffic across multiple transport links such as MPLS, broadband, and LTE to optimize performance and cost is called what?","options":["SD-WAN","SASE","IPSec","TLS VPN"],"correctIndex":0,"explanation":"SD-WAN. Software-defined steering of WAN traffic across multiple links to optimize sites is SD-WAN. The tell: SD-WAN = software-defined WAN that optimizes links between sites; SASE = SD-WAN combined with cloud-delivered security (ZTNA, SWG, CASB); IPSec = network-layer encrypted tunnel; TLS VPN = transport-layer tunnel over port 443."},{"id":"q234","domain":"D3","family":"secure-tunnels","question":"A company adopts a single cloud-delivered service that combines SD-WAN connectivity with security functions like zero-trust network access, secure web gateway, and CASB. Which model is this?","options":["SD-WAN","IPSec","SASE","TLS VPN"],"correctIndex":2,"explanation":"SASE. Converging SD-WAN with cloud-delivered security into one service is SASE. The tell: SASE = SD-WAN converged with cloud-delivered security (ZTNA/SWG/CASB) as one service; SD-WAN = the connectivity/link-optimization layer alone; IPSec = network-layer encrypted tunnel; TLS VPN = transport-layer clientless-friendly tunnel."},{"id":"q235","domain":"D3","family":"secure-tunnels","question":"Which tunneling technology operates at the network layer, using protocols such as AH and ESP to secure traffic, making it the classic choice for site-to-site connections?","options":["TLS VPN","IPSec","SD-WAN","SASE"],"correctIndex":1,"explanation":"IPSec. Network-layer tunneling with AH and ESP is typical for site-to-site links. The tell: TLS VPN = a transport or application-layer tunnel over port 443, friendly to clientless access; SD-WAN = software-defined WAN link optimization; SASE = SD-WAN plus cloud-delivered security services."},{"id":"q236","domain":"D3","family":"secure-tunnels","question":"What is the general term for any technology that builds an encrypted tunnel across an untrusted network so that remote traffic appears to be on the private network?","options":["SD-WAN","SASE","IPSec","VPN"],"correctIndex":3,"explanation":"VPN. It is the umbrella term for an encrypted tunnel over an untrusted network. The tell: IPSec = one specific network-layer VPN implementation; SD-WAN = software-defined WAN link optimization, not itself an encryption tunnel; SASE = SD-WAN combined with cloud-delivered security services."},{"id":"q237","domain":"D3","family":"secure-tunnels","question":"A retail chain replaces expensive dedicated circuits with a centrally managed, software-defined overlay that applies traffic policies across inexpensive internet links to each store, without adding any cloud-delivered security services. Which technology is this?","options":["IPSec","SASE","SD-WAN","VPN"],"correctIndex":2,"explanation":"SD-WAN. A software-defined WAN overlay that manages traffic policy across transport links, with no bundled cloud security, is SD-WAN. The tell: SASE = SD-WAN plus cloud-delivered security (ZTNA, secure web gateway, CASB) as one service; IPSec and VPN = encrypted tunnels, not policy-driven WAN link management."},{"id":"q238","domain":"D3","family":"data-classification","question":"A hospital stores patient records that fall under HIPAA and cardholder data that falls under PCI DSS, so external law dictates exactly how each must be handled. Which data type best describes these records?","options":["regulated","trade secret","intellectual property","financial"],"correctIndex":0,"explanation":"Regulated data. It is governed by an external law or standard like HIPAA or PCI DSS that mandates how it is handled. The tell: regulated = controlled by law or standard, trade secret = proprietary competitive know-how, intellectual property = patents and copyrights, financial = monetary and accounting records."},{"id":"q239","domain":"D3","family":"data-classification","question":"A beverage company guards the secret formula
