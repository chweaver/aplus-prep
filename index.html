"],"correctIndex":3,"explanation":"False negatives. Loosening detection to reduce noise risks letting real threats slip by undetected, which is a false negative. The tell: false negative = real threat missed; false positive = benign activity flagged as bad; true positive = real threat correctly caught; true negative = benign activity correctly ignored."},{"id":"q357","domain":"D4","family":"false-pos-neg","question":"A monitoring system flags legitimate activity as malicious, raising an alert when no real threat exists. What is this outcome called?","options":["False negative","False positive","True positive","True negative"],"correctIndex":1,"explanation":"False positive. The system alerted, but nothing was actually wrong. The tell: false positive = it alerted on a benign event (wasted effort); false negative = a real threat that was missed; true positive = a real threat correctly alerted; true negative = benign activity correctly ignored."},{"id":"q358","domain":"D4","family":"false-pos-neg","question":"A vulnerability scanner reports a server as clean, but the server actually has an unpatched, exploitable flaw the scan failed to detect. What is this result?","options":["True negative","False negative","False positive","True positive"],"correctIndex":1,"explanation":"False negative. A real problem existed but the tool stayed silent. The tell: false negative = a real threat missed (dangerous); false positive = an alert on something harmless; true negative = correctly reporting genuinely clean; true positive = correctly detecting a real flaw."},{"id":"q359","domain":"D4","family":"false-pos-neg","question":"In detection, a false negative is considered more dangerous than a false positive primarily because a false negative means what?","options":["A real threat went undetected and unaddressed","An analyst wasted time investigating a harmless alert","A benign event was correctly ignored","A genuine threat was correctly blocked"],"correctIndex":0,"explanation":"False negative. It is dangerous because a real threat slips through with no alert at all. The tell: false negative = real threat missed; false positive = time wasted on a harmless alert; true negative = benign event correctly ignored; true positive = real threat correctly caught."},{"id":"q360","domain":"D4","family":"cve-cvss","question":"Which element is the unique catalog identifier assigned to one specific, publicly known vulnerability?","options":["CVSS","CVE","Exposure factor","Vulnerability classification"],"correctIndex":1,"explanation":"CVE. The Common Vulnerability Enumeration entry is the unique ID or name for a specific known vulnerability. The tell: CVE = the unique identifier for a vulnerability; CVSS = the 0-10 numeric severity score; exposure factor = percent of an asset's value lost in an event; vulnerability classification = grouping vulns by type or severity."},{"id":"q361","domain":"D4","family":"cve-cvss","question":"Which element expresses the severity of a vulnerability as a number from 0 to 10?","options":["CVSS","CVE","Environmental variables","Risk tolerance"],"correctIndex":0,"explanation":"CVSS. The 0-10 numeric severity score is the CVSS. The tell: CVSS = the 0-10 severity score; CVE = the unique identifier for the vulnerability; environmental variables = CVSS modifiers for your specific environment; risk tolerance = acceptable deviation on a specific risk before acting."},{"id":"q362","domain":"D4","family":"cve-cvss","question":"During a briefing an analyst says the flaw is tracked as CVE-2021-44228. That CVE-2021-44228 string is functioning as which of the following?","options":["CVE","CVSS","Exposure factor","Environmental variables"],"correctIndex":0,"explanation":"CVE. A CVE-year-number string is the unique identifier naming that specific vulnerability. The tell: CVE = the unique identifier or name; CVSS = the 0-10 severity score; exposure factor = percent of asset lost per event; environmental variables = CVSS modifiers for your environment."},{"id":"q363","domain":"D4","family":"cve-cvss","question":"A patch team sees a vulnerability rated 9.8 and prioritizes it as critical. That 9.8 value comes from which element?","options":["Exposure factor","Risk tolerance","CVSS","CVE"],"correctIndex":2,"explanation":"CVSS. A 9.8 rating is a CVSS severity score. The tell: CVSS = the 0-10 severity score; exposure factor = percent of asset lost per event; risk tolerance = acceptable deviation on a specific risk before acting; CVE = the unique vulnerability identifier."},{"id":"q364","domain":"D4","family":"cve-cvss","question":"A risk analyst estimates that a successful ransomware hit would cost the company 60% of a server's asset value. That 60% figure is the what?","options":["Exposure factor","Environmental variables","CVSS","Vulnerability classification"],"correctIndex":0,"explanation":"Exposure factor. The percentage of an asset's value lost in a single event is the exposure factor. The tell: exposure factor = percent of asset lost per event; environmental variables = CVSS modifiers for your environment; CVSS = the 0-10 severity score; vulnerability classification = grouping vulns by type or severity."},{"id":"q365","domain":"D4","family":"cve-cvss","question":"Two companies score the same vulnerability differently because one adjusts the base metrics for its own network exposure and asset criticality. Which element allows this adjustment?","options":["Exposure factor","CVE","Risk tolerance","Environmental variables"],"correctIndex":3,"explanation":"Environmental variables. CVSS metrics that adjust the base score for your specific environment are the environmental variables. The tell: environmental variables = CVSS modifiers for your environment; exposure factor = percent of asset lost per event; CVE = the unique identifier; risk tolerance = acceptable deviation on a specific risk before acting."},{"id":"q366","domain":"D4","family":"cve-cvss","question":"Grouping discovered vulnerabilities by type, such as injection, misconfiguration, or missing patch, and by severity band is called what?","options":["CVE","CVSS","Vulnerability classification","Exposure factor"],"correctIndex":2,"explanation":"Vulnerability classification. Grouping vulnerabilities by type and severity is vulnerability classification. The tell: vulnerability classification = grouping vulns by type or severity; CVE = the unique identifier for one vuln; CVSS = the 0-10 severity score; exposure factor = percent of asset lost per event."},{"id":"q367","domain":"D4","family":"cve-cvss","question":"A junior analyst asks for the \"CVE score\" of a new finding. The senior analyst explains that a CVE does not carry the severity number; that comes from a different element. Which element actually supplies the severity number?","options":["CVE","CVSS","Exposure factor","Environmental variables"],"correctIndex":1,"explanation":"CVSS. The severity number comes from the CVSS score; the CVE is only the identifier that names the vulnerability. The tell: CVSS = the 0-10 severity score (how bad); CVE = the unique identifier (which one); exposure factor = percent of asset value lost per event; environmental variables = CVSS modifiers for your environment."},{"id":"q368","domain":"D4","family":"cve-cvss","question":"Two different scanners report the same flaw under their own product-specific names. Which element gives analysts one standard, vendor-neutral name so every tool and advisory refers to the same vulnerability?","options":["CVSS","Exposure factor","CVE","Vulnerability classification"],"correctIndex":2,"explanation":"CVE. A CVE entry is the standard identifier that lets every tool, advisory, and database refer to the same vulnerability by one name. The tell: CVE = the unique identifier or name; CVSS = the 0-10 severity score; exposure factor = percent of asset value lost per event; vulnerability classification = grouping by type or severity."},{"id":"q369","domain":"D4","family":"cve-cvss","question":"A bank normally allows 30 days to remediate medium-severity findings, but a new vulnerability pushes the risk on its payment platform beyond the deviation from that baseline it is prepared to absorb, so it patches immediately. The amount of deviation the organization will absorb on a specific risk before acting is its what?","options":["CVSS","Exposure factor","Environmental variables","Risk tolerance"],"correctIndex":3,"explanation":"Risk tolerance. Tolerance is the acceptable deviation around a specific risk before action is required; exceeding it forces remediation. The tell: risk tolerance = acceptable variance on a specific risk before acting; CVSS = the 0-10 severity score; exposure factor = percent of asset value lost per event; environmental variables = CVSS modifiers for your environment."},{"id":"q370","domain":"D4","family":"cve-cvss","question":"During a CISA advisory briefing, an analyst notes that a flaw carries a standardized, vendor-neutral label so every bulletin can point to the same entry. In SY0-701 this Common Vulnerability Enumeration label is which element?","options":["CVSS","Vulnerability classification","CVE","Environmental variables"],"correctIndex":2,"explanation":"CVE. It is the unique catalog identifier that names one specific known vulnerability so all tools and advisories reference the same entry. The tell: CVE = the identifier/name; CVSS = the 0 to 10 severity score; vulnerability classification = grouping flaws by type and severity; environmental variables = the local modifiers that adjust a score for your environment."},{"id":"q371","domain":"D4","family":"cve-cvss","question":"In vulnerability management, a CVE entry for a flaw functions as which of the following?","options":["A 0 to 10 score expressing how severe the flaw is","The unique vendor-neutral identifier naming one specific known vulnerability","The percentage of an asset's value lost when the flaw is exploited","The set of local modifiers that adjust a published score for one environment"],"correctIndex":1,"explanation":"CVE. A CVE is only the standardized identifier for a vulnerability; it carries no severity number itself. The tell: CVE = the name/identifier; the 0 to 10 severity number = CVSS; percentage of asset value lost = exposure factor; local score modifiers = environmental variables."},{"id":"q372","domain":"D4","family":"cve-cvss","question":"Which element combines base, temporal, and environmental metric groups into a single number that reflects how severe a vulnerability is?","options":["Exposure factor","Vulnerability classification","Risk tolerance","CVSS"],"correctIndex":3,"explanation":"CVSS. It produces the 0 to 10 severity score from its metric groups. The tell: CVSS = the severity score; exposure factor = percent of asset value lost per event; vulnerability classification = grouping flaws by type and severity; risk tolerance = the deviation an organization will absorb on a risk before acting."},{"id":"q373","domain":"D4","family":"cve-cvss","question":"A CVSS rating assigned to a vulnerability is best described as which of the following?","options":["A 0 to 10 numeric severity score for the vulnerability","A catalog identifier that uniquely names the vulnerability","A grouping of findings by weakness type and severity band","The share of asset value expected to be lost in one event"],"correctIndex":0,"explanation":"CVSS. The CVSS rating is the numeric 0 to 10 severity value for a flaw. The tell: CVSS = the score; the unique name = CVE; grouping by type and band = vulnerability classification; share of asset value lost = exposure factor."},{"id":"q374","domain":"D4","family":"cve-cvss","question":"Which term names the percentage of an asset's value that is lost when a particular threat is realized?","options":["Environmental variables","Exposure factor","CVSS","Risk tolerance"],"correctIndex":1,"explanation":"Exposure factor. It expresses, as a percent, how much of an asset's value one event destroys. The tell: exposure factor = percent of asset value lost; environmental variables = CVSS modifiers for your specific environment; CVSS = the 0 to 10 severity score; risk tolerance = acceptable deviation on a risk before acting."},{"id":"q375","domain":"D4","family":"cve-cvss","question":"A team raises a flaw's score above the vendor's published base value because the vulnerable database stores regulated health records, increasing the confidentiality requirement in its own deployment. Which CVSS element reflects such local security requirements?","options":["CVE","Vulnerability classification","Environmental variables","Exposure factor"],"correctIndex":2,"explanation":"Environmental variables. These are the CVSS modifiers that let each organization adjust a published score for its own asset criticality and security requirements. The tell: environmental variables = local score modifiers; CVE = the vulnerability's identifier; vulnerability classification = grouping flaws by type and severity; exposure factor = percent of asset value lost per event."},{"id":"q376","domain":"D4","family":"cve-cvss","question":"Assigning each discovered weakness to a category such as improper input handling, broken authentication, or missing patch so similar flaws are managed together is which activity?","options":["Vulnerability classification","CVSS scoring","CVE assignment","Setting the exposure factor"],"correctIndex":0,"explanation":"Vulnerability classification. It groups findings by weakness type and severity so related flaws are handled the same way. The tell: vulnerability classification = grouping by type/severity; CVSS scoring = producing the 0 to 10 severity number; CVE assignment = giving the flaw its unique identifier; exposure factor = percent of asset value lost per event."},{"id":"q377","domain":"D4","family":"cve-cvss","question":"A hospital's board will accept only minimal deviation from its patch-timeline target for systems tied to patient safety and demands immediate action once a finding exceeds that variance. The acceptable amount of variance on that specific risk is the hospital's what?","options":["Exposure factor","Environmental variables","Risk tolerance","Vulnerability classification"],"correctIndex":2,"explanation":"Risk tolerance. It is the amount of deviation an organization will absorb on a specific risk before it must act. The tell: risk tolerance = acceptable deviation before acting; exposure factor = percent of asset value lost per event; environmental variables = CVSS modifiers for your environment; vulnerability classification = grouping flaws by type and severity."},{"id":"q378","domain":"D4","family":"cve-cvss","question":"Before publicly disclosing a newly found flaw, a researcher requests that a unique identifier be reserved for it in the public catalog so future advisories can all reference the same entry. Which element is being reserved?","options":["CVE","CVSS","Exposure factor","Environmental variables"],"correctIndex":0,"explanation":"CVE. The reserved item is the unique catalog identifier that names the specific vulnerability. The tell: CVE = the identifier; CVSS = the 0 to 10 severity score; exposure factor = percent of asset value lost per event; environmental variables = CVSS modifiers for your environment."},{"id":"q379","domain":"D4","family":"cve-cvss","question":"An analyst must decide whether a finding belongs in the high or the critical band and resolves it by reading the single numeric value the flaw was assigned. That numeric value is produced by which element?","options":["Vulnerability classification","CVE","Risk tolerance","CVSS"],"correctIndex":3,"explanation":"CVSS. The numeric value that maps to severity bands like high or critical is the CVSS score. The tell: CVSS = the 0 to 10 score; vulnerability classification = grouping flaws by type and severity; CVE = the vulnerability's unique identifier; risk tolerance = acceptable deviation on a risk before acting."},{"id":"q380","domain":"D4","family":"vuln-response","question":"A legacy application server runs software the vendor no longer patches, and the business cannot replace it yet. The team wraps it in strict network access rules and extra monitoring as an alternate protection. What is this response called?","options":["Patching","Compensating control","Exception","Insurance"],"correctIndex":1,"explanation":"Compensating control. When you cannot patch or replace, an alternate protection reduces the risk in the meantime. The tell: patching = fix the flaw; compensating control = alternate protection when you cannot fix; exception = formally accept and document leaving it unfixed; insurance = transfer the financial risk."},{"id":"q381","domain":"D4","family":"vuln-response","question":"After a critical flaw is remediated, the analyst runs the vulnerability scanner against the host again to confirm the finding no longer appears. Which validation step is this?","options":["Audit","Segmentation","Insurance","Rescanning"],"correctIndex":3,"explanation":"Rescanning. Running the scanner again after the fix confirms the finding is gone. The tell: rescanning = scan again to confirm the fix; audit = review controls against requirements; segmentation = split the network into zones; insurance = transfer the financial risk."},{"id":"q382","domain":"D4","family":"vuln-response","question":"Rather than fix a low-severity flaw in a rarely used system, management buys a cyber insurance policy to cover any financial loss if it is exploited. Which vulnerability response is this?","options":["insurance","patching","segmentation","exception"],"correctIndex":0,"explanation":"insurance. Buying a policy to cover potential loss transfers the financial risk instead of removing the flaw. The tell: insurance = transfer the financial risk to a third party; patching = actually fix the flaw; segmentation = wall the system off on the network; exception = formally document leaving it unremediated."},{"id":"q383","domain":"D4","family":"vuln-response","question":"After a fix is applied, instead of running an automated scan a reviewer manually checks the system's controls and procedures against the requirements to confirm the remediation holds. Which validation method is this?","options":["rescanning","audit","verification","patching"],"correctIndex":1,"explanation":"audit. Manually checking controls and procedures against requirements is an audit-style validation. The tell: audit = review controls and procedures against requirements; rescanning = run the scanner again to confirm the finding is gone; verification = confirm the specific fix works; patching = the remediation itself, not a validation."},{"id":"q384","domain":"D4","family":"monitoring","question":"Analysts are overwhelmed by low-value alerts, so they adjust the SIEM rule thresholds to reduce noise without losing true detections. What is this activity?","options":["Log aggregation","Archiving","Quarantine","Alert tuning"],"correctIndex":3,"explanation":"Alert tuning. Adjusting rule thresholds to cut noise without losing real detections is tuning. The tell: alert tuning = adjust rules to reduce false positives; log aggregation = collect logs in one place; archiving = retain logs long-term; quarantine = isolate a suspicious file or host."},{"id":"q385","domain":"D4","family":"monitoring","question":"A platform pulls log data from firewalls, servers, and endpoints into a single central repository for analysis. Which function is this?","options":["Log aggregation","Alerting","Reporting","Archiving"],"correctIndex":0,"explanation":"Log aggregation. Pulling logs from many sources into one central store is aggregation. The tell: log aggregation = centralize logs; alerting = notify on conditions; reporting = summarize for stakeholders; archiving = retain logs long-term."},{"id":"q386","domain":"D4","family":"monitoring","question":"To meet a two-year retention requirement, older log data is moved to long-term compressed storage where it stays available for audits but out of the active analysis system. Which function is this?","options":["archiving","log aggregation","alerting","quarantine"],"correctIndex":0,"explanation":"archiving. Moving older logs to long-term storage for retention is archiving. The tell: archiving = retain logs long-term; log aggregation = collect logs into one place for analysis; alerting = notify on a condition; quarantine = isolate a suspicious file or host."},{"id":"q387","domain":"D4","family":"monitoring","question":"When the endpoint tool flags a file as suspicious, it automatically moves that file into an isolated location where it cannot execute while analysts review it. Which monitoring action is this?","options":["alerting","scanning","quarantine","archiving"],"correctIndex":2,"explanation":"quarantine. Moving a suspicious file to an isolated location where it cannot run is quarantine. The tell: quarantine = isolate the suspicious item; alerting = only notify; scanning = actively check for issues; archiving = long-term log retention."},{"id":"q388","domain":"D4","family":"security-tools","question":"An engineer wants records of which internal hosts talked to which external hosts and how much data moved, without capturing full packet contents. Which tool provides this?","options":["SIEM","NetFlow","SNMP traps","DLP"],"correctIndex":1,"explanation":"NetFlow. Flow records show who talked to whom and how much data moved, without full packet payloads. The tell: NetFlow = traffic flow records; SIEM = correlate and alert across logs; SNMP traps = device-initiated fault alerts; DLP = stop sensitive data from leaving."},{"id":"q389","domain":"D4","family":"security-tools","question":"Security wants to detect and block employees from emailing files that contain credit card numbers outside the company. Which tool enforces this?","options":["DLP","SIEM","Vulnerability scanner","NetFlow"],"correctIndex":0,"explanation":"DLP. Data loss prevention inspects and blocks sensitive data leaving the org. The tell: DLP = stop data exfiltration; SIEM = correlate and alert across logs; vulnerability scanner = find known weaknesses; NetFlow = traffic flow records."},{"id":"q390","domain":"D4","family":"security-tools","question":"Which mechanism has a network device itself send an unsolicited alert message to a management station when a threshold or fault condition occurs?","options":["NetFlow","SCAP","SNMP traps","SIEM"],"correctIndex":2,"explanation":"SNMP traps. The device pushes an unsolicited alert to the manager on a fault or threshold. The tell: SNMP traps = device-initiated alerts; NetFlow = traffic flow records; SCAP = standard for automating config checks; SIEM = correlate and alert across logs."},{"id":"q391","domain":"D4","family":"security-tools","question":"Which standard lets different security tools automate and compare configuration and vulnerability checks using a common format?","options":["SIEM","DLP","Antivirus","SCAP"],"correctIndex":3,"explanation":"SCAP. The Security Content Automation Protocol lets tools automate and compare config and vulnerability checks in a common format. The tell: SCAP = standardized automated config checks; SIEM = correlate and alert across logs; DLP = stop data exfiltration; antivirus = signature-based malware detection."},{"id":"q392","domain":"D4","family":"security-tools","question":"A security operations center needs one platform that ingests and correlates logs from firewalls, servers, and applications across the enterprise and raises alerts when combined patterns indicate an attack. Which tool is this?","options":["SIEM","NetFlow","SNMP traps","vulnerability scanner"],"correctIndex":0,"explanation":"SIEM. Correlating logs from many sources across the enterprise and alerting is the SIEM role. The tell: SIEM = correlate logs and alert enterprise-wide; NetFlow = records of traffic flows; SNMP traps = device-initiated fault alerts; vulnerability scanner = finds known weaknesses."},{"id":"q393","domain":"D4","family":"security-tools","question":"Which tool actively probes hosts and applications to identify known weaknesses such as missing patches and insecure configurations, then produces a findings report?","options":["antivirus","vulnerability scanner","SIEM","DLP"],"correctIndex":1,"explanation":"vulnerability scanner. Probing hosts for missing patches and insecure configs and reporting findings is a vulnerability scanner. The tell: vulnerability scanner = finds known weaknesses; antivirus = detects and blocks malware; SIEM = correlates logs and alerts; DLP = stops sensitive data from leaving."},{"id":"q394","domain":"D4","family":"security-tools","question":"Which resource provides a consensus set of recommended secure configuration settings, such as CIS baselines, that organizations measure their systems against?","options":["SCAP","NetFlow","SIEM","benchmarks"],"correctIndex":3,"explanation":"benchmarks. A consensus set of recommended secure configuration settings, like CIS baselines, is a benchmark. The tell: benchmarks = the recommended secure-config baselines you measure against; SCAP = the standard that lets tools automate and compare those checks; NetFlow = traffic flow records; SIEM = log correlation and alerting."},{"id":"q395","domain":"D4","family":"firewall-config","question":"A company places its public web and mail servers on a separate buffer network between the internet and the internal LAN, so external users never reach the internal network directly. What is this design element?","options":["Access list","Screened subnet","Firewall rule","Signature"],"correctIndex":1,"explanation":"Screened subnet. A buffer network between the internet and the internal LAN hosts public-facing servers. The tell: screened subnet = buffer network for public servers; access list = permit or deny by source, dest, and port; firewall rule = a single permit or deny statement; signature = match a known pattern."},{"id":"q396","domain":"D4","family":"firewall-config","question":"An IPS blocks traffic that matches a stored pattern of a specific known exploit. What is this detection method called?","options":["Signature","Trend","Firewall rule","Screened subnet"],"correctIndex":0,"explanation":"Signature. Blocking traffic that matches a stored pattern of a known exploit is signature detection. The tell: signature = match a known pattern; trend = detect deviation over time; firewall rule = a single permit or deny statement; screened subnet = buffer network for public servers."},{"id":"q397","domain":"D4","family":"firewall-config","question":"Instead of matching a stored exploit pattern, a sensor flags traffic that deviates from the normal baseline volume observed over the previous weeks. Which detection method is this?","options":["signature","trend","screened subnet","access list"],"correctIndex":1,"explanation":"trend. Flagging traffic that deviates from the learned baseline over time is trend detection. The tell: trend = detect deviation over time; signature = match a known stored pattern; screened subnet = a buffer network for public-facing servers; access list = permit or deny entries by source, destination, and port."},{"id":"q398","domain":"D4","family":"firewall-config","question":"A router configuration holds an ordered set of permit and deny statements matched by source IP, destination, and port to control which packets pass. What is this construct called?","options":["signature","trend","access list","screened subnet"],"correctIndex":2,"explanation":"access list. An ordered set of permit and deny statements matched by source, destination, and port is an access list. The tell: access list = permit or deny by source, destination, and port; signature = match a known pattern; trend = deviation over time; screened subnet = a buffer network between the internet and the internal LAN."},{"id":"q399","domain":"D4","family":"web-filter","question":"To stop users from reaching malware domains, the resolver simply refuses to return an IP address for domains on a known-bad list. Which filtering technique is this?","options":["Centralized proxy","Content categorization","DNS filtering","Reputation"],"correctIndex":2,"explanation":"DNS filtering. The resolver blocks access by refusing to resolve known-bad domains. The tell: DNS filtering = block by refusing to resolve; centralized proxy = route all traffic through one filter point; content categorization = block by category; reputation = block by known-bad score."},{"id":"q400","domain":"D4","family":"web-filter","question":"Remote laptops must have their web traffic filtered even when off the corporate network, so filtering software is installed directly on each device. Which approach is this?","options":["Agent-based","Centralized proxy","Content categorization","DNS filtering"],"correctIndex":0,"explanation":"Agent-based. Filtering software on the device enforces policy anywhere, on or off the network. The tell: agent-based = client software filters anywhere; centralized proxy = one on-network filter point; content categorization = block by category; DNS filtering = block by refusing to resolve."},{"id":"q401","domain":"D4","family":"web-filter","question":"The filter blocks access to any site classified under gambling or adult categories, regardless of the specific URL requested. Which technique is this?","options":["content categorization","reputation","centralized proxy","DNS filtering"],"correctIndex":0,"explanation":"content categorization. Blocking by category such as gambling or adult regardless of the specific URL is content categorization. The tell: content categorization = block by category; reputation = block by known-bad score; centralized proxy = route all traffic through one filtering point; DNS filtering = refuse to resolve bad domains."},{"id":"q402","domain":"D4","family":"web-filter","question":"All employee web requests are forced through a single on-network appliance that inspects and filters them before forwarding to the internet. Which web-filter approach is this?","options":["reputation","URL scanning","content categorization","centralized proxy"],"correctIndex":3,"explanation":"centralized proxy. Forcing all web requests through one on-network appliance that inspects and filters them is a centralized proxy. The tell: centralized proxy = one filtering point all traffic routes through; reputation = block by score; URL scanning = inspect the specific URL; content categorization = block by category."},{"id":"q403","domain":"D4","family":"os-hardening","question":"A Windows administrator needs to push a standardized security configuration - password policy, disabled services, and audit settings - to thousands of domain-joined workstations from a central point. Which mechanism does this?","options":["SELinux","Group Policy","AppArmor","Local Security Policy"],"correctIndex":1,"explanation":"Group Policy. Windows pushes centralized security config to domain-joined machines through GPOs in Active Directory. The tell: Group Policy = Windows domain-wide config via AD; SELinux = Linux mandatory access control; AppArmor = Linux profile-based confinement; Local Security Policy = single non-domain Windows host."},{"id":"q404","domain":"D4","family":"os-hardening","question":"A Linux server admin enforces mandatory access control by confining each process to a security context that limits which files and ports it can touch, even for root. Which mechanism is this?","options":["Group Policy","Local Security Policy","SELinux","AppArmor"],"correctIndex":2,"explanation":"SELinux. It enforces mandatory access control by confining processes to security contexts, even root. The tell: SELinux = Linux mandatory access control via contexts; Group Policy = Windows domain-wide config via AD; AppArmor = Linux profile-based confinement; Local Security Policy = single non-domain Windows host."},{"id":"q405","domain":"D4","family":"os-hardening","question":"On a standalone Windows machine that is not joined to a domain, which tool enforces local password and audit policy since no domain-level configuration applies?","options":["Group Policy","SELinux","Local Security Policy","AppArmor"],"correctIndex":2,"explanation":"Local Security Policy. On a non-domain Windows host, local policy enforces password and audit settings because no domain GPO applies. The tell: Local Security Policy = single non-domain Windows host; Group Policy = Windows domain-wide config via AD; SELinux = Linux mandatory access control; AppArmor = Linux profile-based confinement."},{"id":"q406","domain":"D4","family":"os-hardening","question":"On a Red Hat Linux web server, an admin confines the web daemon to a labeled security context so that even if it is compromised it cannot read files outside that context, and root cannot override the confinement. Which mechanism is this?","options":["Group Policy","SELinux","AppArmor","Local Security Policy"],"correctIndex":1,"explanation":"SELinux. Confining a Linux daemon to a labeled security context that even root cannot override is SELinux. The tell: SELinux = Linux mandatory access control using labels and security contexts; AppArmor = the path-based Linux alternative; Group Policy = Windows domain configuration; Local Security Policy = local Windows policy on a standalone machine."},{"id":"q407","domain":"D4","family":"os-hardening","question":"Across a Windows Active Directory domain, an admin links a configuration object to an organizational unit so every computer in it receives the same password policy and disabled-service settings at login. Which mechanism does this?","options":["Local Security Policy","SELinux","AppArmor","Group Policy"],"correctIndex":3,"explanation":"Group Policy. Linking a configuration object to an organizational unit so domain computers receive it at login is Group Policy. The tell: Group Policy = Windows domain-wide configuration via Active Directory; Local Security Policy = policy on a single non-domain Windows host; SELinux = Linux label-based mandatory access control; AppArmor = Linux path-based confinement."},{"id":"q408","domain":"D4","family":"os-hardening","question":"On an Ubuntu server an admin restricts an application using path-based profiles that spell out exactly which files and capabilities the program may use, an alternative to the label-based Linux mandatory access control system. Which mechanism is this?","options":["SELinux","Group Policy","AppArmor","Local Security Policy"],"correctIndex":2,"explanation":"AppArmor. Restricting a Linux app with path-based profiles, as an alternative to the label-based system, is AppArmor. The tell: AppArmor = Linux mandatory access control using path-based profiles; SELinux = the label and context-based Linux alternative; Group Policy = Windows domain configuration; Local Security Policy = local Windows host policy."},{"id":"q409","domain":"D4","family":"email-security","question":"A domain owner publishes a DNS record listing the specific mail servers authorized to send messages for the domain; receiving servers compare each message's sending IP against that list. Which mechanism is this?","options":["SPF","DKIM","DMARC","Secure email gateway"],"correctIndex":0,"explanation":"SPF. Publishing the authorized sending servers in DNS and checking the sender IP is SPF. The tell: SPF = which servers may send (checks sending IP); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q410","domain":"D4","family":"email-security","question":"Each outbound message carries a header with a cryptographic signature generated from the domain's private key, letting receivers verify the body was not altered and truly came from the domain. Which mechanism provides this?","options":["DMARC","SPF","DKIM","Secure email gateway"],"correctIndex":2,"explanation":"DKIM. A private-key signature over the message lets receivers verify integrity and origin. The tell: SPF = which servers may send (checks sending IP); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q411","domain":"D4","family":"email-security","question":"Legitimate messages relayed through a third-party forwarding service keep failing the recipient's IP-based sender check, yet a second email authentication check still passes because its verification data travels inside the message headers. Which mechanism provides that second check?","options":["Secure email gateway","DMARC","SPF","DKIM"],"correctIndex":3,"explanation":"DKIM. Its signature rides in the message header, so it survives forwarding, unlike a check tied to the connecting server's IP. The tell: SPF = which servers may send (checks sending IP, breaks on forwarding); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q412","domain":"D4","family":"email-security","question":"An appliance sits at the mail perimeter scanning inbound and outbound messages for spam, malware attachments, and data leaks before delivery. Which component is this?","options":["Secure email gateway","DMARC","DKIM","SPF"],"correctIndex":0,"explanation":"Secure email gateway. It is an inline appliance filtering inbound and outbound mail for spam, malware, and leaks. The tell: SPF = which servers may send (checks sending IP); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q413","domain":"D4","family":"email-security","question":"Which email mechanism validates a message by comparing the sending server's IP address against an authorized list published in DNS, and does nothing to verify message content?","options":["DKIM","DMARC","SPF","Secure email gateway"],"correctIndex":2,"explanation":"SPF. It only compares the sending IP to an authorized DNS list and never inspects content. The tell: SPF = which servers may send (checks sending IP); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q414","domain":"D4","family":"email-security","question":"Which mechanism ties SPF and DKIM results together with alignment and tells receivers whether to apply none, quarantine, or reject to failing mail?","options":["DMARC","DKIM","SPF","Secure email gateway"],"correctIndex":0,"explanation":"DMARC. It aligns SPF and DKIM results and dictates none, quarantine, or reject on failure. The tell: SPF = which servers may send (checks sending IP); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q415","domain":"D4","family":"email-security","question":"A receiver recomputes a hash of the message and checks it against a value that was signed with the sender domain's private key and verified using a public key in DNS. Which mechanism is being used?","options":["SPF","DKIM","Secure email gateway","DMARC"],"correctIndex":1,"explanation":"DKIM. Verifying a body hash signed by the domain's private key using a DNS public key is DKIM. The tell: SPF = which servers may send (checks sending IP); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q416","domain":"D4","family":"email-security","question":"Security notices attackers spoofing their domain but has no visibility into it. They want recurring aggregate feedback from receivers about mail claiming to be from them. Which mechanism delivers these reports?","options":["SPF","DKIM","Secure email gateway","DMARC"],"correctIndex":3,"explanation":"DMARC. Aggregate spoofing reports back to the domain owner come from DMARC. The tell: SPF = which servers may send (checks sending IP); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q417","domain":"D4","family":"email-security","question":"A domain already publishes SPF and DKIM, but spoofed mail that fails those checks is still delivered because receivers do not know what to do with failures. Which mechanism must be added to instruct receivers to reject it?","options":["SPF","DMARC","DKIM","Secure email gateway"],"correctIndex":1,"explanation":"DMARC. SPF and DKIM only produce pass or fail results; DMARC publishes the policy telling receivers to reject or quarantine failures. The tell: SPF = which servers may send (checks sending IP); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q418","domain":"D4","family":"email-security","question":"Which email control is an inline filtering appliance or service rather than a DNS-published authentication record?","options":["SPF","DKIM","DMARC","Secure email gateway"],"correctIndex":3,"explanation":"Secure email gateway. It is a filtering appliance or service, not a DNS authentication record. The tell: SPF = which servers may send (checks sending IP); DKIM = cryptographic signature proving the message was not altered; DMARC = policy on failure plus alignment and reporting; secure email gateway = the inline filtering appliance."},{"id":"q419","domain":"D4","family":"email-security","question":"A company adopts a cloud email marketing platform and must let it send campaigns under the corporate domain. An admin edits a single DNS text record to add the vendor's outbound mail server addresses to the set of hosts permitted to send for the domain. Which mechanism is being updated?","options":["SPF","DKIM","DMARC","secure email gateway"],"correctIndex":0,"explanation":"SPF. Adding permitted sending server IPs to a DNS record is exactly what SPF publishes. The tell: SPF = the DNS list of IP addresses allowed to send for the domain; DKIM = a cryptographic signature over the message; DMARC = the policy on top of SPF and DKIM saying what to do on failure; secure email gateway = a filtering appliance, not a DNS record."},{"id":"q420","domain":"D4","family":"email-security","question":"A security team wants failing spoofed mail to be actively rejected and also wants to specify the address where receivers should send feedback reports. Which single DNS policy record controls both the enforcement action and the reporting destination?","options":["SPF","DKIM","DMARC","secure email gateway"],"correctIndex":2,"explanation":"DMARC. Only DMARC both sets the enforcement action and names where receiver reports are sent. The tell: DMARC = policy plus alignment and reporting destination; SPF = just the authorized-sender IP list; DKIM = just the message signature; secure email gateway = an appliance that filters mail."},{"id":"q421","domain":"D4","family":"email-security","question":"All inbound messages are routed through an appliance that detonates attachments in a sandbox, rewrites links to a safe redirect, and strips messages flagged as phishing before they reach mailboxes. Which component performs this?","options":["SPF","DKIM","DMARC","secure email gateway"],"correctIndex":3,"explanation":"secure email gateway. Sandboxing attachments and rewriting links at the mail perimeter is gateway filtering. The tell: secure email gateway = the filtering appliance or service; SPF = authorized-sender IP list in DNS; DKIM = cryptographic signature; DMARC = failure policy built on SPF and DKIM."},{"id":"q422","domain":"D4","family":"email-security","question":"A mailing list server appends a footer to every message it relays, which changes the message body and causes the receiver's verification to fail even though the originating domain generated the check. Which mechanism does the body modification break?","options":["SPF","DKIM","DMARC","secure email gateway"],"correctIndex":1,"explanation":"DKIM. A footer that changes the body invalidates the cryptographic signature computed over that content. The tell: DKIM = the signature proving the body was not altered; SPF = checks the sending IP only; DMARC = the policy tying SPF and DKIM results together; secure email gateway = a filtering appliance."},{"id":"q423","domain":"D4","family":"email-security","question":"After migrating the on-premises mail relay to a new IP block, the team forgot to update one DNS record, so receivers now mark the company's own outbound mail as coming from an unauthorized host. Which record must list the new relay IP so the mail is accepted?","options":["DMARC","SPF","DKIM","secure email gateway"],"correctIndex":1,"explanation":"SPF. The record that must list the relay's IP so receivers treat the host as authorized is SPF. The tell: SPF = the authorized-sender IP list; DMARC = the failure policy on top of SPF and DKIM; DKIM = the message signature; secure email gateway = a filtering appliance."},{"id":"q424","domain":"D4","family":"email-security","question":"A domain already uses the two underlying email authentication methods. Which capability does DMARC itself add that those two do not provide on their own?","options":["A cryptographic signature over the message so tampering is detectable","A DNS list of IP addresses permitted to send for the domain","A published policy with alignment telling receivers to quarantine or reject failures and where to send reports","An inline appliance that scans and filters the mail stream"],"correctIndex":2,"explanation":"DMARC. What DMARC adds beyond SPF and DKIM is the failure policy, From-header alignment, and reporting. The tell: option 2 describes DMARC; option 0 is DKIM (the signature); option 1 is SPF (the authorized-sender IP list); option 3 is the secure email gateway (a filtering appliance)."},{"id":"q425","domain":"D4","family":"email-security","question":"The mail team needs a place to build rules that hold suspicious inbound messages in quarantine and force TLS on messages sent to a specific partner domain. Which component hosts these mail-flow rules?","options":["SPF","DKIM","DMARC","secure email gateway"],"correctIndex":3,"explanation":"secure email gateway. Holding mail in quarantine and forcing TLS to a partner are mail-flow rules on the gateway appliance. The tell: secure email gateway = the filtering appliance or service; SPF = authorized-sender IP list; DKIM = the message signature; DMARC = the failure policy on SPF and DKIM."},{"id":"q426","domain":"D4","family":"email-security","question":"A receiving server looks up a public key at a selector in the sending domain's DNS and uses it to validate a signature attached to the message. Which mechanism relies on this selector-based public key lookup?","options":["DKIM","SPF","DMARC","secure email gateway"],"correctIndex":0,"explanation":"DKIM. Looking up a public key at a selector in the domain's DNS to validate a signature is DKIM verification. The tell: DKIM = the cryptographic signature, verified via a DNS public key at a selector; SPF = checks the sending IP against a list; DMARC = the failure policy tying the two together; secure email gateway = a filtering appliance."},{"id":"q427","domain":"D4","family":"email-security","question":"Receivers keep accepting spoofed mail whose envelope sender uses the company domain because nothing tells them which hosts may send for it. Which record should the company publish first so receivers can check the sending IP against an authorized set?","options":["DMARC","DKIM","secure email gateway","SPF"],"correctIndex":3,"explanation":"SPF. The record that enumerates which hosts may send, so receivers can check the sending IP, is SPF. The tell: SPF = the authorized-sender IP list; DMARC = the policy built on SPF and DKIM; DKIM = the message signature; secure email gateway = a filtering appliance."},{"id":"q428","domain":"D4","family":"email-security","question":"Both underlying authentication checks pass on their own, but the domain shown in the visible From header does not match the domain that authenticated, so the message is still treated as a failure. Which mechanism enforces that From-header matching requirement?","options":["SPF","DKIM","DMARC","secure email gateway"],"correctIndex":2,"explanation":"DMARC. Requiring the visible From domain to align with the authenticated domain is DMARC alignment. The tell: DMARC = policy plus From-header alignment and reporting; SPF = authorized-sender IP list; DKIM = the message signature; secure email gateway = a filtering appliance."},{"id":"q429","domain":"D4","family":"endpoint-detection","question":"Before any laptop is granted access to the corporate network, a system checks that it has current patches, antivirus, and disk encryption, quarantining devices that fail. Which technology is this?","options":["EDR","FIM","UBA","NAC"],"correctIndex":3,"explanation":"NAC. Network access control checks device posture before granting network access and quarantines failures. The tell: NAC = posture check before network access; EDR = detect and respond on endpoints; FIM = alert on critical file changes; UBA = flag abnormal user behavior."},{"id":"q430","domain":"D4","family":"endpoint-detection","question":"A tool on each workstation continuously records process, file, and network activity and can automatically isolate a host when it detects malicious behavior. Which technology is this?","options":["EDR","XDR","NAC","DLP"],"correctIndex":0,"explanation":"EDR. Endpoint detection and response records host activity and can isolate a compromised endpoint. The tell: EDR = detect and respond on endpoints; XDR = correlate across endpoints, network, email, and cloud; NAC = posture check before network access; DLP = stop data exfiltration."},{"id":"q431","domain":"D4","family":"endpoint-detection","question":"A vendor platform correlates detections across endpoints, network sensors, email, and cloud workloads into a single investigation view. Which technology is this?","options":["EDR","FIM","XDR","UBA"],"correctIndex":2,"explanation":"XDR. Extended detection and response correlates signals across endpoints, network, email, and cloud. The tell: XDR = cross-domain correlated detection; EDR = single-endpoint detect and respond; FIM = alert on critical file changes; UBA = flag abnormal user behavior."},{"id":"q432","domain":"D4","family":"endpoint-detection","question":"Which technology alerts the team when critical system files or configuration files are modified from their known-good state?","options":["DLP","UBA","NAC","FIM"],"correctIndex":3,"explanation":"FIM. File integrity monitoring alerts when critical files change from their known-good state. The tell: FIM = alert on critical file changes; DLP = stop data exfiltration; UBA = flag abnormal user behavior; NAC = posture check before network access."},{"id":"q433","domain":"D4","family":"endpoint-detection","question":"A platform builds a baseline of each user's normal login times, locations, and data access, then flags a finance user who suddenly downloads gigabytes at 3 a.m. Which technology is this?","options":["EDR","NAC","UBA","FIM"],"correctIndex":2,"explanation":"UBA. Baselining a user's normal behavior and flagging anomalies like a 3 a.m. bulk download is user behavior analytics. The tell: UBA = flag abnormal user behavior; EDR = detect and respond on the endpoint itself; NAC = check device posture before network admission; FIM = alert on critical file changes."},{"id":"q434","domain":"D4","family":"endpoint-detection","question":"Software on each laptop inspects files being copied to USB drives and blocks any that contain tagged sensitive data from leaving the device. Which technology enforces this?","options":["FIM","EDR","DLP","UBA"],"correctIndex":2,"explanation":"DLP. Inspecting files copied to USB and blocking tagged sensitive data from leaving the device is data loss prevention. The tell: DLP = stop sensitive data exfiltration; FIM = alert on file changes; EDR = detect and respond to endpoint threats; UBA = flag abnormal user behavior."},{"id":"q435","domain":"D4","family":"endpoint-detection","question":"An agent records a trusted baseline of a server's configuration files and Windows registry keys, then reports the instant any of them drifts from that baseline. Which technology is this?","options":["DLP","FIM","EDR","XDR"],"correctIndex":1,"explanation":"FIM. Baselining configuration files and registry keys and reporting drift is file integrity monitoring. The tell: FIM = alert when monitored files or keys change from the known-good baseline; DLP = block data exfiltration; EDR = endpoint detect and respond; XDR = correlate detections across endpoints, network, email, and cloud."},{"id":"q436","domain":"D4","family":"identity-lifecycle","question":"Every quarter, managers review a report of their team's system access and confirm each person still needs it, revoking anything no longer justified. Which identity process is this?","options":["Provisioning","Attestation","Identity proofing","Federation"],"correctIndex":1,"explanation":"Attestation. Periodic manager review confirming access is still appropriate is attestation. The tell: attestation = periodic access review; provisioning = create the account and access; identity proofing = verify a person before issuing identity; federation = trust identities across organizations."},{"id":"q437","domain":"D4","family":"identity-lifecycle","question":"When an employee is terminated, HR triggers a workflow that immediately disables the account and removes all access rights. Which process is this?","options":["Provisioning","Identity proofing","De-provisioning","Attestation"],"correctIndex":2,"explanation":"De-provisioning. Disabling the account and removing access at offboarding is de-provisioning. The tell: de-provisioning = remove access at offboarding; provisioning = create the account and access; identity proofing = verify a person before issuing identity; attestation = periodic access review."},{"id":"q438","domain":"D4","family":"identity-lifecycle","question":"When a new hire starts, an automated workflow creates their accounts and assigns the access their role requires on day one. Which identity process is this?","options":["provisioning","de-provisioning","attestation","identity proofing"],"correctIndex":0,"explanation":"provisioning. Creating accounts and granting the access a role requires for a new hire is provisioning. The tell: provisioning = create the account and grant access; de-provisioning = remove access at offboarding; attestation = periodic review that access is still appropriate; identity proofing = verify who a person is before issuing identity."},{"id":"q439","domain":"D4","family":"identity-lifecycle","question":"After signing in once to the corporate identity provider, a user reaches the HR app, the expense tool, and email without logging in again. Which capability is this?","options":["federation","identity proofing","provisioning","single sign-on"],"correctIndex":3,"explanation":"single sign-on. One login to the identity provider granting access to many apps within the organization is SSO. The tell: single sign-on = one login for many apps; federation = trusting identities across separate organizations; identity proofing = verifying identity before issuance; provisioning = creating the account and access."},{"id":"q440","domain":"D4","family":"federation-protocols","question":"A user clicks 'Log in with corporate SSO' on a cloud HR web app, and the browser is redirected to the company identity provider, which returns a signed XML assertion granting access. Which protocol is in use?","options":["LDAP","OAuth","OpenID Connect","SAML"],"correctIndex":3,"explanation":"SAML. XML assertions exchanged between an identity provider and a service provider for browser SSO are SAML. The tell: SAML = enterprise web SSO via XML assertions; OAuth = delegated authorization via tokens; OpenID Connect = authentication layer built on OAuth; LDAP = directory lookup of users and groups."},{"id":"q441","domain":"D4","family":"federation-protocols","question":"A photo-printing app asks to access a user's cloud storage. The user approves, and the storage provider issues the app a token to retrieve files on the user's behalf without ever sharing the user's password. Which protocol enables this delegated access?","options":["OAuth","SAML","LDAP","OpenID Connect"],"correctIndex":0,"explanation":"OAuth. Delegated, token-based access that lets one app act on your behalf without your password is OAuth. The tell: OAuth = delegated API/app authorization via tokens; OpenID Connect = adds an identity/authentication layer on OAuth; SAML = XML browser SSO for enterprise apps; LDAP = directory query protocol."},{"id":"q442","domain":"D4","family":"federation-protocols","question":"Which protocol is used to query a directory service to look up user accounts, group memberships, and attributes in an on-premises Active Directory?","options":["OAuth","SAML","LDAP","OpenID Connect"],"correctIndex":2,"explanation":"LDAP. Querying a directory for users and groups is LDAP. The tell: LDAP = directory lookup protocol; SAML = XML web SSO assertions; OAuth = delegated token authorization; OpenID Connect = authentication built on OAuth."},{"id":"q443","domain":"D4","family":"federation-protocols","question":"Which protocol uses XML-based security assertions exchanged between an identity provider and a service provider to deliver browser single sign-on for enterprise web applications?","options":["OAuth","SAML","LDAP","OpenID Connect"],"correctIndex":1,"explanation":"SAML. XML assertions passed between an IdP and an SP for enterprise web SSO define SAML. The tell: SAML = enterprise web SSO via XML assertions; OAuth = delegated API authorization using tokens; LDAP = directory lookup of users and groups; OpenID Connect = an authentication layer built on top of OAuth."},{"id":"q444","domain":"D4","family":"federation-protocols","question":"An application is configured to bind to a server on port 389 and retrieve a user's account details and group memberships from the on-premises directory. Which protocol is it using?","options":["SAML","OAuth","LDAP","OpenID Connect"],"correctIndex":2,"explanation":"LDAP. Binding to a directory to read accounts and group memberships is LDAP, which uses port 389. The tell: LDAP = directory lookup; SAML = XML browser SSO to web apps; OAuth = token-based delegated authorization; OpenID Connect = an identity layer added on top of OAuth."},{"id":"q445","domain":"D4","family":"federation-protocols","question":"A third-party scheduling app needs to add events to a user's calendar hosted by a different provider. The user consents, and the provider issues the app a scoped token to write calendar events without ever revealing the user's password. Which protocol provides this delegated authorization?","options":["OAuth","SAML","OpenID Connect","LDAP"],"correctIndex":0,"explanation":"OAuth. A scoped token letting an app act on the user's behalf without sharing the password is delegated authorization, which is OAuth. The tell: OAuth = delegated API authorization via tokens; SAML = enterprise web SSO with XML assertions; OpenID Connect = adds an authentication layer on top of OAuth; LDAP = directory lookup."},{"id":"q446","domain":"D4","family":"access-control-models","question":"In a military network, every file and user carries a classification label, and the operating system - not the file owner - decides access based on clearance levels that users cannot alter. Which model is this?","options":["discretionary access control","role-based access control","rule-based access control","mandatory access control"],"correctIndex":3,"explanation":"Mandatory access control. System-enforced labels and clearances that users cannot change is mandatory access control. The tell: mandatory access control = system-set labels/clearances; discretionary access control = owner grants access; role-based access control = access by job role; rule-based access control = system-wide if/then rules."},{"id":"q447","domain":"D4","family":"access-control-models","question":"On a shared file server, the employee who created a folder can grant or revoke other users' access to it at their own discretion. Which access control model does this describe?","options":["discretionary access control","mandatory access control","attribute-based access control","role-based access control"],"correctIndex":0,"explanation":"Discretionary access control. The data owner deciding who gets access is discretionary access control. The tell: discretionary access control = owner grants access; mandatory access control = system labels users cannot change; role-based access control = access by role; attribute-based access control = access by evaluated attributes."},{"id":"q448","domain":"D4","family":"access-control-models","question":"Access to a document is granted only when the requester is in the finance department, connecting from a corporate-managed device, and located in an approved country, with the system evaluating all three conditions together. Which model is this?","options":["role-based access control","rule-based access control","attribute-based access control","mandatory access control"],"correctIndex":2,"explanation":"Attribute-based access control. Combining multiple evaluated attributes such as department, device, and location is attribute-based access control. The tell: attribute-based access control = decision from multiple evaluated attributes; rule-based access control = system-wide if/then rules such as time-of-day; role-based access control = based on job role; mandatory access control = system labels/clearances."},{"id":"q449","domain":"D4","family":"access-control-models","question":"A hospital assigns permissions to the 'nurse' group and the 'billing' group, and users receive access purely by which job group they are placed in. Which model is this?","options":["attribute-based access control","role-based access control","discretionary access control","rule-based access control"],"correctIndex":1,"explanation":"Role-based access control. Granting access by job role or group membership is role-based access control. The tell: role-based access control = access by job role/group; rule-based access control = system-wide if/then rules; discretionary access control = owner-granted; attribute-based access control = multiple evaluated attributes."},{"id":"q450","domain":"D4","family":"access-control-models","question":"A network switch is configured so that any employee may connect only between 8 a.m. and 6 p.m. on weekdays; outside those hours all connections are denied regardless of who the user is. Which access control model enforces this?","options":["role-based access control","rule-based access control","attribute-based access control","mandatory access control"],"correctIndex":1,"explanation":"Rule-based access control. A uniform time-of-day if-then rule applied to everyone regardless of identity is rule-based access control. The tell: rule-based access control = system-wide if-then rules such as time-of-day; attribute-based access control = decisions from multiple evaluated attributes like department, device, and location together; role-based access control = access by job role or group; mandatory access control = system-enforced clearance labels users cannot change."},{"id":"q451","domain":"D4","family":"access-control-models","question":"Which access control model makes each decision by evaluating a combination of characteristics of the request together, such as the user's department, the device's compliance state, and the connection's location?","options":["rule-based access control","discretionary access control","attribute-based access control","role-based access control"],"correctIndex":2,"explanation":"Attribute-based access control. Combining multiple evaluated attributes into a single decision is attribute-based access control. The tell: attribute-based access control = multiple attributes evaluated together; rule-based access control = one system-wide if-then rule such as time-of-day; discretionary access control = the data owner grants access; role-based access control = access granted by job role."},{"id":"q452","domain":"D4","family":"access-control-models","question":"On a Linux server, the user who owns a file runs a command to decide which other users and groups may read or write it, entirely at that owner's own judgment. Which access control model does this reflect?","options":["discretionary access control","role-based access control","mandatory access control","rule-based access control"],"correctIndex":0,"explanation":"Discretionary access control. The resource owner decides who gets access at their own discretion, which is discretionary access control. The tell: discretionary access control = the owner grants access; mandatory access control = the system enforces clearance labels the owner cannot change; role-based access control = access by job role; rule-based access control = system-wide if-then rules such as time-of-day."},{"id":"q453","domain":"D4","family":"mfa","question":"A login requires a password plus a fingerprint scan. The fingerprint satisfies which authentication factor?","options":["something you know","something you have","somewhere you are","something you are"],"correctIndex":3,"explanation":"Something you are. A biometric such as a fingerprint is 'something you are.' The tell: something you know = password/PIN; something you have = token/phone/key; something you are = biometric; somewhere you are = geolocation."},{"id":"q454","domain":"D4","family":"mfa","question":"An app on the user's phone generates a rotating six-digit code that must be entered after the password. Which factor does the code represent?","options":["something you have","something you are","something you know","somewhere you are"],"correctIndex":0,"explanation":"Something you have. A soft-token code from a device you possess is 'something you have.' The tell: something you have = token/phone/security key; something you know = password/PIN; something you are = biometric; somewhere you are = location."},{"id":"q455","domain":"D4","family":"mfa","question":"A small physical USB device that authenticates via a cryptographic challenge when tapped or inserted, with no code to type, is best described as which?","options":["soft token","hard token","security key","biometric"],"correctIndex":2,"explanation":"Security key. A USB or NFC device using a cryptographic challenge with no code to type is a security key. The tell: security key = cryptographic hardware authenticator (FIDO), no code typed; hard token = physical device that displays a rotating code; soft token = app-generated code; biometric = a physical trait."},{"id":"q456","domain":"D4","family":"mfa","question":"Which authentication factor is satisfied by verifying a user's physical geographic location, such as GPS coordinates or network region?","options":["something you know","something you have","something you are","somewhere you are"],"correctIndex":3,"explanation":"Somewhere you are. Verifying physical location as an authentication input is the 'somewhere you are' factor. The tell: somewhere you are = geolocation; something you know = password or PIN; something you have = token or phone; something you are = a biometric such as a fingerprint."},{"id":"q457","domain":"D4","family":"mfa","question":"A system requires a password and then the answer to a personal security question before granting access. Why does this fail to qualify as multifactor authentication?","options":["Both inputs are the 'something you know' factor","The two inputs are 'something you have' and 'something you are'","A security question counts as 'something you are'","Passwords are never accepted as an authentication factor"],"correctIndex":0,"explanation":"Both inputs are the 'something you know' factor. A password and a security-question answer are both knowledge, so using two of the same factor is not true MFA. The tell: something you know = password, PIN, or security answer; something you have = a token or phone; something you are = a biometric; true MFA requires two DIFFERENT factor types."},{"id":"q458","domain":"D4","family":"password-security","question":"A policy prevents users from changing their password again until it has been in place for at least three days, stopping them from cycling back to a favorite password. Which setting is this?","options":["expiration","age","complexity","length"],"correctIndex":1,"explanation":"Age. A minimum time before a password may be changed again is password age. The tell: age = minimum time before you can change again; expiration = forced change interval (maximum age); length = character count; complexity = character variety."},{"id":"q459","domain":"D4","family":"password-security","question":"A breach investigation finds that one leaked password unlocked the employee's accounts on five different systems because the same password was used everywhere. Which weakness does this illustrate?","options":["expiration","length","complexity","reuse"],"correctIndex":3,"explanation":"Reuse. Using one password across many accounts is reuse. The tell: reuse = same password across accounts; expiration = forced change interval; length = number of characters; complexity = character variety."},{"id":"q460","domain":"D4","family":"password-security","question":"A security team raises the required minimum from 8 to 16 characters, noting that the number of characters is the single biggest driver of resistance to brute forcing. Which password setting did they strengthen?","options":["complexity","expiration","age","length"],"correctIndex":3,"explanation":"Length. The number of characters in a password is its length, the strongest single driver of brute-force resistance. The tell: length = character count; complexity = variety of character types; expiration = forced change interval; age = minimum time before a change is allowed."},{"id":"q461","domain":"D4","family":"password-security","question":"Which password-security approach authenticates a user with something like a biometric or a hardware security key so that no secret phrase is ever typed?","options":["expiration","complexity","passwordless","password manager"],"correctIndex":2,"explanation":"Passwordless. Authenticating with no typed secret at all, relying on biometrics or keys, is the passwordless approach. The tell: passwordless = no password used at all; password manager = software that stores and fills passwords for you; complexity = required character variety; expiration = forced change interval."},{"id":"q462","domain":"D4","family":"pam","question":"An administrator normally has standard rights, but when a task requires it the system elevates the account to admin for exactly 30 minutes and then automatically removes the elevation. Which PAM technique is this?","options":["just-in-time permissions","password vaulting","ephemeral credentials","privileged session management"],"correctIndex":0,"explanation":"Just-in-time permissions. Elevating rights only for the moment needed and then revoking is just-in-time. The tell: just-in-time permissions = temporary elevation then revoke; password vaulting = check out stored privileged passwords; ephemeral credentials = short-lived credentials that self-expire; privileged session management = monitor/record admin sessions."},{"id":"q463","domain":"D4","family":"pam","question":"Administrators never know the actual root password; they check it out from a secured central store that logs the access and rotates the password after use. Which PAM capability is described?","options":["just-in-time permissions","ephemeral credentials","privileged session management","password vaulting"],"correctIndex":3,"explanation":"Password vaulting. Storing and checking out privileged passwords from a secured vault is password vaulting. The tell: password vaulting = check out stored privileged passwords; just-in-time permissions = temporary elevation then revoke; ephemeral credentials = short-lived self-expiring credentials; privileged session management = record/monitor sessions."},{"id":"q464","domain":"D4","family":"pam","question":"Which PAM approach issues credentials that exist only briefly and automatically expire after a single use, leaving nothing standing for an attacker to steal later?","options":["password vaulting","just-in-time permissions","ephemeral credentials","privileged session management"],"correctIndex":2,"explanation":"Ephemeral credentials. Short-lived credentials that self-expire after use are ephemeral credentials. The tell: ephemeral credentials = short-lived, self-expiring; password vaulting = check out stored passwords; just-in-time permissions = temporary elevation then revoke; privileged session management = monitor/record sessions."},{"id":"q465","domain":"D4","family":"pam","question":"Which privileged access management capability keeps administrative passwords in a protected repository from which they are checked out and then rotated, rather than being memorized by administrators?","options":["ephemeral credentials","password vaulting","just-in-time permissions","privileged access management"],"correctIndex":1,"explanation":"Password vaulting. Storing privileged passwords in a protected repository for checkout and rotation is password vaulting. The tell: password vaulting = check out and rotate stored privileged passwords; just-in-time permissions = grant elevated rights only for the moment needed; ephemeral credentials = short-lived credentials that self-expire; privileged access management = the overall program these techniques fall under, not the specific capability described."},{"id":"q466","domain":"D4","family":"pam","question":"Just-in-time permissions in a privileged access management program work by doing which of the following?","options":["Granting elevated rights only for the brief moment a task needs them, then automatically revoking them","Storing and rotating shared privileged passwords checked out from a vault","Issuing credentials that self-expire seconds after a single use","Managing all privileged accounts as a broad governance program"],"correctIndex":0,"explanation":"Just-in-time permissions. This technique grants elevated access only for the moment needed and then removes it, so no standing privilege remains. The tell: just-in-time permissions = elevate only for the needed moment; password vaulting = check out and rotate stored privileged passwords; ephemeral credentials = credentials that self-expire after brief single use; privileged access management = the overarching program containing these techniques."},{"id":"q467","domain":"D4","family":"pam","question":"A continuous deployment pipeline requests a credential that is valid for only a few minutes to complete one deployment task, after which it is automatically invalidated and cannot be reused even if intercepted. Which privileged access management technique produced it?","options":["password vaulting","ephemeral credentials","just-in-time permissions","privileged access management"],"correctIndex":1,"explanation":"Ephemeral credentials. A short-lived credential that self-invalidates after brief use is an ephemeral credential. The tell: ephemeral credentials = short-lived, self-expiring credentials; password vaulting = check out and rotate stored passwords; just-in-time permissions = temporarily elevate an existing account's rights; privileged access management = the broad program these techniques belong to."},{"id":"q468","domain":"D4","family":"automation","question":"An automated provisioning pipeline is configured so it can never open a storage bucket to the public internet or exceed a set spending limit, keeping every automated action within policy. What is this control called?","options":["ticket creation","guard rails","escalation","single point of failure"],"correctIndex":1,"explanation":"Guard rails. Automated limits that keep actions within policy are guard rails. The tell: guard rails = automated policy limits; ticket creation = auto-open a tracked work item; escalation = auto-route to a higher tier; single point of failure = the automation becoming a critical dependency."},{"id":"q469","domain":"D4","family":"automation","question":"A team automates nearly all onboarding through one orchestration script. When that script's server goes down, no new accounts can be created anywhere. Which risk of automation does this highlight?","options":["guard rails","single point of failure","escalation","ticket creation"],"correctIndex":1,"explanation":"Single point of failure. The automation itself becoming a critical dependency that halts everything when it fails is a single point of failure. The tell: single point of failure = automation as critical dependency; guard rails = automated policy limits; escalation = auto-route to higher tier; ticket creation = auto-open a work item."},{"id":"q470","domain":"D4","family":"automation","question":"When monitoring detects a failed backup job, an automation workflow automatically opens a tracked work item in the service desk so the problem is assigned and followed to closure. Which automation capability is this?","options":["escalation","guard rails","continuous integration","ticket creation"],"correctIndex":3,"explanation":"Ticket creation. Automatically opening a tracked work item is the ticket-creation capability. The tell: ticket creation = auto-open a tracked work item; escalation = auto-route an unresolved item to a higher tier; guard rails = automated limits keeping actions within policy; continuous integration = automated build and test of code changes."},{"id":"q471","domain":"D4","family":"automation","question":"Which automation capability automatically routes an unacknowledged or unresolved item up to a higher support tier?","options":["ticket creation","guard rails","escalation","continuous integration"],"correctIndex":2,"explanation":"Escalation. Automatically routing an unresolved item to a higher tier is escalation. The tell: escalation = route up when unresolved; ticket creation = open the tracked item in the first place; guard rails = policy limits on automated actions; continuous integration = automated build and test of code."},{"id":"q472","domain":"D4","family":"ir-process","question":"An incident response team has just isolated the infected hosts from the network to stop the malware from spreading further. According to the standard incident response process, which phase comes next?","options":["eradication","recovery","detection","lessons learned"],"correctIndex":0,"explanation":"Eradication. After containment stops the spread, eradication removes the threat and artifacts before recovery. The tell: containment = stop the spread; eradication = remove the threat/artifacts; recovery = restore to normal operations; lessons learned = post-incident review."},{"id":"q473","domain":"D4","family":"ir-process","question":"After an alert fires, the team confirms the event is a genuine incident and determines how many systems and accounts are affected, but has not yet taken any action to stop it. Which phase is this?","options":["detection","analysis","containment","preparation"],"correctIndex":1,"explanation":"Analysis. Confirming the incident is real and scoping its impact is analysis. The tell: detection = notice the event; analysis = confirm and scope it; containment = stop the spread; preparation = plans and tools before anything ha
