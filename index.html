tIndex":0,"explanation":"Loss of license. Being barred from operating is loss of license. The tell: loss of license = you can no longer legally operate, fines = a monetary penalty, reputational damage = brand harm, sanctions = imposed restrictions or penalties."},{"id":"q606","domain":"D5","family":"compliance","question":"After a breach, a company is legally required to notify the data-protection regulator and affected public. This obligation is an example of what?","options":["Contractual impacts","Sanctions","External reporting","Internal reporting"],"correctIndex":2,"explanation":"External reporting. Reporting to regulators and the public outside the organization is external reporting. The tell: external reporting = to regulators and public, contractual impacts = penalties triggered under a contract, sanctions = imposed restrictions, internal reporting = to management or the board."},{"id":"q607","domain":"D5","family":"compliance","question":"After failing a payment-card standard audit, a merchant is ordered to pay a monetary penalty to the card brands. Which compliance consequence is this?","options":["fines","sanctions","reputational damage","loss of license"],"correctIndex":0,"explanation":"Fines. A monetary penalty ordered after failing a standard is a fine. The tell: sanctions = imposed restrictions or penalties, reputational damage = brand harm, loss of license = being barred from operating."},{"id":"q608","domain":"D5","family":"compliance","question":"News coverage of a company's mishandled breach drives customers to competitors and erodes brand trust. Which consequence is this?","options":["fines","loss of license","reputational damage","contractual impacts"],"correctIndex":2,"explanation":"Reputational damage. Customers leaving and brand trust eroding after a mishandled breach is reputational damage. The tell: fines = a monetary penalty, loss of license = being barred from operating, contractual impacts = penalties triggered under a contract."},{"id":"q609","domain":"D5","family":"due-diligence-care","question":"Before onboarding a cloud vendor, a firm researches the vendor's certifications, financial stability, and past breaches. This upfront investigation is best described as what?","options":["Due care","Due diligence","Attestation","Acknowledgement"],"correctIndex":1,"explanation":"Due diligence. Investigating and doing the homework before acting is due diligence. The tell: due diligence = investigate before engaging, due care = ongoing reasonable protection once engaged, attestation = formally affirming something is true, acknowledgement = confirming you received or understood something."},{"id":"q610","domain":"D5","family":"due-diligence-care","question":"After engaging the vendor, the firm continuously maintains its own access controls, monitoring, and patching to protect the shared data. These ongoing reasonable actions are called what?","options":["Due care","Due diligence","Attestation","Acknowledgement"],"correctIndex":0,"explanation":"Due care. The ongoing reasonable steps to protect assets after engagement is due care. The tell: due care = act responsibly on an ongoing basis, due diligence = the upfront investigation before acting, attestation = a formal affirmation of truth, acknowledgement = confirming receipt or understanding."},{"id":"q611","domain":"D5","family":"due-diligence-care","question":"Which term refers to formally affirming, often in a signed statement, that a control or condition is true and in place?","options":["Due diligence","Due care","Acknowledgement","Attestation"],"correctIndex":3,"explanation":"Attestation. A formal signed affirmation that something is true is attestation. The tell: attestation = formally affirm a fact is true, due diligence = pre-engagement investigation, due care = ongoing responsible protection, acknowledgement = confirming you received or understood something."},{"id":"q612","domain":"D5","family":"due-diligence-care","question":"A board member reviews an acquisition target's compliance history and audit reports before approving the purchase. This pre-decision investigation is called what?","options":["due care","attestation","acknowledgement","due diligence"],"correctIndex":3,"explanation":"Due diligence. Reviewing an acquisition target's compliance and audit history before approving the deal is upfront investigation, or due diligence. The tell: due care = ongoing reasonable protection after engaging, attestation = a formal signed statement something is true, acknowledgement = confirming receipt and understanding."},{"id":"q613","domain":"D5","family":"due-diligence-care","question":"After reading the security policy, each employee signs a form confirming they received and understood it. This act is best called what?","options":["acknowledgement","attestation","due care","due diligence"],"correctIndex":0,"explanation":"Acknowledgement. Signing to confirm you received and understood a policy is an acknowledgement. The tell: attestation = formally affirming a control or condition is true, due care = ongoing reasonable protective actions, due diligence = the upfront investigation before acting."},{"id":"q614","domain":"D5","family":"due-diligence-care","question":"Which term refers to the ongoing, reasonable actions taken to protect assets after an engagement begins, as opposed to the upfront investigation?","options":["due diligence","attestation","due care","acknowledgement"],"correctIndex":2,"explanation":"Due care. The ongoing, reasonable actions taken to protect assets after an engagement begins is due care. The tell: due diligence = the upfront investigation before acting, attestation = a formal statement something is true, acknowledgement = confirming receipt and understanding."},{"id":"q615","domain":"D5","family":"privacy","question":"A customer submits a request demanding that a company erase all personal data it holds about her. Which privacy right is she exercising?","options":["Data inventory","Right to be forgotten","Data retention","Data subject"],"correctIndex":1,"explanation":"Right to be forgotten. The subject's right to have their personal data erased is the right to be forgotten. The tell: right to be forgotten = right to have your data deleted, data inventory = knowing what personal data you hold, data retention = how long you keep it, data subject = the person the data is about."},{"id":"q616","domain":"D5","family":"privacy","question":"In privacy law, which term refers to the individual person that a set of personal data is actually about?","options":["Data subject","Data controller","Data processor","Data custodian"],"correctIndex":0,"explanation":"Data subject. The individual a set of personal data describes is the data subject. The tell: data subject = the person the data is about, data controller = decides why and how data is processed, data processor = handles data on the controller's behalf, data custodian = provides hands-on technical care of the data."},{"id":"q617","domain":"D5","family":"privacy","question":"To comply with privacy law, a company catalogs exactly what personal data it holds, where it lives, and why. Which practice is this?","options":["data inventory","right to be forgotten","retention","data subject"],"correctIndex":0,"explanation":"Data inventory. Cataloging what personal data you hold, where it is, and why is maintaining a data inventory. The tell: right to be forgotten = the subject's right to erasure, retention = how long you keep data, data subject = the person the data is about."},{"id":"q618","domain":"D5","family":"privacy","question":"A privacy policy states customer records will be kept for seven years and then deleted. Which concept does the seven-year period define?","options":["data inventory","retention","right to be forgotten","ownership"],"correctIndex":1,"explanation":"Retention. The defined period data is kept before deletion is the retention period. The tell: data inventory = knowing what data you hold, right to be forgotten = the subject's erasure right, ownership = who is accountable for the data."},{"id":"q619","domain":"D5","family":"audits","question":"A department rates its own controls against a checklist and reports the results to its manager, with no outside reviewer involved. Which audit type is this?","options":["Independent third-party audit","External audit","Regulatory examination","Self-assessment"],"correctIndex":3,"explanation":"Self-assessment. A team rating its own controls is a self-assessment. The tell: self-assessment = the team rates itself, independent third-party audit = an unaffiliated outsider reviews for objectivity, external audit = an outside party reviews, regulatory examination = a government regulator inspects."},{"id":"q620","domain":"D5","family":"audits","question":"To satisfy investors who distrust internal reviews, a company hires an unaffiliated auditing firm with no stake in the outcome to review its controls objectively. Which audit type is this?","options":["Self-assessment","Internal audit","Attestation","Independent third-party audit"],"correctIndex":3,"explanation":"Independent third-party audit. An unaffiliated outside auditor engaged for objectivity is an independent third-party audit. The tell: independent third-party audit = unaffiliated outsider for objectivity, self-assessment = the team rates itself, internal audit = your own staff or committee reviews, attestation = a formal signed statement of compliance."},{"id":"q621","domain":"D5","family":"audits","question":"A company's own audit committee reviews control effectiveness and reports findings to the board, using only in-house staff. Which audit type is this?","options":["external audit","internal audit","independent third-party","attestation"],"correctIndex":1,"explanation":"Internal audit. A review by the company's own audit committee and in-house staff is an internal audit. The tell: external audit = an outside party reviews, independent third-party = an unaffiliated auditor for objectivity, attestation = a formal signed compliance statement."},{"id":"q622","domain":"D5","family":"audits","question":"A banking regulator conducts a formal examination of a bank's controls to confirm compliance with law. Which type of audit is this?","options":["self-assessment","internal audit","external audit","attestation"],"correctIndex":2,"explanation":"External audit. A regulator's formal examination of a bank's controls is an external audit. The tell: self-assessment = the team rating itself, internal audit = your own staff reviewing, attestation = a formal signed statement of compliance."},{"id":"q623","domain":"D5","family":"pentest-types","question":"A tester is hired and given no internal documentation, credentials, or network diagrams, and must discover everything as an outside attacker would. Which engagement type is this?","options":["Known environment","Partially known environment","Unknown environment","Integrated"],"correctIndex":2,"explanation":"Unknown environment. Zero inside information provided is an unknown environment test. The tell: unknown environment = tester gets no inside info, partially known environment = tester gets some info, known environment = tester gets full information, integrated = offensive and defensive teams working together."},{"id":"q624","domain":"D5","family":"pentest-types","question":"During early reconnaissance, an analyst gathers information only from public records, search engines, and social media without ever sending a packet to the target. Which activity is this?","options":["Passive reconnaissance","Active reconnaissance","Known environment","Defensive testing"],"correctIndex":0,"explanation":"Passive reconnaissance. Gathering intel without touching the target is passive recon. The tell: passive reconnaissance = collect info without contacting the target, active reconnaissance = directly probe or scan the target, known environment = a test with full information given, defensive testing = the protective blue-team side."},{"id":"q625","domain":"D5","family":"pentest-types","question":"Which penetration testing approach gives the tester some, but not all, internal information about the target before the engagement?","options":["Known environment","Unknown environment","Active reconnaissance","Partially known environment"],"correctIndex":3,"explanation":"Partially known environment. Providing limited internal information defines a partially known environment test. The tell: partially known environment = some info shared, known environment = full info shared, unknown environment = no info shared, active reconnaissance = directly probing the target."},{"id":"q626","domain":"D5","family":"pentest-types","question":"A tester is given full network diagrams, source code, and administrative credentials before beginning the assessment. Which engagement type is this?","options":["unknown environment","partially known environment","passive reconnaissance","known environment"],"correctIndex":3,"explanation":"Known environment. Giving the tester full diagrams, source, and credentials is a known-environment test. The tell: unknown environment = tester gets no inside information, partially known environment = some information, passive reconnaissance = gathering info without touching the target."},{"id":"q627","domain":"D5","family":"pentest-types","question":"An analyst runs port scans and sends crafted packets directly at the target to map live services, actions that could be logged. Which activity is this?","options":["passive reconnaissance","active reconnaissance","unknown environment","known environment"],"correctIndex":1,"explanation":"Active reconnaissance. Port scanning and sending packets directly at the target, which can be logged, is active reconnaissance. The tell: passive reconnaissance = gathering info without touching the target, unknown environment = a scope with no inside info, known environment = full inside info provided."},{"id":"q628","domain":"D5","family":"pentest-types","question":"A tester receives network diagrams but no credentials, getting partial inside knowledge before probing the target. Which engagement type is this?","options":["known environment","unknown environment","partially known environment","passive reconnaissance"],"correctIndex":2,"explanation":"Partially known environment. Receiving diagrams but no credentials gives partial inside knowledge, a partially known-environment test. The tell: known environment = full inside information, unknown environment = no inside information, passive reconnaissance = gathering info without probing the target."},{"id":"q629","domain":"D5","family":"awareness","question":"A security team periodically sends fake but realistic phishing emails to employees to measure and improve how they respond. This training tool is called what?","options":["Recurring reporting","Risky behavior","Initial reporting","Phishing campaign"],"correctIndex":3,"explanation":"Phishing campaign. Sending simulated phishing to train and measure users is a phishing campaign. The tell: phishing campaign = simulated phishing for training, recurring reporting = ongoing reporting cadence, risky behavior = knowingly dangerous user action, initial reporting = the first baseline report."},{"id":"q630","domain":"D5","family":"awareness","question":"An employee accidentally emails a spreadsheet of customer records to the wrong address with no ill intent. This is best classified as which category of anomalous behavior?","options":["Risky behavior","Unexpected behavior","Unintentional behavior","Recurring reporting"],"correctIndex":2,"explanation":"Unintentional behavior. An accidental, no-intent mistake is unintentional behavior. The tell: unintentional behavior = accidental with no intent, risky behavior = knowingly dangerous, unexpected behavior = out of the norm, recurring reporting = ongoing reporting cadence."},{"id":"q631","domain":"D5","family":"awareness","question":"An employee knowingly disables endpoint protection to install an unapproved app, aware it violates policy. Which category of anomalous behavior is this?","options":["risky behavior","unexpected behavior","unintentional behavior","recurring reporting"],"correctIndex":0,"explanation":"Risky behavior. Knowingly disabling protection in violation of policy is risky behavior. The tell: unexpected behavior = out of the norm but not clearly dangerous, unintentional behavior = accidental with no ill intent, recurring reporting = an ongoing reporting cadence."},{"id":"q632","domain":"D5","family":"awareness","question":"A security program sends staff quarterly reminders and repeats its awareness metrics on a fixed cadence throughout the year. Which reporting type is this?","options":["initial reporting","recurring reporting","risky behavior","phishing campaign"],"correctIndex":1,"explanation":"Recurring reporting. Repeating awareness reminders and metrics on a fixed cadence is recurring reporting. The tell: initial reporting = the first-time baseline report, risky behavior = knowingly dangerous action, phishing campaign = simulated phishing to train users."}],"families":{"control-categories":{"domain":"D1","tier":"base"},"control-types":{"domain":"D1","tier":"high"},"cia-nonrepudiation":{"domain":"D1","tier":"base"},"aaa":{"domain":"D1","tier":"base"},"zero-trust":{"domain":"D1","tier":"high"},"physical-security":{"domain":"D1","tier":"base"},"deception":{"domain":"D1","tier":"base"},"change-management":{"domain":"D1","tier":"base"},"crypto-key-handling":{"domain":"D1","tier":"priority"},"crypto-methods":{"domain":"D1","tier":"base"},"pki-signatures":{"domain":"D1","tier":"base"},"obfuscation":{"domain":"D1","tier":"base"},"encryption-levels":{"domain":"D1","tier":"base"},"certificates":{"domain":"D1","tier":"high"},"threat-actors":{"domain":"D2","tier":"base"},"social-eng-phish":{"domain":"D2","tier":"base"},"misinformation":{"domain":"D2","tier":"high"},"impersonation":{"domain":"D2","tier":"base"},"social-eng-other":{"domain":"D2","tier":"base"},"attack-vectors":{"domain":"D2","tier":"base"},"supply-chain":{"domain":"D2","tier":"base"},"app-vulns":{"domain":"D2","tier":"base"},"race-conditions":{"domain":"D2","tier":"high"},"system-vulns":{"domain":"D2","tier":"base"},"malware":{"domain":"D2","tier":"high"},"ddos-network":{"domain":"D2","tier":"high"},"app-attacks":{"domain":"D2","tier":"base"},"crypto-attacks":{"domain":"D2","tier":"high"},"password-attacks":{"domain":"D2","tier":"high"},"indicators":{"domain":"D2","tier":"high"},"mitigations":{"domain":"D2","tier":"base"},"containerization":{"domain":"D3","tier":"high"},"isolation-models":{"domain":"D3","tier":"base"},"embedded-systems":{"domain":"D3","tier":"base"},"arch-considerations":{"domain":"D3","tier":"base"},"fail-modes":{"domain":"D3","tier":"high"},"active-passive":{"domain":"D3","tier":"high"},"jump-proxy":{"domain":"D3","tier":"high"},"ips-ids":{"domain":"D3","tier":"high"},"firewalls":{"domain":"D3","tier":"base"},"port-auth":{"domain":"D3","tier":"base"},"secure-tunnels":{"domain":"D3","tier":"high"},"data-classification":{"domain":"D3","tier":"base"},"data-states":{"domain":"D3","tier":"base"},"data-protection":{"domain":"D3","tier":"base"},"load-balancing":{"domain":"D3","tier":"high"},"sites":{"domain":"D3","tier":"priority"},"resilience-planning":{"domain":"D3","tier":"base"},"continuity-testing":{"domain":"D3","tier":"high"},"backups":{"domain":"D3","tier":"priority"},"power":{"domain":"D3","tier":"base"},"baselines":{"domain":"D4","tier":"base"},"wireless-install":{"domain":"D4","tier":"base"},"mobile-deployment":{"domain":"D4","tier":"high"},"app-security":{"domain":"D4","tier":"base"},"asset-management":{"domain":"D4","tier":"base"},"asset-disposal":{"domain":"D4","tier":"high"},"analysis-types":{"domain":"D4","tier":"high"},"threat-intel":{"domain":"D4","tier":"base"},"security-assessments":{"domain":"D4","tier":"base"},"false-pos-neg":{"domain":"D4","tier":"high"},"cve-cvss":{"domain":"D4","tier":"priority"},"vuln-response":{"domain":"D4","tier":"base"},"monitoring":{"domain":"D4","tier":"base"},"security-tools":{"domain":"D4","tier":"high"},"firewall-config":{"domain":"D4","tier":"base"},"web-filter":{"domain":"D4","tier":"base"},"os-hardening":{"domain":"D4","tier":"high"},"email-security":{"domain":"D4","tier":"priority"},"endpoint-detection":{"domain":"D4","tier":"high"},"identity-lifecycle":{"domain":"D4","tier":"base"},"federation-protocols":{"domain":"D4","tier":"high"},"access-control-models":{"domain":"D4","tier":"high"},"mfa":{"domain":"D4","tier":"base"},"password-security":{"domain":"D4","tier":"base"},"pam":{"domain":"D4","tier":"high"},"automation":{"domain":"D4","tier":"base"},"ir-process":{"domain":"D4","tier":"high"},"ir-testing":{"domain":"D4","tier":"base"},"forensics":{"domain":"D4","tier":"high"},"log-sources":{"domain":"D4","tier":"base"},"governance-hierarchy":{"domain":"D5","tier":"high"},"policies":{"domain":"D5","tier":"high"},"standards-procedures":{"domain":"D5","tier":"base"},"external-governance":{"domain":"D5","tier":"base"},"data-roles":{"domain":"D5","tier":"high"},"risk-assessment-types":{"domain":"D5","tier":"base"},"qual-quant":{"domain":"D5","tier":"high"},"risk-math":{"domain":"D5","tier":"high"},"probability-impact":{"domain":"D5","tier":"base"},"risk-register":{"domain":"D5","tier":"base"},"risk-appetite":{"domain":"D5","tier":"high"},"risk-strategies":{"domain":"D5","tier":"priority"},"bia":{"domain":"D5","tier":"high"},"vendor-assessment":{"domain":"D5","tier":"base"},"agreements":{"domain":"D5","tier":"priority"},"compliance":{"domain":"D5","tier":"base"},"due-diligence-care":{"domain":"D5","tier":"high"},"privacy":{"domain":"D5","tier":"base"},"audits":{"domain":"D5","tier":"base"},"pentest-types":{"domain":"D5","tier":"high"},"awareness":{"domain":"D5","tier":"base"}},"reference":[{"key":"control-categories","domain":"D1 General Security Concepts","tier":"base","siblings":"technical / managerial / operational / physical","tell":"Tell: technical = implemented in tech/hardware/software (firewall, encryption); managerial = administrative decisions/policy/risk (security policy, risk assessments); operational = day-to-day human processes (guard rotations, awareness training, incident handling); physical = tangible barriers (locks, fences, guards)."},{"key":"control-types","domain":"D1 General Security Concepts","tier":"high","siblings":"preventive / deterrent / detective / corrective / compensating / directive","tell":"Tell: preventive = stops it before (lock, ACL); deterrent = discourages (warning sign, lighting); detective = finds it after (IDS, logs, cameras reviewing); corrective = fixes/restores after (backup restore, patch); compensating = alternate when primary is not feasible (extra monitoring when you cannot patch); directive = mandates behavior (policy, acceptable use)."},{"key":"cia-nonrepudiation","domain":"D1 General Security Concepts","tier":"base","siblings":"confidentiality / integrity / availability / non-repudiation","tell":"Tell: confidentiality = secrecy (encryption); integrity = unaltered (hashing, checksums); availability = uptime (redundancy, backups); non-repudiation = cannot deny you did it (digital signatures, audit logs)."},{"key":"aaa","domain":"D1 General Security Concepts","tier":"base","siblings":"authentication / authorization / accounting","tell":"Tell: authentication = prove who you are; authorization = what you are allowed to do; accounting = recording what you did (logs, session records)."},{"key":"zero-trust","domain":"D1 General Security Concepts","tier":"high","siblings":"Policy Engine / Policy Administrator / Policy Enforcement Point; control plane vs data plane; adaptive identity / threat scope reduction / policy-driven access control / implicit trust zones","tell":"Tell: Policy Engine = makes the grant/deny decision; Policy Administrator = generates/relays the access token to the PEP; Policy Enforcement Point = the gate that actually allows/blocks the session; control plane = where policy decisions live; data plane = where the traffic/subject actually flows."},{"key":"physical-security","domain":"D1 General Security Concepts","tier":"base","siblings":"bollards / fencing / access control vestibule / video surveillance / security guard / access badge / lighting / sensors (infrared, pressure, microwave, ultrasonic)","tell":"Tell: bollards = stop vehicles; access control vestibule = one-person-at-a-time double-door to stop piggybacking; infrared sensor = detects heat/body; pressure sensor = detects weight/step; microwave/ultrasonic = detect motion via reflected waves."},{"key":"deception","domain":"D1 General Security Concepts","tier":"base","siblings":"honeypot / honeynet / honeyfile / honeytoken","tell":"Tell: honeypot = one decoy system; honeynet = a whole decoy network; honeyfile = a bait file; honeytoken = a bait credential/record that fires an alert when used."},{"key":"change-management","domain":"D1 General Security Concepts","tier":"base","siblings":"approval process / ownership / stakeholders / impact analysis / test results / backout plan / maintenance window / standard operating procedure (SOP); allow list vs deny list; version control","tell":"Tell: impact analysis = what could break; backout plan = how to undo; maintenance window = approved time to make the change; SOP = the repeatable documented procedure; version control = track revisions of code/config."},{"key":"crypto-key-handling","domain":"D1 General Security Concepts","tier":"priority","siblings":"TPM / HSM / secure enclave / key management system / key escrow","tell":"Tell: TPM = crypto chip built into ONE endpoint's motherboard (boot integrity, disk key); HSM = dedicated hardware appliance that generates/stores keys at scale for many systems; secure enclave = isolated coprocessor region on a CPU/phone for keys/biometrics; key management system = software service that handles key lifecycle (create/rotate/revoke); key escrow = a third party holds a copy of keys for recovery/legal access. Hit \"key escrow vs HSM\" and \"TPM vs HSM\" hard."},{"key":"crypto-methods","domain":"D1 General Security Concepts","tier":"base","siblings":"symmetric vs asymmetric; key exchange; key stretching; salting; hashing","tell":"Tell: symmetric = one shared key, fast, bulk data; asymmetric = public/private key pair, slower, key exchange and signatures; key exchange = safely agree on a shared key (Diffie-Hellman); key stretching = make a weak password expensive to brute force (PBKDF2, bcrypt); salting = add random per-password value to defeat rainbow tables; hashing = one-way integrity fingerprint."},{"key":"pki-signatures","domain":"D1 General Security Concepts","tier":"base","siblings":"public key vs private key roles; digital signature; hashing; blockchain; open public ledger","tell":"Tell: encrypt for confidentiality = recipient's PUBLIC key (only their private key opens it); sign for non-repudiation = sender's PRIVATE key (anyone verifies with the public key); digital signature = hash of message encrypted with signer's private key (integrity + non-repudiation); blockchain = chained hashed blocks; open public ledger = the publicly visible record of blockchain transactions."},{"key":"obfuscation","domain":"D1 General Security Concepts","tier":"base","siblings":"steganography / tokenization / data masking","tell":"Tell: steganography = hide data inside other media (image, audio); tokenization = replace sensitive value with a token that maps back via a vault; data masking = show partial/scrambled value (XXXX-1234) that cannot be reversed."},{"key":"encryption-levels","domain":"D1 General Security Concepts","tier":"base","siblings":"full-disk / partition / volume / file / database / record","tell":"Tell: full-disk = the entire drive; partition = one partition; volume = a logical volume; file = individual files; database = the whole database; record = a single row/field inside the database."},{"key":"certificates","domain":"D1 General Security Concepts","tier":"high","siblings":"CRL vs OCSP; self-signed vs third-party; wildcard; CSR; root of trust; certificate authority","tell":"Tell: CRL = a downloaded list of revoked certs (batch, can be stale); OCSP = real-time single-cert revocation check; self-signed = you signed it yourself, no external trust; third-party/CA-issued = a trusted CA vouches for it; wildcard = covers *.domain subdomains; CSR = the request you send to a CA to get a cert; root of trust = the anchor CA the chain terminates at."},{"key":"threat-actors","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"nation-state / organized crime / hacktivist / insider threat / unskilled attacker / shadow IT; motivations: espionage / data exfiltration / blackmail / financial gain / philosophical-political / ethical / revenge / disruption / war","tell":"Tell: nation-state = highly resourced, espionage/war, APT; organized crime = financial gain; hacktivist = philosophical/political message; insider threat = trusted internal person; unskilled attacker = uses others' tools (script), low skill; shadow IT = unsanctioned internal tech, not malicious intent."},{"key":"social-eng-phish","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"phishing / vishing / smishing","tell":"Tell: phishing = email; vishing = voice call; smishing = SMS text."},{"key":"misinformation","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"high","siblings":"misinformation vs disinformation","tell":"Tell: misinformation = false info spread WITHOUT intent to deceive (honest mistake); disinformation = false info spread deliberately to deceive/manipulate."},{"key":"impersonation","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"impersonation / brand impersonation / pretexting / business email compromise (BEC)","tell":"Tell: impersonation = pretend to be someone (help desk); brand impersonation = fake a trusted company's look; pretexting = invent a believable backstory to justify the ask; BEC = compromised/spoofed internal executive email requesting wire/gift cards."},{"key":"social-eng-other","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"watering hole / typosquatting","tell":"Tell: watering hole = compromise a site the target group already visits; typosquatting = register a misspelled lookalike domain."},{"key":"attack-vectors","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"message-based (email/SMS/IM) / image-based / file-based / voice call / removable device / client-based vs agentless / open service ports / default credentials / unsecure networks","tell":"Tell: client-based = requires installed agent that can be compromised; agentless = no installed software (less footprint, less control); removable device = USB vector; open service ports = exposed listening service; default credentials = unchanged out-of-box password."},{"key":"supply-chain","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"managed service provider (MSP) / vendor / supplier; service provider / hardware provider / software provider","tell":"Tell: MSP = third party that runs your IT operations; vendor = sells you a product/service; supplier = provides parts/materials upstream; hardware provider = supplies devices; software provider = supplies applications."},{"key":"app-vulns","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"memory injection / buffer overflow / SQL injection (SQLi) / cross-site scripting (XSS) / malicious update","tell":"Tell: memory injection = insert code into a running process's memory; buffer overflow = write past a buffer boundary to overwrite memory; SQLi = inject SQL into a query to hit the database; XSS = inject script that runs in another user's browser; malicious update = trojanized software update."},{"key":"race-conditions","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"high","siblings":"time-of-check (TOC) vs time-of-use (TOU)","tell":"Tell: race condition = outcome depends on timing of events; TOC = the moment a resource/permission is checked; TOU = the moment it is actually used; the gap between check and use is the exploit window (TOCTOU)."},{"key":"system-vulns","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"firmware / end-of-life / legacy / VM escape / resource reuse / side loading / jailbreaking / misconfiguration / zero-day","tell":"Tell: end-of-life = vendor stopped selling/supporting; legacy = outdated but still running; VM escape = break out of a guest to the hypervisor/host; resource reuse = leftover data in reallocated memory/storage; side loading = install apps outside the official store; jailbreaking = remove OS restrictions for root; zero-day = no patch exists yet."},{"key":"malware","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"high","siblings":"virus / worm / trojan / ransomware / spyware / bloatware / keylogger / logic bomb / rootkit","tell":"Tell: virus = needs a host file and user action to spread; worm = self-replicates across the network with no user action; trojan = disguised as legitimate; ransomware = encrypts and extorts; spyware = secretly collects activity; bloatware = unwanted preinstalled software; keylogger = records keystrokes; logic bomb = payload triggered by a condition/date; rootkit = hides at OS/kernel level to keep persistence."},{"key":"ddos-network","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"high","siblings":"DDoS amplified vs reflected; DNS attacks / on-path / credential replay / wireless","tell":"Tell: amplified = small request yields a huge response aimed at the victim; reflected = spoof the victim's source so third parties reply to the victim; on-path = attacker sits between two parties to read/alter traffic; credential replay = capture and resend valid credentials/session; DNS attack = poison/hijack name resolution."},{"key":"app-attacks","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"injection / replay / privilege escalation / forgery (request forgery) / directory traversal","tell":"Tell: injection = insert malicious input into an interpreter; replay = resend captured valid traffic; privilege escalation = gain higher rights than granted; forgery = trick a user/site into sending a state-changing request (CSRF); directory traversal = ../ path tricks to read files outside web root."},{"key":"crypto-attacks","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"high","siblings":"downgrade / collision / birthday","tell":"Tell: downgrade = force a weaker protocol/cipher (TLS to SSL); collision = two different inputs produce the same hash; birthday = probability attack that finds collisions faster than expected (birthday paradox)."},{"key":"password-attacks","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"high","siblings":"spraying vs brute force (and dictionary)","tell":"Tell: spraying = a few common passwords tried against MANY accounts to avoid lockout; brute force = exhaustively try many passwords against ONE account; dictionary = try a wordlist of likely passwords."},{"key":"indicators","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"high","siblings":"account lockout / concurrent session usage / impossible travel / blocked content / resource consumption / resource inaccessibility / out-of-cycle logging / missing logs / published-documented","tell":"Tell: impossible travel = logins from distant places too close in time; concurrent session usage = same account active in multiple sessions at once; out-of-cycle logging = log entries at unusual times; missing logs = gaps suggest tampering; resource inaccessibility = services suddenly unavailable (possible ransomware/DoS)."},{"key":"mitigations","domain":"D2 Threats, Vulnerabilities, Mitigations","tier":"base","siblings":"segmentation / isolation / ACL / permissions / application allow list / least privilege / configuration enforcement / decommissioning / patching / hardening (host-based firewall, HIPS, disable ports/protocols, default password changes, remove unnecessary software, endpoint protection)","tell":"Tell: segmentation = split the network into zones; isolation = fully cut a host off; least privilege = minimum rights needed; application allow list = only approved apps run; configuration enforcement = push and hold a secure config; decommissioning = securely retire an asset."},{"key":"containerization","domain":"D3 Security Architecture","tier":"high","siblings":"containerization vs virtualization; IaC / serverless / microservices","tell":"Tell: virtualization = full guest OS per VM on a hypervisor; containerization = share the host kernel, package app + deps only (lighter); serverless = provider runs functions, no server to manage; microservices = app split into small independent services; IaC = provision infrastructure from code/templates."},{"key":"isolation-models","domain":"D3 Security Architecture","tier":"base","siblings":"air-gapped (physical isolation) / logical segmentation / SDN; centralized vs decentralized; on-premises vs cloud","tell":"Tell: air-gapped = physically no network connection; logical segmentation = VLANs/subnets separate traffic on shared hardware; SDN = software-controlled network via control/data plane split; centralized = one control point; decentralized = distributed control."},{"key":"embedded-systems","domain":"D3 Security Architecture","tier":"base","siblings":"IoT / ICS / SCADA / RTOS / embedded systems","tell":"Tell: IoT = internet-connected consumer/smart devices; ICS = industrial control systems running physical processes; SCADA = the supervisory layer that monitors/controls ICS over wide areas; RTOS = OS with guaranteed timing for real-time tasks; embedded = special-purpose computer inside a larger device."},{"key":"arch-considerations","domain":"D3 Security Architecture","tier":"base","siblings":"availability / resilience / responsiveness / scalability / ease of deployment / ease of recovery / patch availability / inability to patch / risk transference / cost / power / compute","tell":"Tell: availability = uptime now; resilience = recover and keep serving under failure; scalability = grow to handle more load; responsiveness = latency of the response; risk transference = shift risk to a third party (insurance/vendor)."},{"key":"fail-modes","domain":"D3 Security Architecture","tier":"high","siblings":"fail-open vs fail-closed (network devices); fail-safe vs fail-secure (physical locks)","tell":"Tell: fail-open = on failure the network device PERMITS traffic (favors availability); fail-closed = on failure it BLOCKS traffic (favors security); fail-safe = on failure the door UNLOCKS to protect people (life safety); fail-secure = on failure the door STAYS LOCKED to protect assets. Network pair = open/closed; door-lock pair = safe/secure."},{"key":"active-passive","domain":"D3 Security Architecture","tier":"high","siblings":"active vs passive; inline vs tap/monitor","tell":"Tell: active device = sits in the traffic path and can block (inline, like IPS); passive device = only observes a copy and cannot block (tap/monitor, like IDS on a SPAN port); inline = traffic flows through it; tap/monitor = gets a mirrored copy."},{"key":"jump-proxy","domain":"D3 Security Architecture","tier":"high","siblings":"jump server vs proxy server","tell":"Tell: jump server = a hardened admin gateway host you connect THROUGH to manage internal systems; proxy server = an intermediary that forwards/filters client requests to services (often web). Jump = admin access pivot; proxy = request broker/filter."},{"key":"ips-ids","domain":"D3 Security Architecture","tier":"high","siblings":"IPS vs IDS","tell":"Tell: IDS = detects and alerts only, passive, out of band; IPS = detects AND blocks, active, inline. Same detection, different response and placement."},{"key":"firewalls","domain":"D3 Security Architecture","tier":"base","siblings":"WAF / UTM / NGFW / Layer 4 vs Layer 7","tell":"Tell: WAF = protects web apps from injection/XSS at Layer 7; UTM = all-in-one appliance (firewall + AV + IDS + filter); NGFW = firewall with app awareness, deep inspection, identity; Layer 4 = filters by port/IP; Layer 7 = filters by application content."},{"key":"port-auth","domain":"D3 Security Architecture","tier":"base","siblings":"802.1X / EAP","tell":"Tell: 802.1X = port-based network access control that requires authentication before the port opens; EAP = the authentication framework 802.1X carries (PEAP, EAP-TLS are EAP methods). 802.1X = the gate; EAP = the language spoken through it."},{"key":"secure-tunnels","domain":"D3 Security Architecture","tier":"high","siblings":"TLS vs IPSec tunneling; SD-WAN vs SASE; VPN","tell":"Tell: TLS VPN = tunnel at the transport/application layer, clientless-friendly, port 443; IPSec = tunnel at the network layer (AH/ESP), site-to-site; SD-WAN = software-defined WAN that optimizes links between sites; SASE = SD-WAN plus cloud-delivered security (ZTNA, SWG, CASB) as one service."},{"key":"data-classification","domain":"D3 Security Architecture","tier":"base","siblings":"data types (regulated / trade secret / intellectual property / legal / financial) and classifications (sensitive / confidential / public / restricted / private / critical)","tell":"Tell: regulated = governed by law/standard (PCI, HIPAA); trade secret = proprietary competitive info; intellectual property = patents/copyrights; public = no harm if released; confidential/restricted = harm if released; critical = essential to operations."},{"key":"data-states","domain":"D3 Security Architecture","tier":"base","siblings":"at rest / in transit / in use; data sovereignty / geolocation","tell":"Tell: at rest = stored (disk encryption); in transit = moving over a network (TLS); in use = actively processed in memory (hardest to protect); data sovereignty = data is subject to the laws of the country it physically sits in."},{"key":"data-protection","domain":"D3 Security Architecture","tier":"base","siblings":"encryption / hashing / masking / tokenization / obfuscation / segmentation / permission restrictions / geographic restrictions","tell":"Tell: encryption = reversible with a key (confidentiality); hashing = one-way (integrity); masking = show partial value; tokenization = swap for a vaulted token; geographic restrictions = allow/deny by location; permission restrictions = control by access rights."},{"key":"load-balancing","domain":"D3 Security Architecture","tier":"high","siblings":"load balancing vs clustering","tell":"Tell: load balancing = distribute incoming requests across multiple active servers for throughput; clustering = multiple nodes act as one system with failover so if one dies another takes over. Load balancer = spread traffic; cluster = high-availability failover group."},{"key":"sites","domain":"D3 Security Architecture","tier":"priority","siblings":"hot / warm / cold / geographic dispersion","tell":"Tell: hot site = fully equipped and running, near-instant failover (minutes); warm site = hardware and connectivity ready but data must be loaded (hours); cold site = just space and power, everything must be brought in (days/weeks); geographic dispersion = keep sites far enough apart that one disaster cannot hit both. Drill \"cold vs hot\" and \"warm vs cold\" hard."},{"key":"resilience-planning","domain":"D3 Security Architecture","tier":"base","siblings":"platform diversity / multi-cloud / continuity of operations (COOP) / capacity planning (people, technology, infrastructure)","tell":"Tell: platform diversity = use different vendors/OSes so one flaw does not sink all; multi-cloud = spread across cloud providers; COOP = plan to keep essential functions running; capacity planning = size people/tech/infra for demand."},{"key":"continuity-testing","domain":"D3 Security Architecture","tier":"high","siblings":"tabletop / failover / simulation / parallel processing","tell":"Tell: tabletop = discussion-based walkthrough, no systems touched; failover test = actually cut over to the backup system; simulation = act out a scenario with real steps but controlled; parallel processing = run the recovery site alongside production to compare without taking prod down."},{"key":"backups","domain":"D3 Security Architecture","tier":"priority","siblings":"snapshots / replication / journaling / frequency / onsite vs offsite / encryption / recovery","tell":"Tell: snapshot = point-in-time image of a system/volume you can roll back to; replication = continuously copy data to another location in near real time; journaling = log every change so you can replay transactions to a precise point; onsite = fast restore but shares the disaster; offsite = survives a site loss but slower. Drill \"snapshots vs journaling\" and \"replication vs snapshots\" hard."},{"key":"power","domain":"D3 Security Architecture","tier":"base","siblings":"generators vs UPS","tell":"Tell: UPS = battery for instant, short-term ride-through (seconds to minutes, no gap); generator = fuel-powered long-term supply that takes seconds to start. UPS bridges until the generator comes online."},{"key":"baselines","domain":"D4 Security Operations","tier":"base","siblings":"establish / deploy / maintain","tell":"Tell: establish = define the secure baseline config; deploy = push it to systems; maintain = keep it enforced and updated over time."},{"key":"wireless-install","domain":"D4 Security Operations","tier":"base","siblings":"site survey / heat map; WPA3 / RADIUS; cryptographic vs authentication protocols","tell":"Tell: site survey = walk the space to plan AP placement/coverage; heat map = visual signal-strength map output; WPA3 = the encryption standard; RADIUS = centralized AAA server for enterprise Wi-Fi auth."},{"key":"mobile-deployment","domain":"D4 Security Operations","tier":"high","siblings":"BYOD / COPE / CYOD; MDM","tell":"Tell: BYOD = employee-owned device (least company control); COPE = company-owned, personally enabled (company owns, personal use allowed); CYOD = choose from a company-approved list, company-owned; MDM = the tool that enforces policy on all of them."},{"key":"app-security","domain":"D4 Security Operations","tier":"base","siblings":"input validation / secure cookies / static code analysis / code signing / sandboxing / monitoring","tell":"Tell: input validation = reject bad input to stop injection; secure cookies = flags so cookies are not stolen/sent in clear; static analysis = review code without running it; code signing = sign the binary so users verify integrity/origin; sandboxing = run untrusted code in isolation."},{"key":"asset-management","domain":"D4 Security Operations","tier":"base","siblings":"inventory / enumeration; acquisition/procurement / assignment/accounting / ownership / classification","tell":"Tell: inventory = the list of assets you own; enumeration = actively discovering assets on the network; acquisition = procuring the asset; assignment = accounting for who owns/uses it."},{"key":"asset-disposal","domain":"D4 Security Operations","tier":"high","siblings":"sanitization / destruction / certification / data retention","tell":"Tell: sanitization = wipe data so the media can be reused; destruction = physically shred/degauss so media is gone; certification = documented proof the data was destroyed; data retention = how long you must keep data before disposal."},{"key":"analysis-types","domain":"D4 Security Operations","tier":"high","siblings":"static analysis vs dynamic analysis; package monitoring","tell":"Tell: static analysis = examine code/binary WITHOUT executing it; dynamic analysis = run it and watch behavior (sandbox, fuzzing); package monitoring = watch third-party dependencies for known vulns."},{"key":"threat-intel","domain":"D4 Security Operations","tier":"base","siblings":"OSINT / proprietary-third-party / information-sharing organization / dark web","tell":"Tell: OSINT = free public sources; proprietary/third-party = paid vendor feeds; information-sharing organization = ISAC/community sharing (industry peers); dark web = monitoring criminal marketplaces/forums."},{"key":"security-assessments","domain":"D4 Security Operations","tier":"base","siblings":"penetration testing / bug bounty (responsible disclosure) / system-process audit","tell":"Tell: penetration testing = authorized simulated attack by a team; bug bounty = pay external researchers per valid finding (responsible disclosure); system/process audit = check controls and procedures against requirements."},{"key":"false-pos-neg","domain":"D4 Security Operations","tier":"high","siblings":"false positive vs false negative","tell":"Tell: false positive = alert fired but nothing was actually wrong (wastes time); false negative = real threat that was NOT detected (dangerous miss). Positive = it alerted; negative = it stayed silent."},{"key":"cve-cvss","domain":"D4 Security Operations","tier":"priority","siblings":"CVE vs CVSS; exposure factor / environmental variables / risk tolerance / vulnerability classification","tell":"Tell: CVE = the unique ID/name for a specific known vulnerability (a catalog entry); CVSS = the 0-10 numeric SEVERITY score for a vulnerability; exposure factor = percent of an asset lost in an event; environmental variables = CVSS modifiers for YOUR specific environment; vulnerability classification = grouping by type/severity. Drill \"CVE (identifier) vs CVSS (score)\" hard."},{"key":"vuln-response","domain":"D4 Security Operations","tier":"base","siblings":"patching / insurance / segmentation / compensating controls / exceptions and exemptions; validation: rescanning / audit / verification","tell":"Tell: patching = fix the flaw; insurance = transfer the financial risk; compensating control = alternate protection when you cannot fix; exception/exemption = formally accept and document leaving it unfixed; rescanning = confirm the fix by scanning again."},{"key":"monitoring","domain":"D4 Security Operations","tier":"base","siblings":"log aggregation / alerting / archiving / scanning / reporting; quarantine / alert tuning","tell":"Tell: log aggregation = collect logs into one place; alerting = notify on conditions; archiving = retain logs long-term; quarantine = isolate a suspicious file/host; alert tuning = adjust rules to cut false positives."},{"key":"security-tools","domain":"D4 Security Operations","tier":"high","siblings":"SIEM / DLP / SNMP traps / NetFlow / vulnerability scanner / antivirus / SCAP / benchmarks / agents vs agentless","tell":"Tell: SIEM = correlate logs and alert across the enterprise; DLP = stop sensitive data from leaving; SNMP traps = device-initiated alerts to a manager; NetFlow = records of traffic flows (who talked to who, volume); vulnerability scanner = finds known weaknesses; SCAP = standard that lets tools automate/compare security config checks."},{"key":"firewall-config","domain":"D4 Security Operations","tier":"base","siblings":"firewall rules / access lists / ports and protocols / screened subnets; IDS-IPS trends and signatures","tell":"Tell: rule/ACL = permit or deny by source/dest/port; screened subnet = a buffer network between the internet and the internal LAN for public-facing servers; signature = match a known pattern; trend = detect deviation over time."},{"key":"web-filter","domain":"D4 Security Operations","tier":"base","siblings":"agent-based / centralized proxy / URL scanning / content categorization / block rules / reputation; DNS filtering","tell":"Tell: agent-based = client software enforces filtering anywhere; centralized proxy = all traffic routed through one filtering point; content categorization = block by category (gambling, adult); reputation = block by known-bad score; DNS filtering = block by refusing to resolve bad domains."},{"key":"os-hardening","domain":"D4 Security Operations","tier":"high","siblings":"Group Policy vs SELinux","tell":"Tell: Group Policy = Windows centralized config/enforcement via Active Directory (GPOs); SELinux = Linux mandatory access control that confines processes with security contexts. Group Policy = Windows domain config; SELinux = Linux MAC enforcement."},{"key":"email-security","domain":"D4 Security Operations","tier":"priority","siblings":"SPF / DKIM / DMARC / gateway","tell":"Tell: SPF = lists which mail servers are ALLOWED to send for the domain (checks the sending IP); DKIM = cryptographic SIGNATURE proving the message was not altered and came from the domain; DMARC = the POLICY built on SPF+DKIM that tells receivers what to do on failure (none/quarantine/reject) and where to send reports (alignment); secure email gateway = the appliance that filters inbound/outbound mail. Drill \"SPF vs DMARC\" and \"DKIM vs DMARC\" hard."},{"key":"endpoint-detection","domain":"D4 Security Operations","tier":"high","siblings":"file integrity monitoring (FIM) / DLP / NAC / EDR / XDR / UBA (user behavior analytics)","tell":"Tell: FIM = alert when critical files change; DLP = block sensitive data exfiltration; NAC = check device posture before allowing it on the network; EDR = detect/respond on endpoints; XDR = correlate detection across endpoints, network, cloud, email; UBA = flag abnormal user behavior."},{"key":"identity-lifecycle","domain":"D4 Security Operations","tier":"base","siblings":"provisioning / de-provisioning; identity proofing / attestation; federation / single sign-on (SSO)","tell":"Tell: provisioning = create the account/access; de-provisioning = remove access at offboarding; identity proofing = verify who a person is before issuing identity; attestation = periodic review confirming access is still appropriate; federation = trust identities across organizations; SSO = one login for many apps."},{"key":"federation-protocols","domain":"D4 Security Operations","tier":"high","siblings":"LDAP / OAuth / SAML","tell":"Tell: LDAP = directory query protocol to look up users/groups (on-prem AD); SAML = XML-based browser SSO for enterprise web apps (assertions between IdP and SP); OAuth = authorization/delegated access via tokens (let an app act on your behalf, often with OIDC for auth). SAML = enterprise web SSO; OAuth = API/app authorization; LDAP = directory lookup."},{"key":"access-control-models","domain":"D4 Security Operations","tier":"high","siblings":"mandatory access control / discretionary access control / role-based access control / rule-based access control / attribute-based access control; time-of-day restrictions / least privilege","tell":"Tell: mandatory access control = labels/clearances set by the system, users cannot change (military); discretionary access control = the data OWNER grants access; role-based access control = access by job role/group; rule-based access control = access by system-wide if/then rules (time, ACL condition); attribute-based access control = access by evaluated attributes (department + location + device)."},{"key":"mfa","domain":"D4 Security Operations","tier":"base","siblings":"factors - something you know / have / are / somewhere you are; biometrics / hard tokens / soft tokens / security keys","tell":"Tell: know = password/PIN; have = token/phone/security key; are = biometric (fingerprint); somewhere you are = geolocation; hard token = physical device generating codes; soft token = app-generated code; two of the SAME factor is not MFA."},{"key":"password-security","domain":"D4 Security Operations","tier":"base","siblings":"length / complexity / reuse / expiration / age; password managers / passwordless","tell":"Tell: length = number of characters (biggest strength driver); complexity = character variety; reuse = using the same password across accounts (bad); expiration = forced change interval; age = minimum time before you can change again; passwordless = authenticate without a password (biometric, key)."},{"key":"pam","domain":"D4 Security Operations","tier":"high","siblings":"just-in-time permissions / password vaulting / ephemeral credentials","tell":"Tell: just-in-time = grant elevated rights only for the moment needed then revoke; password vaulting = store/check-out privileged passwords from a secured vault; ephemeral credentials = short-lived credentials that self-expire after use."},{"key":"automation","domain":"D4 Security Operations","tier":"base","siblings":"user vs resource provisioning / guard rails / security groups / ticket creation / escalation / continuous integration / APIs; benefits vs complexity / cost / single point of failure / technical debt / supportability","tell":"Tell: guard rails = automated limits that keep actions within policy; ticket creation = auto-open a tracked work item; escalation = auto-route to a higher tier; single point of failure = the automation itself becoming a critical dependency."},{"key":"ir-process","domain":"D4 Security Operations","tier":"high","siblings":"preparation -> detection -> analysis -> containment -> eradication -> recovery -> lessons learned","tell":"Tell (ORDER matters): preparation = before anything (plans, tools); detection = notice the event; analysis = confirm and scope it; containment = stop the spread; eradication = remove the threat/artifacts; recovery = restore to normal operations; lessons learned = post-incident review to improve. Write \"what phase comes next / what phase is this\" questions."},{"key":"ir-testing","domain":"D4 Security Operations","tier":"base","siblings":"tabletop / simulation; root cause analysis / threat hunting","tell":"Tell: tabletop = talk through the plan; simulation = act it out; root cause analysis = find the underlying cause after an incident; threat hunting = proactively search for threats that evaded detection."},{"key":"forensics","domain":"D4 Security Operations","tier":"high","siblings":"legal hold / chain of custody / acquisition / preservation / reporting / e-discovery","tell":"Tell: legal hold = preserve data because litigation is anticipated; chain of custody = documented who handled evidence and when; acquisition = collect/image the evidence; preservation = protect it from alteration; e-discovery = locate and produce electronic evidence for legal process."},{"key":"log-sources","domain":"D4 Security Operations","tier":"base","siblings":"firewall / application / endpoint / OS-specific / IPS-IDS / network / metadata; vulnerability scans / automated reports / dashboards / packet captures","tell":"Tell: firewall log = allow/deny by connection; endpoint log = activity on a host; OS security log = auth/audit events; network log = flow/traffic; metadata = data about the data (headers, timestamps); packet capture = full raw traffic content."},{"key":"governance-hierarchy","domain":"D5 Program Management and Oversight","tier":"high","siblings":"guidelines / policies / standards / procedures","tell":"Tell: policy = high-level mandatory statement of intent (the \"what/why\"); standard = mandatory specific requirement that supports a policy (the \"how much\", e.g. AES-256); procedure = step-by-step instructions (the \"how\"); guideline = recommended, non-mandatory best practice."},{"key":"policies","domain":"D5 Program Management and Oversight","tier":"high","siblings":"AUP / information security / business continuity (BC) / disaster recovery (DR) / incident response / SDLC / change management","tell":"Tell: AUP = rules for acceptable use of systems; business continuity = keep the BUSINESS operating during disruption (broad, proactive); disaster recovery = restore IT SYSTEMS after a disaster (technical subset, reactive); incident response = handle security incidents; SDLC = secure software development process. Drill \"BC (keep business running) vs DR (restore IT)\" hard."},{"key":"standards-procedures","domain":"D5 Program Management and Oversight","tier":"base","siblings":"standards (password / access control / physical security / encryption); procedures (change management / onboarding-offboarding / playbooks)","tell":"Tell: standard = the required spec; playbook = the procedure for a specific scenario; onboarding = grant access for a new hire; offboarding = revoke access at exit."},{"key":"external-governance","domain":"D5 Program Management and Oversight","tier":"base","siblings":"regulatory / legal / industry / local-regional / national / global","tell":"Tell: regulatory = government rules with enforcement; legal = laws/contracts; industry = sector frameworks (PCI DSS); local/national/global = jurisdiction scope."},{"key":"data-roles","domain":"D5 Program Management and Oversight","tier":"high","siblings":"owner / controller / processor / custodian-steward","tell":"Tell: data owner = accountable senior person who sets classification and rules; data controller = decides WHY and HOW data is processed (GDPR); data processor = processes data ON BEHALF of the controller (a vendor); data custodian/steward = hands-on technical care and day-to-day protection. Drill \"controller (decides) vs processor (acts for controller)\" hard."},{"key":"risk-assessment-types","domain":"D5 Program Management and Oversight","tier":"base","siblings":"ad hoc / recurring / one-time / continuous","tell":"Tell: ad hoc = as-needed, triggered by an event; recurring = on a fixed schedule; one-time = single point assessment; continuous = ongoing automated monitoring."},{"key":"qual-quant","domain":"D5 Program Management and Oversight","tier":"high","siblings":"qualitative vs quantitative","tell":"Tell: qualitative = subjective ratings (high/medium/low, likelihood-impact matrix); quantitative = objective dollar figures and math (SLE, ALE, ARO). Qualitative = judgment/labels; quantitative = numbers/money."},{"key":"risk-math","domain":"D5 Program Management and Oversight","tier":"high","siblings":"SLE / ALE / ARO / exposure factor / asset value. Formulas: SLE = Asset Value x Exposure Factor; ALE = SLE x ARO; ARO = expected occurrences per year","tell":"Tell: SLE = loss from ONE event; ARO = how many times per year (once every 4 years = 0.25); ALE = expected yearly loss = SLE x ARO; exposure factor = percent of asset value lost per event. Include real numbers; use \"once every N years\" ARO traps (ARO = 1/N). Vary the numbers each question."},{"key":"probability-impact","domain":"D5 Program Management and Oversight","tier":"base","siblings":"probability / likelihood / exposure factor / impact","tell":"Tell: probability = statistical chance; likelihood = qualitative chance rating; impact = magnitude of harm if it happens; exposure factor = percent of asset lost."},{"key":"risk-register","domain":"D5 Program Management and Oversight","tier":"base","siblings":"key risk indicators (KRIs) / risk owners / risk threshold","tell":"Tell: KRI = a metric that warns risk is rising; risk owner = the person accountable for managing that risk; risk threshold = the level at which action is required."},{"key":"risk-appetite","domain":"D5 Program Management and Oversight","tier":"high","siblings":"risk tolerance / risk appetite (expansionary / conservative / neutral)","tell":"Tell: risk appetite = the broad amount of risk an org is WILLING to pursue for reward (expansionary = high appetite, conservative = low, neutral = balanced); risk tolerance = the acceptable VARIANCE around a specific risk before acting. Appetite = overall willingness; tolerance = how much deviation is acceptable."},{"key":"risk-strategies","domain":"D5 Program Management and Oversight","tier":"priority","siblings":"transfer / accept / avoid / mitigate; exemption vs exception","tell":"Tell: transfer = shift the risk to another party (insurance, outsource); accept = knowingly take no action and live with it; avoid = stop the activity entirely so the risk is gone; mitigate = reduce the risk with controls; exemption = pre-approved standing pass from a requirement; exception = a one-off approved deviation. Drill \"accept (live with it) vs transfer (insure/outsource) vs avoid (stop doing it)\" hard."},{"key":"bia","domain":"D5 Program Management and Oversight","tier":"high","siblings":"RTO / RPO / MTTR / MTBF","tell":"Tell: RTO = how fast you must RESTORE service (time target forward from outage); RPO = how much DATA loss is acceptable (time backward to last good backup); MTTR = mean time to repair (avg fix time); MTBF = mean time between failures (avg uptime between breakdowns). Drill \"RTO (restore time) vs RPO (data-loss point)\" hard."},{"key":"vendor-assessment","domain":"D5 Program Management and Oversight","tier":"base","siblings":"penetration testing / right-to-audit clause / evidence of internal audits / independent assessments / supply chain analysis; due diligence / conflict of interest","tell":"Tell: right-to-audit clause = contractual right to inspect the vendor; independent assessment = third-party review; supply chain analysis = evaluate the vendor's own suppliers; due diligence = investigate before signing."},{"key":"agreements","domain":"D5 Program Management and Oversight","tier":"priority","siblings":"SLA / MOA / MOU / MSA / WO-SOW / NDA / BPA","tell":"Tell: SLA = measurable service targets with penalties (numbers + penalties); MOU = non-binding statement of mutual intent; MOA = more formal agreement of roles/responsibilities (a step past MOU); MSA = master framework contract that individual SOWs hang off of; SOW/WO = the specific scope, deliverables, and timeline for one job; NDA = confidentiality only; BPA = terms of a business partnership. Drill \"MOU (intent) vs SLA (metrics+penalties)\" and \"MSA (master) vs SOW (specific job)\" hard."},{"key":"compliance","domain":"D5 Program Management and Oversight","tier":"base","siblings":"internal vs external reporting; consequences - fines / sanctions / reputational damage / loss of license / contractual impacts","tell":"Tell: internal reporting = to management/board; external reporting = to regulators/public; fines = monetary penalty; sanctions = restrictions/penalties imposed; loss of license = cannot operate; reputational damage = brand harm."},{"key":"due-diligence-care","domain":"D5 Program Management and Oversight","tier":"high","siblings":"due diligence vs due care; attestation and acknowledgement","tell":"Tell: due diligence = doing the investigation/homework BEFORE acting (vetting a vendor); due care = the ongoing reasonable actions to protect once engaged (maintaining controls). Diligence = investigate first; care = act responsibly ongoing. Attestation = formally affirm something is true."},{"key":"privacy","domain":"D5 Program Management and Oversight","tier":"base","siblings":"data subject / controller vs processor / ownership / data inventory and retention / right to be forgotten","tell":"Tell: data subject = the person the data is about; right to be forgotten = the subject's right to have their data erased; data inventory = knowing what personal data you hold; retention = how long you keep it."},{"key":"audits","domain":"D5 Program Management and Oversight","tier":"base","siblings":"attestation; internal (compliance / audit committee / self-assessment) vs external (regulatory / examinations / assessment / independent third-party)","tell":"Tell: internal audit = your own staff/committee reviews; self-assessment = the team rates itself; external audit = an outside party reviews; independent third-party = unaffiliated auditor for objectivity; attestation = a formal signed statement of compliance."},{"key":"pentest-types","domain":"D5 Program Management and Oversight","tier":"high","siblings":"known / partially known / unknown environment; physical / offensive / defensive / integrated; passive vs active reconnaissance","tell":"Tell: known environment = tester has full info; partially known = some info; unknown environment = tester has no inside info; passive recon = gather info WITHOUT touching the target (OSINT, public records); active recon = directly probe/scan the target (which can be detected). Use the 701 wording, never the retired color terms."},{"key":"awareness","domain":"D5 Program Management and Oversight","tier":"base","siblings":"phishing campaigns / recognizing / responding; anomalous behavior (risky / unexpected / unintentional); reporting (initial / recurring)","tell":"Tell: phishing campaign = simulated phishing to train users; risky behavior = knowingly dangerous; unexpected behavior = out of the norm; unintentional = accidental; initial reporting = first-time baseline; recurring reporting = ongoing cadence."}]}</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var ALL = DATA.questions;
  var REF = DATA.reference || [];
  var LETTERS = ["A","B","C","D"];
  var STORE_KEY = "secplus-drill-stats-v1";
  var DRILL_LEN = 25;
  var EXAM_QUOTA = {D1:11, D2:20, D3:16, D4:25, D5:18}; // official weights of 90
  var EXAM_MS = 90*60*1000;
  var PASS_SCALED = 750;

  // ---------- stats (v2 with v1 migration) ----------
  function loadStats(){
    var s;
    try{ s = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ s=null; }
    if(!s) s = {v:2, seq:0, perQuestion:{}, perFamily:{}, exams:[]};
    if(!s.v){ // migrate v1 {perQuestion:{id:{attempts,correct}}, perFamily}
      var pq={}, k;
      for(k in s.perQuestion||{}){ var o=s.perQuestion[k]; pq[k]={a:o.attempts||0,c:o.correct||0,s:0,last:0}; }
      var pf={};
      for(k in s.perFamily||{}){ var f=s.perFamily[k]; pf[k]={a:f.attempts||0,c:f.correct||0}; }
      s = {v:2, seq:0, perQuestion:pq, perFamily:pf, exams:[]};
    }
    s.exams = s.exams||[];
    return s;
  }
  function saveStats(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
  function getPref(){ var s=loadStats(); return (s.pref&&s.pref.feedback)||"instant"; }
  function setPref(v){ var s=loadStats(); s.pref=s.pref||{}; s.pref.feedback=v; saveStats(s); }
  function recordStat(q, correct){
    var s = loadStats();
    s.seq = (s.seq||0)+1;
    var pq = s.perQuestion[q.id] || {a:0,c:0,s:0,last:0};
    pq.a++; if(correct){ pq.c++; pq.s=(pq.s||0)+1; } else { pq.s=0; }
    pq.last=s.seq; s.perQuestion[q.id]=pq;
    var pf = s.perFamily[q.family] || {a:0,c:0};
    pf.a++; if(correct) pf.c++; s.perFamily[q.family]=pf;
    saveStats(s);
  }

  // ---------- adaptive selection ----------
  // Weight = how much this question deserves to be served next.
  // missed last time > never seen > shaky > solid > mastered; boosted for weak families,
  // damped if seen very recently.
  function weightFor(q, stats){
    var pq = stats.perQuestion[q.id];
    var w;
    if(!pq || pq.a===0) w=3;        // unseen
    else if(pq.s===0)   w=4;        // missed most recently
    else if(pq.s===1)   w=2;        // answered right once since last miss
    else if(pq.s===2)   w=1;        // getting solid
    else                w=0.4;      // mastered: keep a small maintenance chance
    var pf = stats.perFamily[q.family];
    if(pf && pf.a>=2){
      var acc = pf.c/pf.a;
      if(acc<0.5) w*=2; else if(acc<0.8) w*=1.4;
    }
    if(pq && (stats.seq - pq.last) < 40) w*=0.5;  // just saw it; back off
    return w;
  }
  // Weighted sample without replacement. familyDamp<1 spreads picks across families
  // so one family cannot hog the quota (thoroughness).
  function adaptivePick(pool, n, familyDamp){
    var stats = loadStats();
    var items = pool.slice(), picked=[], mult={};
    while(picked.length<n && items.length){
      var total=0, ws=new Array(items.length), i;
      for(i=0;i<items.length;i++){
        var w = weightFor(items[i], stats) * (mult[items[i].family]||1);
        ws[i]=w; total+=w;
      }
      var r=Math.random()*total, idx=items.length-1;
      for(i=0;i<items.length;i++){ r-=ws[i]; if(r<=0){ idx=i; break; } }
      var q=items.splice(idx,1)[0];
      picked.push(q);
      if(familyDamp) mult[q.family]=(mult[q.family]||1)*familyDamp;
    }
    return picked;
  }
  function buildExamSet(){
    var byDom={D1:[],D2:[],D3:[],D4:[],D5:[]};
    ALL.forEach(function(q){ if(byDom[q.domain]) byDom[q.domain].push(q); });
    var set=[];
    for(var d in EXAM_QUOTA) set=set.concat(adaptivePick(byDom[d], EXAM_QUOTA[d], 0.6));
    return shuffle(set);
  }

  function shuffle(a){
    a=a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  // deferred variant: select an answer, no verdict until the round is done
  function renderDeferredQ(){
    header(session.label, session.pos+"/"+session.items.length+" answered", session.pos/session.items.length);

    h+='</div><div class="actions"><button class="primary" id="dnext"'+(it.chosen>=0?'':' disabled style="opacity:.5"')+'>'+(session.pos+1>=session.items.length?"Finish round":"Next")+'</button></div></div>';

        for(var k=0;k<bs.length;k++) bs[k].classList.toggle("selected", parseInt(bs[k].getAttribute("data-i"),10)===it.chosen);
        var nx=document.getElementById("dnext");
        nx.removeAttribute("disabled"); nx.style.opacity="";
      });
    }
    document.getElementById("dnext").addEventListener("click", function(){
      if(it.chosen<0) return;
      session.pos++; renderDeferredQ();
    });
    window.scrollTo(0,0);
  }
  function finishDeferred(){
    session.items.forEach(function(it){
      it.answered=true; it.correct=(it.chosen===it.correctDisplay);
      session.answeredCount++;
      if(it.correct) session.correctCount++; else session.missed.push(it.q.id);
      recordStat(it.q, it.correct);
    });
    renderDrillEnd();
  }
  function drillHeader(){
    var t=session.items.length, a=session.answeredCount;
    var pct=a?Math.round(session.correctCount/a*100):0;
    header(session.correctCount+"/"+a+" \u00b7 "+t+" total", pct+"%", session.pos/t);
  }
  function renderDrill(){
    drillHeader();
    if(session.pos>=session.items.length) return renderDrillEnd();
    var it=session.items[session.pos], q=it.q;
    var app=document.getElementById("app");
    var h='<div class="card">';
    h+='<div class="meta"><span>'+q.domain+' \u00b7 '+familyLabel(q.family)+'</span><span>Q'+(session.pos+1)+' of '+session.items.length+'</span></div>';
    h+='<p class="q"></p><div class="opts">';

    h+='</div><div id="feedback"></div></div>';
    app.innerHTML=h;
    app.querySelector(".q").textContent=q.question;
    var btns=app.querySelectorAll(".opt");
    for(var j=0;j<4;j++){ btns[j].querySelector(".t").textContent=it.opts[j]; btns[j].addEventListener("click", onDrillAnswer); }
    window.scrollTo(0,0);
  }
  function onDrillAnswer(e){
    var it=session.items[session.pos];
    if(it.answered) return;
    var chosen=parseInt(e.currentTarget.getAttribute("data-i"),10);
    it.answered=true; it.correct=(chosen===it.correctDisplay);
    session.answeredCount++;
    if(it.correct) session.correctCount++; else session.missed.push(it.q.id);
    recordStat(it.q, it.correct);
    var btns=document.querySelectorAll(".opt");
    for(var i=0;i<btns.length;i++){
      var bi=parseInt(btns[i].getAttribute("data-i"),10);
      btns[i].setAttribute("disabled","");
      if(bi===it.correctDisplay) btns[i].classList.add("correct");
      else if(bi===chosen) btns[i].classList.add("wrong");
      else btns[i].classList.add("dim");
    }
    var fb=document.getElementById("feedback");
    fb.appendChild(explBlock(it.q, it.correct));
    var act=document.createElement("div"); act.className="actions";
    var next=document.createElement("button"); next.className="primary";
    next.textContent=(session.pos+1>=session.items.length)?"See results":"Next";
    next.addEventListener("click", function(){ session.pos++; renderDrill(); });
    act.appendChild(next); fb.appendChild(act);
    drillHeader(); next.focus();
  }
  function explBlock(q, wasCorrect){
    var expl=q.explanation, ti=expl.indexOf("The tell:");
    var main=ti>=0?expl.slice(0,ti).trim():expl, tell=ti>=0?expl.slice(ti):"";
    var wrap=document.createElement("div");
    wrap.className="expl "+(wasCorrect===null?"":(wasCorrect?"correct":"wrong"));
    if(wasCorrect!==null){ var v=document.createElement("div"); v.className="verdict"; v.textContent=wasCorrect?"Correct":"Wrong"; wrap.appendChild(v); }
    var m=document.createElement("div"); m.textContent=main; wrap.appendChild(m);
    if(tell){ var t=document.createElement("span"); t.className="tell"; t.textContent=tell; wrap.appendChild(t); }
    return wrap;
  }
  function renderDrillEnd(){
    var app=document.getElementById("app");
    var total=session.items.length, correct=session.correctCount;
    var pct=total?Math.round(correct/total*100):0;
    var byFam={};
    session.items.forEach(function(it){
      var k=it.q.family; byFam[k]=byFam[k]||{n:0,c:0}; byFam[k].n++; if(it.correct) byFam[k].c++;
    });
    var rows=Object.keys(byFam).map(function(k){ var o=byFam[k]; return {key:k,n:o.n,c:o.c,acc:o.c/o.n}; })
      .sort(function(a,b){ return a.acc-b.acc||b.n-a.n; });
    var h='<div class="card">';
    h+='<h1 class="big">'+session.label+' complete</h1>';
    h+='<div class="bignum">'+correct+' / '+total+'</div>';
    h+='<div class="sub">'+pct+'% correct \u00b7 '+session.missed.length+' to review</div>';
    h+='<div class="actions">';
    h+='<button class="primary" id="again">New smart drill</button>';
    h+='<button class="ghost" id="retry"'+(session.missed.length?'':' disabled style="opacity:.5"')+'>Retry missed ('+session.missed.length+')</button>';
    h+='</div>';
    if(session.deferred){
      h+='<div class="actions"><button class="ghost" id="rvwalldrill">Review all ('+total+')</button>';
      h+='<button class="ghost" id="rvwdrill"'+(session.missed.length?'':' disabled style="opacity:.5"')+'>Review missed ('+session.missed.length+')</button></div>';
    }
    h+='<h1 style="font-size:16px;margin-top:22px">Weakest families first</h1>';
    h+='<table><thead><tr><th>Family</th><th class="num">Score</th><th class="num">Acc</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var color=r.acc>=0.8?'var(--correct)':(r.acc>=0.5?'var(--amber)':'var(--wrong)');
      h+='<tr><td>'+familyLabel(r.key)+'<div class="accbar"><div style="width:'+Math.round(r.acc*100)+'%;background:'+color+'"></div></div></td>';
      h+='<td class="num">'+r.c+'/'+r.n+'</td><td class="num" style="color:'+color+'">'+Math.round(r.acc*100)+'%</td></tr>';
    });
    h+='</tbody></table></div>';
    app.innerHTML=h;
    elBar.style.width="100%";
    document.getElementById("again").addEventListener("click", function(){ startDrill(adaptivePick(ALL, DRILL_LEN, 0.75), "Smart drill"); });
    if(session.missed.length){
      var ids={}; session.missed.forEach(function(id){ ids[id]=1; });
      document.getElementById("retry").addEventListener("click", function(){
        startDrill(shuffle(ALL.filter(function(q){ return ids[q.id]; })), "Missed review");
      });
      if(session.deferred){
        var missedItems=session.items.filter(function(it){ return !it.correct; });
        document.getElementById("rvwdrill").addEventListener("click", function(){
          renderReviewList(missedItems, 0, renderDrillEnd);
        });

    }
    if(session.deferred){
      document.getElementById("rvwalldrill").addEventListener("click", function(){
        renderReviewList(session.items, 0, renderDrillEnd);
      });
    }
    window.scrollTo(0,0);
  }

  function lockInstantExamAnswer(){
    var it=exam.items[exam.idx];

    var ok = it.chosen===it.correctDisplay;
    var btns=document.querySelectorAll(".opt");
