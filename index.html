that gives it a market edge, keeping it internal and unpatented so rivals cannot copy it. How is this information best classified?","options":["financial","intellectual property","trade secret","regulated"],"correctIndex":2,"explanation":"Trade secret. A guarded, unpatented formula that provides competitive advantage is a trade secret. The tell: trade secret = secret competitive know-how, intellectual property = patents and copyrights, financial = monetary records, regulated = governed by external law."},{"id":"q240","domain":"D3","family":"data-classification","question":"Which classification applies to information whose release would cause no harm and therefore needs no special protection, such as a published marketing brochure?","options":["confidential","public","restricted","critical"],"correctIndex":1,"explanation":"Public. Data whose disclosure causes no harm and needs no protection is classified public. The tell: public = no harm if disclosed, confidential = harm if disclosed, restricted = tightly limited highly sensitive, critical = essential to operations."},{"id":"q241","domain":"D3","family":"data-classification","question":"A software company holds patents and copyrighted source code that legally protect the creations of its developers. Which data type best describes these assets?","options":["regulated","intellectual property","trade secret","financial"],"correctIndex":1,"explanation":"Intellectual property. Patents and copyrights are legally protected creations of the mind, the definition of intellectual property. The tell: intellectual property = patents and copyrights; trade secret = secret unpatented competitive know-how; regulated = governed by external law or standard; financial = monetary and accounting records."},{"id":"q242","domain":"D3","family":"data-classification","question":"Which classification applies to data so essential that its loss would halt the organization's core business functions?","options":["confidential","public","critical","restricted"],"correctIndex":2,"explanation":"Critical. Critical data is essential to operations, and losing it stops core business functions. The tell: critical = essential to operations; confidential = harm if disclosed; restricted = tightly limited, highly sensitive; public = no harm if released."},{"id":"q243","domain":"D3","family":"data-states","question":"An analytics engine loads customer records into server memory and actively computes on them; encryption at this stage is the hardest to apply. Which data state is this?","options":["at rest","in transit","in use","data sovereignty"],"correctIndex":2,"explanation":"In use. Data being actively processed in memory or by an application is data in use, the hardest state to protect. The tell: in use = actively processed in memory, at rest = stored on disk, in transit = moving across a network, data sovereignty = subject to the laws of its physical location."},{"id":"q244","domain":"D3","family":"data-states","question":"Which concept means that data is subject to the laws and regulations of the country in which it is physically stored?","options":["in transit","geolocation","data sovereignty","at rest"],"correctIndex":2,"explanation":"Data sovereignty. Data is bound by the laws of the country where it physically resides. The tell: data sovereignty = governed by the laws where it resides, geolocation = the physical location itself, at rest = stored data, in transit = data moving over a network."},{"id":"q245","domain":"D3","family":"data-states","question":"Customer records travel across the internet from a branch office to headquarters, protected by TLS while on the wire. Which data state is this?","options":["at rest","in transit","in use","data sovereignty"],"correctIndex":1,"explanation":"In transit. Data moving over a network, secured with TLS, is data in transit. The tell: in transit = moving over a network (TLS); at rest = stored on disk; in use = actively processed in memory; data sovereignty = data governed by the laws of the country it sits in."},{"id":"q246","domain":"D3","family":"data-states","question":"Files sit encrypted on a server's hard drive, neither being accessed nor transmitted at the moment. Which data state describes them?","options":["at rest","in transit","in use","geolocation"],"correctIndex":0,"explanation":"At rest. Stored data that is not moving or being processed is data at rest, typically protected with disk encryption. The tell: at rest = stored on disk; in transit = moving over a network; in use = actively processed in memory; geolocation = the physical location of the data or device."},{"id":"q247","domain":"D3","family":"data-protection","question":"A hospital's billing system replaces each patient's national ID with a substitute value; the real ID can be recovered only by querying a separate secure vault. Which data protection method is this?","options":["encryption","tokenization","masking","hashing"],"correctIndex":1,"explanation":"Tokenization. Swapping the real identifier for a substitute that maps back only through a secure vault is tokenization. The tell: tokenization = swap for a vaulted token, encryption = reversible with a key, masking = show only part of the value, hashing = one-way fingerprint that never maps back."},{"id":"q248","domain":"D3","family":"data-protection","question":"A support screen shows a card number as XXXX-XXXX-XXXX-1234, hiding all but the last four digits so agents cannot see the full value. Which data protection technique is shown?","options":["masking","tokenization","obfuscation","encryption"],"correctIndex":0,"explanation":"Masking. Displaying only part of a value while hiding the rest is data masking. The tell: masking = display a partial or scrambled value, tokenization = substitute a vaulted token, obfuscation = make data generally unclear, encryption = reversible with a key."},{"id":"q249","domain":"D3","family":"data-protection","question":"A streaming service refuses to serve certain content to IP addresses outside licensed countries, allowing or denying access based on where the user is located. Which data protection method is this?","options":["permission restrictions","geographic restrictions","masking","tokenization"],"correctIndex":1,"explanation":"Geographic restrictions. Access is allowed or denied by location, which is a geographic restriction. The tell: geographic restrictions = allow or deny by location; permission restrictions = control by access rights and roles; masking = show a partial value; tokenization = swap a value for a vaulted token."},{"id":"q250","domain":"D3","family":"data-protection","question":"To let users verify a downloaded file was not altered, a site publishes a one-way fingerprint of the file that cannot be reversed to reveal the original. Which data protection method is this?","options":["hashing","encryption","masking","tokenization"],"correctIndex":0,"explanation":"Hashing. A one-way fingerprint used to confirm data has not changed is a hash. The tell: hashing = one-way, for integrity, not reversible; encryption = reversible with a key, for confidentiality; masking = shows a partial value; tokenization = swaps a value for a vaulted token."},{"id":"q251","domain":"D3","family":"load-balancing","question":"A device sits in front of a pool of identical web servers and distributes each incoming user request among them to raise throughput and avoid overloading any one server. Which technique is the device performing?","options":["clustering","load balancing","active-passive configuration","active-active configuration"],"correctIndex":1,"explanation":"Load balancing. Distributing incoming requests across multiple servers is load balancing; it is the act of spreading the traffic, performed by the device in front. The tell: load balancing = the technique of distributing requests across servers; active-active configuration = both nodes of a redundant pair actively serving at once; active-passive configuration = one node serves while the standby waits; clustering = nodes grouped as one system for failover."},{"id":"q252","domain":"D3","family":"load-balancing","question":"Several database nodes are grouped so they present as a single system; if one node dies, another immediately assumes its role with no loss of service. Which technique is this?","options":["load balancing","active-active configuration","active-passive configuration","clustering"],"correctIndex":3,"explanation":"Clustering. Multiple nodes acting as one system so another takes over on failure is clustering. The tell: clustering = high-availability failover group, load balancing = distribute requests for throughput, active-active = all members handle load simultaneously, active-passive = a standby waits idle until failover."},{"id":"q253","domain":"D3","family":"load-balancing","question":"In a high-availability pair, one node handles all traffic while an identical second node sits idle on standby and takes over only if the first fails. Which configuration is this?","options":["active-active configuration","active-passive configuration","load balancing","clustering"],"correctIndex":1,"explanation":"Active-passive configuration. One node is live while its twin waits idle to assume the load on failure. The tell: active-passive = standby node idle until failover, active-active = both nodes share load at once, load balancing = spread requests across active servers, clustering = grouped nodes acting as one system."},{"id":"q254","domain":"D3","family":"load-balancing","question":"Two identical servers both process incoming traffic at the same time, sharing the workload, and if one fails the other absorbs all of it. Which configuration is this?","options":["active-passive configuration","active-active configuration","clustering","load balancing"],"correctIndex":1,"explanation":"Active-active configuration. Both nodes serve traffic simultaneously and share the load. The tell: active-active = all members handle load at once; active-passive = one node serves while a standby waits idle; clustering = grouped nodes acting as one system for failover; load balancing = distributing requests across active servers."},{"id":"q255","domain":"D3","family":"load-balancing","question":"A high-availability pair is labeled active-passive. How does the second node behave?","options":["It distributes incoming requests across a server pool.","It groups with the first node to act as one system.","It shares the live traffic load with the first node.","It sits idle on standby and takes over only if the first node fails."],"correctIndex":3,"explanation":"Active-passive configuration. In active-passive, the standby node stays idle until it must assume the load on failure. The tell: active-passive = standby idle until failover; active-active = both nodes share load at once; load balancing = spreading requests across active servers; clustering = grouped nodes presenting as one system."},{"id":"q256","domain":"D3","family":"load-balancing","question":"Which technique groups multiple nodes so they act as a single system whose purpose is failover and high availability, rather than merely spreading requests for throughput?","options":["load balancing","clustering","active-active configuration","active-passive configuration"],"correctIndex":1,"explanation":"Clustering. Clustering makes several nodes behave as one highly available system so another takes over on failure. The tell: clustering = grouped nodes as one system for failover; load balancing = spreading requests across servers for throughput; active-active = both nodes serving at once; active-passive = a standby waiting idle until failover."},{"id":"q257","domain":"D3","family":"sites","question":"An online retailer must resume order processing within 15 minutes of any data center failure. It keeps a second facility with live, fully configured servers and continuously synchronized data ready for immediate cutover. Which recovery site is this?","options":["hot site","warm site","cold site","geographic dispersion"],"correctIndex":0,"explanation":"Hot site. A fully equipped, running facility with continuously synchronized data enables near-instant failover in minutes. The tell: hot site = fully running, failover in minutes, warm site = hardware ready but data must be loaded, cold site = only space and power taking days, geographic dispersion = sites spread apart to survive one disaster."},{"id":"q258","domain":"D3","family":"sites","question":"A nonprofit wants the cheapest disaster recovery option and can tolerate being down for a couple of weeks. It leases an empty facility with power, cooling, and floor space but no hardware or data. Which site type is this?","options":["hot site","warm site","geographic dispersion","cold site"],"correctIndex":3,"explanation":"Cold site. An empty facility with only power, cooling, and space, where everything must be brought in, is cheapest with recovery in days to weeks. The tell: cold site = bare space and power, days to weeks, warm site = hardware ready but data must be loaded, hot site = fully running, minutes, geographic dispersion = facilities spread apart."},{"id":"q259","domain":"D3","family":"sites","question":"A company keeps a recovery facility stocked with servers, network gear, and connectivity, but backups must be restored before operations can resume, giving a recovery time of several hours. Which site type is this?","options":["hot site","warm site","cold site","geographic dispersion"],"correctIndex":1,"explanation":"Warm site. Hardware and connectivity are in place but backups must be restored first, giving recovery in hours. The tell: warm site = ready hardware, load data, hours, hot site = live and synchronized, minutes, cold site = empty space, days to weeks, geographic dispersion = sites kept far apart."},{"id":"q260","domain":"D3","family":"sites","question":"Which recovery concept means placing backup facilities far enough apart that a single regional disaster, such as a hurricane, cannot take out both at once?","options":["hot site","warm site","geographic dispersion","cold site"],"correctIndex":2,"explanation":"Geographic dispersion. Placing recovery facilities far enough apart that one regional disaster cannot destroy both is geographic dispersion. The tell: geographic dispersion = distance so one event cannot hit both, hot site = live failover in minutes, warm site = hardware ready, load data, cold site = bare space, days to weeks."},{"id":"q261","domain":"D3","family":"sites","question":"Two firms compare recovery plans. Firm A has racks, connectivity, and hardware waiting but no live data loaded; Firm B has only a powered empty shell. Firm A's facility is which type?","options":["cold site","hot site","geographic dispersion","warm site"],"correctIndex":3,"explanation":"Warm site. Racks, connectivity, and hardware waiting but no live data describe a warm site. The tell: warm site = hardware ready, data must be loaded, cold site = only a powered empty shell, hot site = fully live, minutes, geographic dispersion = facilities separated by distance."},{"id":"q262","domain":"D3","family":"sites","question":"You are told a facility is a hot site. Which statement best describes its state?","options":["Fully equipped and running with synchronized data, failover in minutes","Hardware and connectivity ready but data must be restored first, recovery in hours","Only powered floor space, everything must be brought in, recovery in days to weeks","Backup facilities spread far apart to survive a regional disaster"],"correctIndex":0,"explanation":"Hot site. It is fully equipped and running with synchronized data, allowing failover within minutes. The tell: hot site = live and synchronized in minutes, warm site = hardware ready but data loaded over hours, cold site = empty powered space taking days, geographic dispersion = facilities spread apart."},{"id":"q263","domain":"D3","family":"sites","question":"A trading firm can tolerate almost no data loss, so it pays a premium for a standby facility whose systems stay powered on and running with data kept continuously current with production. Which site did it choose?","options":["cold site","warm site","hot site","geographic dispersion"],"correctIndex":2,"explanation":"Hot site. A powered-on, running duplicate with continuously current data is the costliest option and loses almost no data at failover. The tell: hot site = costliest, running with current data, minutes, warm site = mid-cost, data must be restored, hours, cold site = cheapest, bare space, days to weeks, geographic dispersion = separation for disaster survival."},{"id":"q264","domain":"D3","family":"sites","question":"A regional insurer rejects a continuously synchronized recovery facility as too expensive but cannot accept waiting weeks to buy and install equipment after a disaster. It picks the middle option on both cost and recovery time. Which site type is this?","options":["cold site","warm site","hot site","geographic dispersion"],"correctIndex":1,"explanation":"Warm site. It is the middle ground: equipment and connectivity are already in place, but data must still be restored, so it costs less than a hot site and recovers far faster than a cold site. The tell: warm site = mid-cost, hardware ready, restore data, hours, hot site = costliest, live and synchronized, minutes, cold site = cheapest, buy and install everything, days to weeks, geographic dispersion = distance between facilities."},{"id":"q265","domain":"D3","family":"sites","question":"After declaring a disaster, a company arrives at its alternate facility and must first purchase and install servers and network gear, then restore all data from offsite media, before any operations can resume. Which site type does it operate?","options":["hot site","warm site","geographic dispersion","cold site"],"correctIndex":3,"explanation":"Cold site. Only space and power were provided, so all equipment and data must be brought in after the disaster, putting recovery at days to weeks. The tell: cold site = bring everything in, days to weeks, warm site = equipment already installed, only data to restore, hours, hot site = already running and synchronized, minutes, geographic dispersion = sites separated so one disaster cannot hit both."},{"id":"q266","domain":"D3","family":"sites","question":"A cloud architect places the primary and replica data centers in different regions hundreds of miles apart specifically so a single earthquake or flood cannot destroy both. Which principle is being applied?","options":["geographic dispersion","hot site","warm site","cold site"],"correctIndex":0,"explanation":"Geographic dispersion. Separating primary and replica sites by hundreds of miles so one disaster cannot destroy both is geographic dispersion. The tell: geographic dispersion = distance so a single disaster cannot hit both, hot site = live failover in minutes, warm site = hardware ready, load data, cold site = bare space, days to weeks."},{"id":"q267","domain":"D3","family":"sites","question":"Which recovery site provides only conditioned space, electrical power, and cooling, with no servers, network equipment, or data on hand, so bringing operations online after a disaster takes days to weeks?","options":["hot","warm","cold","geographic dispersion"],"correctIndex":2,"explanation":"Cold site. It is bare powered space with no hardware or data, so recovery runs days to weeks. The tell: cold = space and power only, days to weeks; warm = hardware and links ready but data must be loaded, hours to days; hot = fully running and synchronized, minutes to hours; geographic dispersion = spacing sites far apart, not a facility readiness level."},{"id":"q268","domain":"D3","family":"sites","question":"A vendor offers your company a cold site for disaster recovery. Which expectation should you set with management about it?","options":["It is bare space with power and cooling; you must bring in and configure all hardware and data, so recovery takes days to weeks.","It has racked hardware and connectivity but data must be restored, giving recovery in hours to days.","It runs live duplicate systems with current data for failover in minutes to hours.","It is a principle of placing sites far apart, not an actual recovery facility."],"correctIndex":0,"explanation":"Cold site. A cold site is only conditioned space and power, so you procure and load everything after declaring a disaster. The tell: cold = space and power only, days to weeks; warm = equipped but needs data restore, hours to days; hot = live and synchronized, minutes to hours; geographic dispersion = distance between sites, not a readiness tier."},{"id":"q269","domain":"D3","family":"sites","question":"Two recovery options are compared. Option A has racks, connectivity, and hardware waiting but no current data. Option B is nothing but powered, cooled floor space with everything still to be procured. Option B is which site type?","options":["warm","hot","geographic dispersion","cold"],"correctIndex":3,"explanation":"Cold site. Option B is bare powered space with no equipment, the definition of a cold site, recovering in days to weeks. The tell: cold = empty powered space, days to weeks; warm (Option A) = hardware and links ready, data must load, hours to days; hot = live synchronized systems, minutes to hours; geographic dispersion = how far apart sites sit, not a facility type."},{"id":"q270","domain":"D3","family":"sites","question":"You are told your organization has contracted a warm site. What should you expect to find when you activate it after an outage?","options":["Fully running duplicate systems with continuously current data, ready in minutes to hours.","Racked servers and network connectivity already in place, but recent data must be restored first, taking hours to days.","Only conditioned space with power and cooling, requiring days to weeks to equip.","Two facilities placed far apart so a single disaster cannot strike both."],"correctIndex":1,"explanation":"Warm site. A warm site has hardware and connectivity staged, but you must load current data before resuming, so recovery spans hours to days. The tell: warm = equipped but needs data restore, hours to days; hot = live and synchronized, minutes to hours; cold = space and power only, days to weeks; geographic dispersion = spacing of sites, not their readiness."},{"id":"q271","domain":"D3","family":"sites","question":"A firm's recovery facility keeps servers racked and network links live, but the latest data must be loaded from backups before it can operate, meaning several hours of recent work could be lost on failover. Which site type is this?","options":["hot","cold","warm","geographic dispersion"],"correctIndex":2,"explanation":"Warm site. Equipment is ready but data is not current until restored, so some recent work is lost and recovery takes hours to days. The tell: warm = hardware ready, data must load, hours to days; hot = data continuously synchronized, minimal loss, minutes to hours; cold = no equipment or data, days to weeks; geographic dispersion = distance between sites."},{"id":"q272","domain":"D3","family":"sites","question":"A manufacturer wants to be back online within about a day after a disaster without paying for a continuously running duplicate. It leases a facility already stocked with servers and connectivity, planning to restore data after declaring the event. Which site type fits?","options":["warm","hot","cold","geographic dispersion"],"correctIndex":0,"explanation":"Warm site. Pre-staged hardware plus a data restore lands recovery in hours to days at a moderate cost, the warm-site middle ground. The tell: warm = equipped, restore data, hours to days; hot = live synchronized failover, minutes to hours, highest cost; cold = bare space, days to weeks, cheapest; geographic dispersion = placing sites far apart."},{"id":"q273","domain":"D3","family":"sites","question":"A hospital cannot lose access to its electronic records for more than a few minutes. Of the recovery site options, which provides near-immediate failover because it is already powered on and running with current data?","options":["warm","cold","geographic dispersion","hot"],"correctIndex":3,"explanation":"Hot site. Only a hot site runs live with synchronized data for cutover in minutes to hours. The tell: hot = live and current, minutes to hours; warm = equipped but data must load, hours to days; cold = bare space, days to weeks; geographic dispersion = spacing of sites, not a recovery speed."},{"id":"q274","domain":"D3","family":"sites","question":"A cloud service keeps a standby facility whose systems are always powered on while production continuously copies data to it, so a failover loses only seconds of work and completes within minutes. Which site type is this?","options":["cold","hot","warm","geographic dispersion"],"correctIndex":1,"explanation":"Hot site. Continuously current data plus live systems is the hallmark of a hot site, giving near-zero loss and minutes-to-hours recovery. The tell: hot = live, continuously synchronized, minutes to hours; warm = equipped but data restored after the fact, hours to days; cold = space and power only, days to weeks; geographic dispersion = distance between facilities."},{"id":"q275","domain":"D3","family":"sites","question":"Which recovery concept is not about how equipped a facility is, but about placing facilities far enough apart that one regional event cannot disable them all at once?","options":["hot","warm","geographic dispersion","cold"],"correctIndex":2,"explanation":"Geographic dispersion. It concerns the distance between sites, not their readiness level, so no single regional disaster hits both. The tell: geographic dispersion = spacing sites far apart; hot = live facility, minutes to hours; warm = equipped, data restore, hours to days; cold = bare space, days to weeks."},{"id":"q276","domain":"D3","family":"sites","question":"An auditor notes that a company's primary data center and its recovery site sit in the same city, warning that a single regional flood could destroy both. Which resilience principle did the company fail to apply?","options":["hot","warm","cold","geographic dispersion"],"correctIndex":3,"explanation":"Geographic dispersion. Placing both sites in one region violates geographic dispersion, which requires enough distance that one disaster cannot take out both. The tell: geographic dispersion = adequate distance between sites; hot = live standby facility, minutes to hours; warm = equipped facility, hours to days; cold = bare space, days to weeks."},{"id":"q277","domain":"D3","family":"resilience-planning","question":"Which resilience approach means deliberately using different vendors, operating systems, or technologies so that a single flaw cannot compromise the entire environment at once?","options":["multi-cloud","platform diversity","capacity planning","continuity of operations"],"correctIndex":1,"explanation":"Platform diversity. Using varied vendors, operating systems, or technologies so one flaw cannot sink everything is platform diversity. The tell: platform diversity = varied vendors and OSes to avoid a common flaw, multi-cloud = spread across cloud providers, capacity planning = sizing people, tech, and infrastructure for demand, continuity of operations = keeping essential functions running."},{"id":"q278","domain":"D3","family":"resilience-planning","question":"Before a product launch, a firm estimates the additional staff, servers, and bandwidth it will need to handle the projected surge in demand. Which resilience activity is this?","options":["capacity planning","platform diversity","multi-cloud","continuity of operations"],"correctIndex":0,"explanation":"Capacity planning. Estimating the people, technology, and infrastructure needed to meet projected demand is capacity planning. The tell: capacity planning = size resources for expected load, platform diversity = varied vendors to avoid common flaws, multi-cloud = multiple cloud providers, continuity of operations = keep essential functions running during disruption."},{"id":"q279","domain":"D3","family":"resilience-planning","question":"To avoid depending on any single provider, a company runs its workloads across Amazon, Microsoft, and Google clouds so an outage at one does not take everything down. Which resilience approach is this?","options":["platform diversity","multi-cloud","continuity of operations (COOP)","capacity planning"],"correctIndex":1,"explanation":"Multi-cloud. Spreading workloads across multiple cloud providers so one provider's outage is survivable is a multi-cloud strategy. The tell: multi-cloud = spread across cloud providers; platform diversity = use different vendors, OSes, or technologies so one flaw does not sink all; continuity of operations = plan to keep essential functions running; capacity planning = size people, tech, and infrastructure for demand."},{"id":"q280","domain":"D3","family":"resilience-planning","question":"A government agency documents how it will keep its essential functions operating during and after a major disruption. Which resilience approach is this?","options":["capacity planning","multi-cloud","continuity of operations (COOP)","platform diversity"],"correctIndex":2,"explanation":"Continuity of operations (COOP). COOP is the plan to keep essential functions running through a disruption. The tell: continuity of operations = keep essential functions running; capacity planning = size resources for demand; multi-cloud = spread across cloud providers; platform diversity = varied vendors or technologies to limit a single flaw."},{"id":"q281","domain":"D3","family":"continuity-testing","question":"A team gathers in a conference room and talks through how they would respond to a ransomware outbreak, step by step, without touching any actual systems. Which test is this?","options":["tabletop exercise","failover test","simulation","parallel processing"],"correctIndex":0,"explanation":"Tabletop exercise. A discussion-based walkthrough where participants talk through the plan without touching systems is a tabletop exercise. The tell: tabletop = talk-through, no systems touched, failover test = actually cut over to the backup, simulation = act out a controlled scenario with real steps, parallel processing = run the recovery site alongside production to compare."},{"id":"q282","domain":"D3","family":"continuity-testing","question":"To validate its DR plan, an organization actually shuts down the primary system and cuts production over to the backup site to prove the switch works. Which test is this?","options":["tabletop exercise","simulation","failover test","parallel processing"],"correctIndex":2,"explanation":"Failover test. Actually cutting production over to the backup system to prove the switch works is a failover test. The tell: failover test = truly cut over to the backup, tabletop = discussion only, simulation = controlled acted-out scenario, parallel processing = recovery site runs alongside production for comparison."},{"id":"q283","domain":"D3","family":"continuity-testing","question":"Which continuity test runs the recovery site alongside live production to confirm it can handle the workload, without ever taking production offline?","options":["failover test","parallel processing","simulation","tabletop exercise"],"correctIndex":1,"explanation":"Parallel processing. Running the recovery site beside live production to verify it can carry the load without taking production down is parallel processing. The tell: parallel processing = recovery runs beside production for comparison, failover test = actually switch over to backup, simulation = controlled acted-out scenario, tabletop = discussion only."},{"id":"q284","domain":"D3","family":"continuity-testing","question":"Responders act out a realistic breach scenario, performing real response steps in a controlled setting to see how they perform, but without a true production cutover. Which test is this?","options":["tabletop exercise","failover test","parallel processing","simulation"],"correctIndex":3,"explanation":"Simulation. Acting out a realistic incident with real response steps in a controlled way is a simulation. The tell: simulation = act out a controlled scenario with real steps, tabletop = discussion only, no action, failover test = truly cut over to backup, parallel processing = recovery site runs alongside production."},{"id":"q285","domain":"D3","family":"continuity-testing","question":"Which continuity test is the lowest-impact and lowest-cost option, gathering stakeholders to walk through their roles in a scenario as a discussion without touching any systems?","options":["tabletop","simulation","failover","parallel processing"],"correctIndex":0,"explanation":"Tabletop. A tabletop is a discussion-based walkthrough that never touches production. The tell: tabletop = discussion only, no systems touched; simulation = act out real response steps in a controlled setting; failover = actually cut production over to the backup; parallel processing = run the recovery site alongside production to compare."},{"id":"q286","domain":"D3","family":"continuity-testing","question":"Of the continuity tests, which is the most disruptive because it forces an actual cutover of live operations to the alternate system to prove the switch works?","options":["parallel processing","tabletop","failover","simulation"],"correctIndex":2,"explanation":"Failover test. A failover test actually cuts production over to the backup, the most disruptive and realistic proof. The tell: failover = real cutover to the backup system; parallel processing = run recovery alongside production without taking prod down; tabletop = discussion only; simulation = perform response steps in a controlled scenario without a true cutover."},{"id":"q287","domain":"D3","family":"continuity-testing","question":"Unlike a discussion-only walkthrough, this test has the team physically carry out their response actions in a controlled scenario, but unlike a failover test it never cuts production over to the backup. Which test is this?","options":["failover","tabletop","parallel processing","simulation"],"correctIndex":3,"explanation":"Simulation. A simulation has responders perform real actions in a controlled scenario but stops short of an actual production cutover. The tell: simulation = perform real steps in a controlled setting, no cutover; tabletop = discussion only, no actions; failover = real cutover to the backup; parallel processing = run recovery beside production to compare without downtime."},{"id":"q288","domain":"D3","family":"backups","question":"A virtualization admin wants to capture the exact state of a VM just before applying a risky patch so it can be rolled back instantly if the patch fails. Which backup method fits?","options":["snapshot","replication","journaling","offsite backup"],"correctIndex":0,"explanation":"Snapshot. Capturing the exact point-in-time state of a VM so it can be rolled back instantly is a snapshot. The tell: snapshot = point-in-time image to revert to, replication = continuous near-real-time copy, journaling = log every change to replay to a point, offsite backup = copy stored elsewhere to survive a site loss."},{"id":"q289","domain":"D3","family":"backups","question":"A database team must be able to recover to any exact transaction point by replaying a log of every change made since the last full backup. Which technique provides this?","options":["snapshot","replication","journaling","offsite backup"],"correctIndex":2,"explanation":"Journaling. Recovering to any exact transaction point by replaying a log of every change is journaling. The tell: journaling = replay a change log to a precise point, snapshot = single point-in-time image, replication = continuous live copy, offsite backup = copy kept in another location."},{"id":"q290","domain":"D3","family":"backups","question":"A company stores a copy of its backups at a facility in another city so a fire at headquarters cannot destroy both the systems and their backups. This copy is best described as which?","options":["snapshot","journaling","replication","offsite backup"],"correctIndex":3,"explanation":"Offsite backup. Storing a copy in another city so one fire cannot destroy both systems and backups is an offsite backup. The tell: offsite backup = remote copy that survives a site disaster, snapshot = point-in-time image, journaling = replayable change log, replication = continuous near-real-time copy."},{"id":"q291","domain":"D3","family":"backups","question":"A storage engineer configures an array to continuously copy every write to a second array at a partner site in near real time, keeping the two nearly identical at all times. Which technique is this?","options":["snapshot","replication","journaling","onsite backup"],"correctIndex":1,"explanation":"Replication. Continuously copying every write to a second array in near real time to keep them nearly identical is replication. The tell: replication = continuous near-real-time copy, snapshot = point-in-time image, journaling = change log replayed to a point, onsite backup = local copy sharing the same disaster."},{"id":"q292","domain":"D3","family":"backups","question":"Which term describes a point-in-time image of a volume or system that you can revert to exactly as it existed at that instant?","options":["snapshot","replication","journaling","offsite backup"],"correctIndex":0,"explanation":"Snapshot. A point-in-time image of a volume you can revert to as it existed at that instant is a snapshot. The tell: snapshot = revertible point-in-time image, replication = continuous copy, journaling = replayable change log, offsite backup = remote copy for site loss."},{"id":"q293","domain":"D3","family":"backups","question":"An admin needs the second copy to stay constantly current with production so a failover loses minimal data, rather than being a periodic point-in-time image. Which approach fits?","options":["snapshot","journaling","onsite backup","replication"],"correctIndex":3,"explanation":"Replication. Unlike a periodic point-in-time image, replication keeps a constantly updated duplicate so failover loses minimal data. The tell: replication = continuous updated duplicate, snapshot = single point-in-time image, journaling = change log replayed to a point, onsite backup = local copy that shares the disaster."},{"id":"q294","domain":"D3","family":"backups","question":"A backup strategy is described as journaling. What does it actually do?","options":["Captures a single point-in-time image you can revert to","Continuously mirrors writes to a second location in near real time","Records every change in a log so transactions can be replayed to a precise point","Keeps a copy in a separate geographic facility"],"correctIndex":2,"explanation":"Journaling. It records every change in a log so transactions can be replayed to a precise recovery point. The tell: journaling = replay a change log to an exact point, snapshot = single point-in-time image, replication = continuous near-real-time mirror, offsite backup = copy in a separate facility."},{"id":"q295","domain":"D3","family":"backups","question":"A team captures a point-in-time image of a file server every night at midnight and accepts that a failure will lose any changes made since the most recent capture. Which backup method is in use?","options":["snapshot","replication","journaling","offsite backup"],"correctIndex":0,"explanation":"Snapshot. Nightly point-in-time images restore only to those discrete capture points, so changes since the last image are lost. The tell: snapshot = discrete point-in-time image, restore only to capture points, journaling = replay a change log to any precise moment, replication = continuous copy that stays current, offsite backup = remote copy that survives a site loss."},{"id":"q296","domain":"D3","family":"backups","question":"Backups kept on local storage in the same building allow the fastest restore but are lost if the building itself is destroyed. This copy is best described as which?","options":["offsite backup","onsite backup","snapshot","replication"],"correctIndex":1,"explanation":"Onsite backup. Backups on local storage in the same building restore fastest but are lost if the building is destroyed. The tell: onsite backup = local, fast restore, shares the disaster, offsite backup = remote, survives site loss but slower, snapshot = point-in-time image, replication = continuous copy."},{"id":"q297","domain":"D3","family":"backups","question":"How often backups are taken sets the maximum amount of data you can lose between them and drives the recovery point objective. What is this backup attribute called?","options":["replication","journaling","encryption","frequency"],"correctIndex":3,"explanation":"Frequency. How often backups run sets the maximum data you can lose between them, which is backup frequency. The tell: frequency = how often backups run, replication = continuous live copy, journaling = replayable change log, encryption = protecting backup data with a key."},{"id":"q298","domain":"D3","family":"backups","question":"A database team does not just want a live mirror of the data; they must be able to replay every individual change since the last full backup to recover to a chosen point in time. Which technique provides this?","options":["replication","journaling","snapshots","recovery"],"correctIndex":1,"explanation":"Journaling. Journaling logs each change so transactions can be replayed to a precise point, unlike a mirror that only holds the current state. The tell: journaling = log and replay every change to an exact point; replication = continuous near real-time copy of current data; snapshots = a fixed point-in-time image; recovery = the act of restoring service from backups."},{"id":"q299","domain":"D3","family":"backups","question":"Which backup technique continuously copies data to a second location in near real time so the copy stays almost identical to the source at all times?","options":["replication","snapshots","journaling","frequency"],"correctIndex":0,"explanation":"Replication. It keeps a second copy nearly identical to the source by copying changes continuously in near real time. The tell: replication = continuous near real-time mirror; snapshots = a single point-in-time image to revert to; journaling = a change log replayed to an exact point; frequency = how often backups are taken."},{"id":"q300","domain":"D3","family":"backups","question":"A backup is described as a snapshot. What does it capture?","options":["A continuous near real-time copy kept identical to the source.","A log of every change that can be replayed to a precise point.","A copy stored in the same building for the fastest restore.","A point-in-time image of the volume that you can revert to exactly as it was at that instant."],"correctIndex":3,"explanation":"Snapshot. A snapshot freezes the exact state of a volume at one instant so you can roll back to it. The tell: snapshot = point-in-time image to revert to; replication = continuous near real-time copy; journaling = replayable change log to an exact point; onsite = a local copy for fast restore."},{"id":"q301","domain":"D3","family":"backups","question":"A firm ships its backup media each week to a secured vault in a distant state so that a regional disaster at headquarters cannot destroy both production and its backups, accepting that retrieval and restore will take longer. This copy is best described as which?","options":["onsite","offsite","replication","snapshots"],"correctIndex":1,"explanation":"Offsite backup. Storing copies at a distant facility means they survive a total loss of the main site, at the cost of slower retrieval. The tell: offsite = distant copy, survives site loss, slower restore; onsite = local copy, fastest restore but shares the disaster; replication = continuous near real-time mirror; snapshots = a point-in-time image."},{"id":"q302","domain":"D3","family":"backups","question":"Which backup location choice gives the fastest possible restore because the media sits in the same building, at the risk of being destroyed along with production in a site-wide disaster?","options":["onsite","offsite","encryption","frequency"],"correctIndex":0,"explanation":"Onsite backup. Keeping backups locally makes restores fastest but leaves them exposed to a disaster that hits the whole site. The tell: onsite = local, fastest restore, shares the disaster; offsite = distant, survives site loss, slower restore; encryption = protects backup contents from being read; frequency = how often backups run."},{"id":"q303","domain":"D3","family":"backups","question":"A company worries that backup tapes could be stolen while being transported to the offsite vault and their contents read. Which backup safeguard directly renders the tape data unreadable without a key?","options":["offsite","frequency","encryption","replication"],"correctIndex":2,"explanation":"Encryption. Encrypting the backups makes their contents unreadable to anyone without the key, protecting stolen media. The tell: encryption = makes backup contents unreadable without a key; offsite = where the copy is stored, not how it is protected; frequency = how often backups run; replication = continuous copy to another location."},{"id":"q304","domain":"D3","family":"backups","question":"A team changes its backups from once daily to every four hours specifically to shrink the amount of data that could be lost between backups, tightening the recovery point objective. Which backup attribute are they adjusting?","options":["recovery","replication","journaling","frequency"],"correctIndex":3,"explanation":"Frequency. How often backups run sets the maximum data you can lose between them and drives the recovery point objective. The tell: frequency = how often backups are taken, sets the data-loss window; recovery = restoring service from a backup; replication = continuous near real-time copy; journaling = replayable change log to an exact point."},{"id":"q305","domain":"D3","family":"backups","question":"After ransomware encrypts production systems, the team restores clean data from backup media to bring services back to a working state. Which backup activity is this?","options":["recovery","replication","snapshots","journaling"],"correctIndex":0,"explanation":"Recovery. Recovery is the act of restoring data from backups to return systems to normal operation. The tell: recovery = restoring service from backups; replication = continuously copying data to another location; snapshots = capturing a point-in-time image; journaling = logging changes for later replay."},{"id":"q306","domain":"D3","family":"backups","question":"A cloud administrator schedules the storage array to capture a read-only point-in-time image of a volume every hour, so any of the last several hours can be restored exactly as the volume looked then. Which backup method is in use?","options":["replication","snapshots","journaling","offsite"],"correctIndex":1,"explanation":"Snapshots. Each hourly image freezes the volume's exact state, letting you revert to that instant. The tell: snapshots = point-in-time images to revert to; replication = continuous near real-time mirror, not discrete images; journaling = a change log replayed to an exact point; offsite = a copy stored at a distant location."},{"id":"q307","domain":"D3","family":"backups","question":"Two data centers must stay within seconds of each other so that if one fails the survivor holds essentially the same data, so every write is copied to the partner continuously as it happens. Which technique keeps them in step?","options":["snapshots","journaling","replication","onsite"],"correctIndex":2,"explanation":"Replication. Copying every write continuously keeps the two locations nearly identical for near-zero data loss on failover. The tell: replication = continuous near real-time copy between locations; snapshots = periodic point-in-time images, not continuous; journaling = replayable change log to an exact point; onsite = a local copy for fast restore."},{"id":"q308","domain":"D3","family":"power","question":"A server rack must never see even a momentary gap in power; a battery immediately carries the load for the seconds to minutes it takes other systems to respond. Which device provides this instant ride-through?","options":["generator","UPS","power distribution unit","dual power supply"],"correctIndex":1,"explanation":"UPS. A battery-backed uninterruptible power supply gives instant, gap-free power for seconds to minutes to ride through outages. The tell: UPS = instant short-term battery bridge, generator = fuel-powered long-term source that takes seconds to start, power distribution unit = distributes power to rack equipment, dual power supply = two supplies in one device for redundancy."},{"id":"q309","domain":"D3","family":"power","question":"During a multi-hour utility outage, a facility relies on a fuel-powered unit that takes several seconds to start and can then supply power for as long as fuel lasts. Which device is this?","options":["UPS","power distribution unit","generator","dual power supply"],"correctIndex":2,"explanation":"Generator. A fuel-powered generator supplies long-term power during extended outages but needs seconds to start, so a UPS bridges the gap. The tell: generator = long-term fuel-powered supply, UPS = instant battery ride-through, power distribution unit = routes power to rack devices, dual power supply = redundant supplies inside one device."},{"id":"q310","domain":"D3","family":"power","question":"When utility power fails, a battery unit instantly carries the server load for the first 20 seconds until a larger fuel-powered unit starts and takes over for the rest of the outage. Which device carries the load during those first seconds?","options":["generator","UPS","power distribution unit","dual power supply"],"correctIndex":1,"explanation":"UPS. An uninterruptible power supply provides instant, gap-free battery power to bridge the seconds until the generator comes online. The tell: UPS = instant short-term battery ride-through; generator = fuel-powered long-term source that needs seconds to start; power distribution unit = routes power to rack equipment; dual power supply = two supplies in one device for redundancy."},{"id":"q311","domain":"D3","family":"power","question":"You are told a facility relies on a generator to survive extended outages. Which limitation must be compensated for?","options":["It only routes power to rack equipment and provides no backup itself.","It offers redundancy inside one device but no outage protection.","It gives instant battery power but only for seconds to minutes.","It takes several seconds to start, so a battery unit must bridge the gap until it runs."],"correctIndex":3,"explanation":"Generator. A generator supplies long-term power during extended outages but needs seconds to start, so a UPS must cover that gap. The tell: generator = long-term fuel-powered supply, delayed start; UPS = instant battery ride-through for seconds to minutes; power distribution unit = distributes power to rack devices; dual power supply = redundant supplies in one chassis."},{"id":"q312","domain":"D4","family":"baselines","question":"A team documents the approved hardened configuration that every new server must match before it is allowed into production. Which step of the baseline process is this?","options":["Establish","Deploy","Maintain","Decommission"],"correctIndex":0,"explanation":"Establish. Defining the secure baseline configuration is the establish step. The tell: establish = define the baseline; deploy = push it to systems; maintain = keep it enforced and updated; decommission = retire the asset at end of life."},{"id":"q313","domain":"D4","family":"baselines","question":"Ongoing patching, drift detection, and re-applying settings so systems stay aligned with the approved configuration over time describes which baseline activity?","options":["Deploy","Maintain","Establish","Decommission"],"correctIndex":1,"explanation":"Maintain. Keeping the baseline enforced and current is the maintain step. The tell: maintain = keep it enforced and updated; establish = define it; deploy = push it out to systems; decommission = retire the asset."},{"id":"q314","domain":"D4","family":"baselines","question":"After the golden image is approved, the team uses their configuration tool to push that exact secure configuration out to all 400 new workstations. Which baseline activity is this?","options":["Establish","Maintain","Configuration enforcement","Deploy"],"correctIndex":3,"explanation":"Deploy. Deployment is pushing the approved baseline out to the systems that must run it. The tell: deploy = push the baseline to systems; establish = define and document the secure baseline first; maintain = keep it enforced and corrected over time; configuration enforcement = the ongoing act of holding a config in place, not the one-time push."},{"id":"q315","domain":"D4","family":"baselines","question":"In the baseline process, the maintain phase primarily involves which of the following?","options":["Writing the initial secure reference configuration","Pushing the approved configuration out to new systems","Continuously enforcing the configuration and correcting drift over time","Selecting which systems the baseline applies to"],"correctIndex":2,"explanation":"Maintain. Maintenance keeps systems aligned with the baseline by detecting drift and re-applying settings over time. The tell: maintain = ongoing enforcement and drift correction; establish = writing the initial reference config; deploy = pushing the config to systems; scoping which systems apply is part of establishing, not maintaining."},{"id":"q316","domain":"D4","family":"wireless-install","question":"Before installing access points in a new warehouse, an engineer walks the floor measuring signal coverage and interference to decide where each AP should go. What is this activity?","options":["Heat map","WPA3","Site survey","RADIUS"],"correctIndex":2,"explanation":"Site survey. Walking the space to plan AP placement and coverage is the site survey. The tell: site survey = walk the space to plan placement; heat map = the visual signal-strength output; WPA3 = the encryption standard; RADIUS = the centralized AAA auth server."},{"id":"q317","domain":"D4","family":"wireless-install","question":"An enterprise wants each Wi-Fi user to authenticate with their own domain credentials against a central server rather than sharing one passphrase. Which component provides this?","options":["RADIUS","WPA3","Heat map","Site survey"],"correctIndex":0,"explanation":"RADIUS. Centralized per-user AAA for enterprise Wi-Fi is provided by RADIUS. The tell: RADIUS = centralized AAA auth server; WPA3 = the encryption standard; site survey = plan AP placement; heat map = visual signal-strength map."},{"id":"q318","domain":"D4","family":"wireless-install","question":"After completing the walkthrough, the engineer produces a color-coded visual showing signal strength across every zone of the building, with red marking weak-coverage areas. What is this output?","options":["Site survey","Heat map","WPA3","RADIUS"],"correctIndex":1,"explanation":"Heat map. It is the visual signal-strength map produced from measurements. The tell: heat map = the color-coded coverage output; site survey = the walkthrough process that gathers the measurements; WPA3 = the wireless encryption standard; RADIUS = the central AAA server for enterprise authentication."},{"id":"q319","domain":"D4","family":"wireless-install","question":"Which element is the current standard that encrypts the confidentiality of traffic on an enterprise wireless network?","options":["RADIUS","Site survey","WPA3","Heat map"],"correctIndex":2,"explanation":"WPA3. It is the encryption standard protecting wireless traffic. The tell: WPA3 = the encryption standard; RADIUS = the central AAA server that authenticates users; site survey = walking the space to plan AP placement; heat map = the signal-strength visual output."},{"id":"q320","domain":"D4","family":"mobile-deployment","question":"Employees use their own personal phones for work email; the organization does not own the hardware and has only limited control over it. Which deployment model is this?","options":["COPE","CYOD","BYOD","MDM"],"correctIndex":2,"explanation":"BYOD. Employee-owned devices give the company the least control. The tell: BYOD = employee owns the device; COPE = company owns, personal use allowed; CYOD = pick from a company-approved list, company-owned; MDM = the tool that enforces policy."},{"id":"q321","domain":"D4","family":"mobile-deployment","question":"A firm purchases phones, hands them to staff, and explicitly permits personal use on those company-owned devices. Which model is this?","options":["COPE","BYOD","CYOD","MDM"],"correctIndex":0,"explanation":"COPE. Company-owned, personally enabled means the company owns the device but personal use is allowed. The tell: COPE = company-owned, personal use allowed; BYOD = employee-owned; CYOD = choose from an approved company-owned list; MDM = the enforcement tool."},{"id":"q322","domain":"D4","family":"mobile-deployment","question":"Regardless of ownership model, an organization needs one platform to push policies, enforce encryption, and remotely wipe lost devices. What is this platform?","options":["BYOD","CYOD","COPE","MDM"],"correctIndex":3,"explanation":"MDM. Mobile device management is the tool that enforces policy across all ownership models. The tell: MDM = the enforcement tool; BYOD = employee-owned; CYOD = an approved company-owned list; COPE = company-owned, personal use allowed."},{"id":"q323","domain":"D4","family":"mobile-deployment","question":"A company gives new hires a short list of approved, company-purchased phone models and lets each employee pick which one they want to carry. Which deployment model is this?","options":["BYOD","CYOD","COPE","MDM"],"correctIndex":1,"explanation":"CYOD. Choose your own device means the company owns the hardware but the employee selects from an approved list. The tell: CYOD = company-owned, pick from an approved list; BYOD = employee owns their personal device; COPE = company-owned with personal use permitted; MDM = the tool that enforces policy on any of them."},{"id":"q324","domain":"D4","family":"mobile-deployment","question":"Employees use devices they personally bought and own for company work; the company reimburses part of the phone bill but cannot dictate what else is installed on them. Which deployment model is this?","options":["CYOD","COPE","BYOD","MDM"],"correctIndex":2,"explanation":"BYOD. Bring your own device means the employee owns the hardware, giving the company the least control. The tell: BYOD = employee-owned device; CYOD = company-owned, chosen from an approved list; COPE = company-owned with personal use allowed; MDM = the management platform that enforces policy."},{"id":"q325","domain":"D4","family":"mobile-deployment","question":"Which model is captured by the phrase company-owned, personally enabled, where the organization owns and manages the device while permitting personal use?","options":["MDM","CYOD","BYOD","COPE"],"correctIndex":3,"explanation":"COPE. The acronym itself means company-owned, personally enabled. The tell: COPE = company owns and manages, personal use allowed; CYOD = company-owned but chosen from an approved list; BYOD = employee-owned device; MDM = the tool that enforces policy across devices."},{"id":"q326","domain":"D4","family":"app-security","question":"A web form rejects any entry containing SQL keywords or script tags before processing it, blocking injection attempts. Which secure coding practice is this?","options":["Input validation","Secure cookies","Code signing","Sandboxing"],"correctIndex":0,"explanation":"Input validation. Rejecting malformed or malicious input to stop injection is input validation. The tell: input validation = reject bad input; secure cookies = flags so cookies are not stolen or sent in clear; code signing = sign the binary for integrity and origin; sandboxing = run untrusted code in isolation."},{"id":"q327","domain":"D4","family":"app-security","question":"A vendor attaches a cryptographic signature to its installer so users can verify the software came from the vendor and was not altered. Which practice is this?","options":["Sandboxing","Static code analysis","Code signing","Input validation"],"correctIndex":2,"explanation":"Code signing. Signing the binary so users verify integrity and origin is code signing. The tell: code signing = sign the binary for integrity and origin; sandboxing = isolate untrusted code; static code analysis = review code without running it; input validation = reject bad input."},{"id":"q328","domain":"D4","family":"app-security","question":"A security team opens suspicious email attachments only inside a disposable, isolated virtual environment so any malicious behavior cannot reach production systems. Which practice is this?","options":["Static code analysis","Input validation","Secure cookies","Sandboxing"],"correctIndex":3,"explanation":"Sandboxing. It runs untrusted code in isolation so it cannot affect real systems. The tell: sandboxing = execute untrusted code in isolation; static code analysis = review code without running it; secure cookies = flags that protect session tokens; input validation = reject malformed input to stop injection."},{"id":"q329","domain":"D4","family":"app-security","question":"Setting flags such as HttpOnly and Secure on session tokens so they cannot be read by scripts or sent over cleartext connections is which application security practice?","options":["Secure cookies","Code signing","Sandboxing","Static code analysis"],"correctIndex":0,"explanation":"Secure cookies. The flags keep session tokens from being stolen or sent in the clear. The tell: secure cookies = protective flags on session tokens; code signing = signing a binary to prove integrity and origin; sandboxing = running untrusted code in isolation; static code analysis = reviewing code without executing it."},{"id":"q330","domain":"D4","family":"asset-management","question":"A security tool actively scans the network to discover every device currently connected, including ones missing from any list. Which asset-management activity is this?","options":["Inventory","Enumeration","Acquisition","Classification"],"correctIndex":1,"explanation":"Enumeration. Actively discovering assets on the network is enumeration. The tell: enumeration = actively discover assets; inventory = the maintained list of owned assets; acquisition = procuring the asset; classification = grouping assets by sensitivity."},{"id":"q331","domain":"D4","family":"asset-management","question":"Labeling assets according to the sensitivity of the data they store so the right handling rules apply is which asset-management activity?","options":["Classification","Assignment","Enumeration","Ownership"],"correctIndex":0,"explanation":"Classification. Grouping assets by data sensitivity is classification. The tell: classification = group by sensitivity or type; assignment = account for who currently holds it; enumeration = actively discover assets; ownership = who is ultimately accountable for it."},{"id":"q332","domain":"D4","family":"asset-management","question":"Which asset-management activity is the maintained master list of every hardware and software asset the organization owns?","options":["Enumeration","Acquisition","Assignment","Inventory"],"correctIndex":3,"explanation":"Inventory. It is the standing record of assets the organization owns. The tell: inventory = the list of owned assets; enumeration = actively discovering assets on the network; acquisition = procuring a new asset; assignment = accounting for who owns or uses an asset."},{"id":"q333","domain":"D4","family":"asset-management","question":"The moment the organization procures a new server through purchasing and it formally enters the company's possession is which stage of the asset lifecycle?","options":["Assignment","Ownership","Acquisition","Enumeration"],"correctIndex":2,"explanation":"Acquisition. It is the procurement stage where the asset is obtained. The tell: acquisition = procuring or obtaining the asset; assignment = accounting for who is issued the asset; ownership = who is accountable for it; enumeration = actively discovering assets on the network."},{"id":"q334","domain":"D4","family":"asset-disposal","question":"A company plans to reissue old laptops to another department, so the drives are wiped clean of all data but the hardware stays in service. Which disposal step is this?","options":["Destruction","Sanitization","Certification","Data retention"],"correctIndex":1,"explanation":"Sanitization. Wiping data so the media can be safely reused is sanitization. The tell: sanitization = wipe so media can be reused; destruction = physically shred or degauss the media; certification = documented proof of destruction; data retention = how long data must be kept."},{"id":"q335","domain":"D4","family":"asset-disposal","question":"Failed drives that held classified data are fed through an industrial shredder so nothing can ever be recovered. Which disposal method is this?","options":["Sanitization","Certification","Destruction","Data retention"],"correctIndex":2,"explanation":"Destruction. Physically shredding or degaussing media is destruction. The tell: destruction = physically destroy the media; sanitization = wipe for reuse; certification = documented proof it was destroyed; data retention = the required keep period."},{"id":"q336","domain":"D4","family":"asset-disposal","question":"After a third-party vendor destroys a batch of drives, they provide a signed document proving each serial number was destroyed. What is this document?","options":["Certification","Sanitization","Destruction","Data retention"],"correctIndex":0,"explanation":"Certification. Documented proof that data or media was destroyed is certification. The tell: certification = documented proof of destruction; destruction = the physical act itself; sanitization = wipe for reuse; data retention = how long to keep data before disposal."},{"id":"q337","domain":"D4","family":"asset-disposal","question":"A regulation requires the company to keep financial records for seven years before they may be disposed of. The rule dictating how long data must be kept is which concept?","options":["Sanitization","Data retention","Destruction","Certification"],"correctIndex":1,"explanation":"Data retention. It defines how long data must be kept before disposal is allowed. The tell: data retention = how long to keep data; sanitization = wiping media so it can be reused; destruction = physically shredding or degaussing media; certification = signed proof the data was destroyed."},{"id":"q338","domain":"D4","family":"asset-disposal","question":"When a colocation contract ends, the provider degausses and then pulverizes every drive that held the tenant's data so nothing can be recovered. Which disposal method is this?","options":["Certification","Sanitization","Destruction","Data retention"],"correctIndex":2,"explanation":"Destruction. Degaussing and pulverizing physically render the media unrecoverable. The tell: destruction = physically shred, degauss, or pulverize the media; sanitization = wipe data so the media can be reused; certification = the signed proof destruction happened; data retention = how long data must be kept before disposal."},{"id":"q339","domain":"D4","family":"asset-disposal","question":"Sanitization, as a media disposal method, is best described as which of the following?","options":["Physically shredding or degaussing media so it is gone","Removing data so the media can be safely reused","A signed document proving data was destroyed","The required period data must be kept before disposal"],"correctIndex":1,"explanation":"Sanitization. It clears data from media so the hardware can be reused safely. The tell: sanitization = wipe data, keep the media usable; destruction = physically shred or degauss the media; certification = the signed proof of destruction; data retention = how long data must be kept."},{"id":"q340","domain":"D4","family":"analysis-types","question":"A tool inspects the application source code for insecure functions and flaws without ever executing the program. Which analysis type is this?","options":["Package monitoring","Sandboxing","Dynamic analysis","Static analysis"],"correctIndex":3,"explanation":"Static analysis. Examining code without executing it is static analysis. The tell: static analysis = inspect code without running it; dynamic analysis = run it and watch behavior; package monitoring = watch third-party dependencies for known vulns; sandboxing = the isolated environment where code is run and observed."},{"id":"q341","domain":"D4","family":"analysis-types","question":"Analysts detonate a suspicious binary in an instrumented environment and record the files, registry keys, and network calls it makes while running. Which analysis type is this?","options":["Package monitoring","Code signing","Static analysis","Dynamic analysis"],"correctIndex":3,"explanation":"Dynamic analysis. Running the program and observing its behavior is dynamic analysis. The tell: dynamic analysis = run and watch behavior; static analysis = inspect code without executing; package monitoring = watch third-party dependencies for vulns; code signing = signing a binary to prove integrity and origin."},{"id":"q342","domain":"D4","family":"analysis-types","question":"A DevOps team subscribes to a service that alerts them whenever any open-source library in their build gets a newly disclosed vulnerability. Which activity is this?","options":["Package monitoring","Static analysis","Dynamic analysis","Input validation"],"correctIndex":0,"explanation":"Package monitoring. Watching third-party dependencies for known vulnerabilities is package monitoring. The tell: package monitoring = watch third-party dependencies for vulns; static analysis = inspect your own code without running it; dynamic analysis = run and observe behavior; input validation = reject malformed input at runtime."},{"id":"q343","domain":"D4","family":"analysis-types","question":"Static analysis differs from dynamic analysis in that static analysis does which of the following?","options":["Examines the code or binary without executing it","Runs the program and observes its runtime behavior","Watches third-party dependencies for disclosed vulnerabilities","Feeds malformed inputs to a live running process"],"correctIndex":0,"explanation":"Static analysis. It inspects code or a binary without ever running it. The tell: static analysis = examine without executing; dynamic analysis = run it and watch behavior; package monitoring = watch third-party dependencies for known vulnerabilities; feeding malformed inputs to a live process is a dynamic (fuzzing) technique."},{"id":"q344","domain":"D4","family":"analysis-types","question":"As part of continuous integration, a build server automatically launches each new build, feeds it malformed inputs, and watches for crashes and unexpected system calls. Which analysis type is this?","options":["Static analysis","Dynamic analysis","Package monitoring","Reverse engineering"],"correctIndex":1,"explanation":"Dynamic analysis. Running the program and observing its behavior under crafted inputs is dynamic analysis. The tell: dynamic analysis = execute and watch runtime behavior; static analysis = review code without running it; package monitoring = track third-party dependencies for known vulnerabilities; reverse engineering = deconstruct a binary to understand its design, not a runtime behavior test."},{"id":"q345","domain":"D4","family":"analysis-types","question":"A team wants to detect known-vulnerable third-party libraries pulled into their build rather than analyze their own code. Which activity addresses this, as opposed to static or dynamic analysis of their own application?","options":["Static analysis","Dynamic analysis","Package monitoring","Fuzzing"],"correctIndex":2,"explanation":"Package monitoring. It watches imported third-party dependencies for newly disclosed vulnerabilities. The tell: package monitoring = track third-party components for known flaws; static analysis = review your own code without running it; dynamic analysis = run your app and observe behavior; fuzzing = a dynamic technique that sends malformed inputs, still testing your own running code."},{"id":"q346","domain":"D4","family":"threat-intel","question":"An analyst gathers threat data entirely from free public sources like vendor blogs, social media, and public advisories. Which source type is this?","options":["Proprietary threat feed","Information-sharing organization","Dark web monitoring","OSINT"],"correctIndex":3,"explanation":"OSINT. Free, publicly available intelligence is OSINT. The tell: OSINT = free public sources; proprietary or third-party = paid vendor feeds; information-sharing organization = ISAC or industry peer sharing; dark web monitoring = watching criminal marketplaces and forums."},{"id":"q347","domain":"D4","family":"threat-intel","question":"Hospitals across a region exchange indicators of compromise with industry peers through a formal community group to warn each other of active campaigns. Which threat-intel source is this?","options":["Dark web monitoring","OSINT","Information-sharing organization","Proprietary threat feed"],"correctIndex":2,"explanation":"Information-sharing organization. Industry peers exchanging intel through an ISAC is an information-sharing organization. The tell: information-sharing organization = ISAC or community peer sharing; dark web monitoring = criminal marketplace watch; OSINT = free public sources; proprietary or third-party = paid vendor feeds."},{"id":"q348","domain":"D4","family":"threat-intel","question":"A bank pays a security vendor for a curated, subscription-based feed of indicators and analysis that is not available to the public. Which threat-intelligence source is this?","options":["OSINT","Information-sharing organization","Dark web","Proprietary third-party feed"],"correctIndex":3,"explanation":"Proprietary third-party feed. It is a paid vendor source of curated intelligence. The tell: proprietary third-party = paid vendor feed; OSINT = free public sources; information-sharing organization = an industry community like an ISAC exchanging indicators; dark web = monitoring criminal marketplaces and forums."},{"id":"q349","domain":"D4","family":"threat-intel","question":"Analysts monitor criminal marketplaces and hidden forums to spot the company's stolen credentials being offered for sale. Which threat-intelligence source is this?","options":["Dark web","OSINT","Information-sharing organization","Proprietary third-party feed"],"correctIndex":0,"explanation":"Dark web. Watching hidden criminal markets and forums is dark web intelligence. The tell: dark web = criminal marketplaces and forums; OSINT = free public sources; information-sharing organization = industry peers sharing indicators; proprietary third-party = a paid vendor feed."},{"id":"q350","domain":"D4","family":"security-assessments","question":"A company publishes a program that pays external researchers a reward for each valid vulnerability they responsibly disclose. Which assessment approach is this?","options":["Penetration testing","Bug bounty","Process audit","System audit"],"correctIndex":1,"explanation":"Bug bounty. Paying outside researchers per valid finding under responsible disclosure is a bug bounty. The tell: bug bounty = pay outsiders per valid finding; penetration testing = an authorized team runs a simulated attack; process audit = check procedures against requirements; system audit = check system controls against requirements."},{"id":"q351","domain":"D4","family":"security-assessments","question":"An organization hires an authorized team to actively exploit its systems in a simulated attack to prove which weaknesses are real. Which assessment is this?","options":["System audit","Bug bounty","Penetration testing","Process audit"],"correctIndex":2,"explanation":"Penetration testing. An authorized simulated attack by a team is penetration testing. The tell: penetration testing = authorized simulated attack; bug bounty = pay external researchers per finding; system audit = review system controls against requirements; process audit = review procedures against requirements."},{"id":"q352","domain":"D4","family":"security-assessments","question":"An assessor reviews the company's access-control procedures and change records against a required framework to confirm the controls are actually being followed. Which assessment is this?","options":["Penetration testing","Bug bounty","System and process audit","Responsible disclosure"],"correctIndex":2,"explanation":"System and process audit. It checks controls and procedures against requirements. The tell: system and process audit = verify controls meet requirements; penetration testing = an authorized simulated attack that exploits weaknesses; bug bounty = paying external researchers per valid finding; responsible disclosure = the reporting process bug bounties rely on, not the assessment itself."},{"id":"q353","domain":"D4","family":"security-assessments","question":"How does a penetration test differ from a bug bounty program?","options":["A pen test is an authorized engagement by a specific hired team, while a bug bounty pays any external researcher per valid finding","A pen test pays per finding, while a bug bounty is a single fixed engagement","Both only review documentation without touching any systems","A pen test never requires authorization from the target"],"correctIndex":0,"explanation":"Penetration testing. A pen test is a scoped, authorized engagement by a hired team, whereas a bug bounty rewards any external researcher for each valid finding. The tell: penetration testing = authorized team with defined scope; bug bounty = open, pay-per-finding with responsible disclosure; a system and process audit instead checks controls against requirements."},{"id":"q354","domain":"D4","family":"false-pos-neg","question":"An IDS alerts on a file transfer that turns out to be a routine, authorized backup. The alert fired but nothing was actually malicious. What is this?","options":["False negative","False positive","True positive","True negative"],"correctIndex":1,"explanation":"False positive. An alert that fires when nothing is actually wrong is a false positive. The tell: false positive = alerted but nothing was wrong; false negative = real threat that stayed silent; true positive = correctly alerted on a real threat; true negative = correctly stayed silent on benign activity."},{"id":"q355","domain":"D4","family":"false-pos-neg","question":"Malware ran on a host for weeks and the antivirus never generated any alert about it. What does this missed detection represent?","options":["False positive","True negative","False negative","True positive"],"correctIndex":2,"explanation":"False negative. A real threat that was never detected is a false negative. The tell: false negative = real threat with no alert (dangerous miss); false positive = alert with nothing wrong; true negative = correctly silent on benign traffic; true positive = correctly alerted on a real threat."},{"id":"q356","domain":"D4","family":"false-pos-neg","question":"To cut down on noisy alerts, an analyst reduces the sensitivity of the detection rules so they fire less often. The main risk of over-tuning this way is an increase in which outcome?","options":["True positives","False positives","True negatives","False negatives
