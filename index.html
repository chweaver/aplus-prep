<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#111318" />
<title>Security+ SY0-701 Prep</title>
<style>
  :root{
    --page:#111318; --card:#1b1e27; --option:#242836; --border:#2f3445;
    --text:#e8eaf1; --muted:#8a8fa3; --primary:#424cf7;
    --correct:#4ade80; --correct-bg:#173423; --wrong:#f87171; --wrong-bg:#3a1d1d;
    --amber:#f5c451;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
  }
  #tally{
    position:sticky; top:0; z-index:10; background:rgba(17,19,24,.96);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--border);
    padding:12px 16px; padding-top:max(12px,env(safe-area-inset-top));
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  #hleft{font-weight:700; font-size:15px; letter-spacing:.2px; white-space:nowrap}
  #hleft.warn{color:var(--wrong)}
  #hright{color:var(--muted); font-weight:600; white-space:nowrap}
  #bar{height:4px; background:var(--option); border-radius:3px; overflow:hidden; flex:1}
  #bar>div{height:100%; width:0; background:var(--primary); transition:width .25s ease}
  .hbtn{
    background:transparent; color:var(--muted); border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; font-size:13px; font-weight:600; cursor:pointer;
    -webkit-tap-highlight-color:transparent; flex:none;
  }
  main{max-width:520px; margin:0 auto; padding:16px}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; margin-top:8px}
  .meta{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; display:flex; justify-content:space-between; gap:8px}
  .q{font-size:18px; font-weight:600; margin:0 0 16px}
  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{
    -webkit-tap-highlight-color:transparent; text-align:left; width:100%;
    background:var(--option); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:15px 16px; font-size:16px; cursor:pointer;
    display:flex; gap:12px; align-items:flex-start; min-height:52px; transition:border-color .12s,background .12s;
  }
  .opt .k{font-weight:700; color:var(--muted); flex:none; width:18px}
  .opt:active{border-color:var(--primary)}
  .opt.selected{border-color:var(--primary); background:#20264a}
  .opt.selected .k{color:#9aa1ff}
  .opt.correct{background:var(--correct-bg); border-color:var(--correct)}
  .opt.correct .k{color:var(--correct)}
  .opt.wrong{background:var(--wrong-bg); border-color:var(--wrong)}
  .opt.wrong .k{color:var(--wrong)}
  .opt.dim{opacity:.55}
  .opt[disabled]{cursor:default}
  .expl{margin-top:16px; padding:14px 16px; border-radius:12px; border:1px solid var(--border); background:#161922; font-size:15px}
  .expl.correct{border-color:var(--correct)}
  .expl.wrong{border-color:var(--wrong)}
  .expl .verdict{font-weight:700; margin-bottom:6px}
  .expl.correct .verdict{color:var(--correct)}
  .expl.wrong .verdict{color:var(--wrong)}
  .expl .tell{color:var(--muted); display:block; margin-top:6px}
  .actions{margin-top:16px; display:flex; gap:10px}
  button.primary{
    background:var(--primary); color:#fff; border:none; border-radius:12px;
    padding:15px 18px; font-size:16px; font-weight:700; cursor:pointer; flex:1; min-height:52px;
    -webkit-tap-highlight-color:transparent;
  }
  button.primary:active{filter:brightness(1.12)}
  button.ghost{
    background:transparent; color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:15px 18px; font-size:16px; font-weight:600; cursor:pointer; flex:1; min-height:52px;
    -webkit-tap-highlight-color:transparent;
  }
  button.ghost.flagged{border-color:var(--amber); color:var(--amber)}
  h1.big{font-size:22px; margin:4px 0 2px}
  .bignum{font-size:40px; font-weight:800; margin:6px 0}
  .sub{color:var(--muted); margin-bottom:16px}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--border)}
  th{color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.06em}
  td.num{text-align:right; font-variant-numeric:tabular-nums}
  .accbar{height:6px; border-radius:4px; background:var(--option); overflow:hidden; margin-top:4px}
  .accbar>div{height:100%}
  .link{color:var(--muted); text-decoration:underline; cursor:pointer; font-size:13px; background:none; border:none; padding:0}
  .foot{margin-top:22px; display:flex; justify-content:space-between; align-items:center}
  .hint{color:var(--muted); font-size:12px; margin-top:10px; text-align:center}
  /* home */
  .modebtn{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%;
    background:var(--option); color:var(--text); border:1px solid var(--border); border-radius:14px;
    padding:16px; font-size:17px; font-weight:700; cursor:pointer; margin-top:10px; text-align:left;
    -webkit-tap-highlight-color:transparent;}
  .modebtn small{color:var(--muted); font-weight:500; font-size:13px}
  .modebtn.exam{border-color:var(--primary)}
  .seglabel{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-top:16px; font-weight:700}
  .seg{display:flex; gap:8px; margin-top:8px}
  .seg button{flex:1; background:var(--option); color:var(--muted); border:1px solid var(--border);
    border-radius:10px; padding:11px 10px; font-size:14px; font-weight:700; cursor:pointer;
    -webkit-tap-highlight-color:transparent;}
  .seg button.on{border-color:var(--primary); color:var(--text); background:#20264a}
  input[type=range]{width:100%; accent-color:var(--primary); margin:14px 0 2px; height:24px}
  .rangeval{font-size:22px; font-weight:800; color:var(--text)}
  .statline{color:var(--muted); font-size:13px; margin-top:14px}
  .exhist{margin-top:6px; font-size:13px; color:var(--muted)}
  .exhist b.pass{color:var(--correct)} .exhist b.fail{color:var(--wrong)}
  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:800; letter-spacing:.04em}
  .badge.pass{background:var(--correct-bg); color:var(--correct); border:1px solid var(--correct)}
  .badge.fail{background:var(--wrong-bg); color:var(--wrong); border:1px solid var(--wrong)}
  /* exam bottom nav + grid */
  #examnav{position:fixed; left:0; right:0; bottom:0; z-index:12;
    background:rgba(17,19,24,.97); border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:none; gap:10px; justify-content:space-between;}
  #examnav.show{display:flex}
  #examnav button{min-height:46px; padding:10px 14px; flex:1}
  #grid{position:fixed; inset:0; z-index:22; background:var(--page); display:none; overflow-y:auto}
  #grid.open{display:block}
  .gridbody{max-width:520px; margin:0 auto; padding:16px; padding-bottom:40px}
  .gridwrap{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:14px}
  .gcell{aspect-ratio:1; border-radius:10px; border:1px solid var(--border); background:var(--option);
    color:var(--text); font-size:14px; font-weight:700; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .gcell.answered{background:#20264a; border-color:var(--primary)}
  .gcell.flagged{border-color:var(--amber); color:var(--amber)}
  .gcell.cur{outline:2px solid #fff}
  /* reference overlay */
  #ref{position:fixed; inset:0; z-index:20; background:var(--page); display:none; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  #ref.open{display:block}
  .ovhead{position:sticky; top:0; background:rgba(17,19,24,.96); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border); padding:12px 16px; padding-top:max(12px,env(safe-area-inset-top));
    display:flex; justify-content:space-between; align-items:center; z-index:21; gap:12px;}
  .ovhead h1{font-size:16px; margin:0}
  .ovclose{background:var(--primary); color:#fff; border:none; border-radius:8px;
    padding:8px 14px; font-size:14px; font-weight:700; cursor:pointer; flex:none;
    -webkit-tap-highlight-color:transparent;}
  #ref .refbody{max-width:520px; margin:0 auto; padding:8px 16px 40px}
  #refsearch{width:100%; margin:10px 0 4px; padding:12px 14px; font-size:16px;
    background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px;}
  .refdom{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:20px 0 6px; font-weight:700}
  .reffam{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px}
  .reffam h2{font-size:15px; margin:0 0 4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .reffam .star{color:var(--amber); font-size:12px; font-weight:600}
  .reffam .sib{font-size:13px; color:var(--text); opacity:.92; margin-bottom:6px}
  .reffam .tell{font-size:13px; color:var(--muted)}
  .pad-bottom{padding-bottom:90px}
</style>
</head>
<body>
  <div id="tally">
    <button id="homebtn" class="hbtn" type="button" style="display:none">Home</button>
    <span id="hleft">SY0-701</span>
    <div id="bar"><div></div></div>
    <span id="hright"></span>
    <button id="refbtn" class="hbtn" type="button">Reference</button>
  </div>
  <main id="app"></main>

  <div id="examnav">
    <button class="ghost" id="exprev">Prev</button>
    <button class="ghost" id="exflag">Flag</button>
    <button class="ghost" id="exgrid">1/90</button>
    <button class="primary" id="exnext">Next</button>
  </div>

  <div id="grid">
    <div class="ovhead"><h1>Questions</h1><button class="ovclose" id="gridclose">Close</button></div>
    <div class="gridbody">
      <div class="hint" style="text-align:left">Blue = answered, amber = flagged. Tap to jump.</div>
      <div class="gridwrap" id="gridwrap"></div>
      <div class="actions"><button class="primary" id="gridsubmit">Submit exam</button></div>
    </div>
  </div>

  <div id="ref">
    <div class="ovhead"><h1>Twin-term reference</h1><button class="ovclose" id="refclose">Close</button></div>
    <div class="refbody">
      <input id="refsearch" type="search" placeholder="Filter families and terms" autocomplete="off" />
      <div id="reflist"></div>
    </div>
  </div>

<script id="data" type="application/json">{"questions":[{"id":"q001","domain":"D1","family":"control-categories","question":"A company schedules quarterly risk assessments and publishes a written data classification policy for staff to follow. Which control category do these represent?","options":["technical","managerial","operational","physical"],"correctIndex":1,"explanation":"Managerial. Risk assessments and written policies are administrative decisions, not technology. The tell: technical = enforced in hardware/software, managerial = policy and risk decisions, operational = day-to-day human processes, physical = tangible barriers."},{"id":"q002","domain":"D1","family":"control-categories","question":"An organization runs monthly security awareness training and has analysts follow documented incident-handling steps each shift. Which control category is this?","options":["managerial","physical","operational","technical"],"correctIndex":2,"explanation":"Operational. Recurring training and human incident-handling procedures are day-to-day people processes. The tell: operational = human day-to-day processes, managerial = policy/risk decisions, physical = tangible barriers, technical = implemented in tech."},{"id":"q003","domain":"D1","family":"control-categories","question":"The team deploys a network firewall and enables full-disk encryption to enforce protection through software and hardware mechanisms. Which control category do these fall under?","options":["managerial","operational","technical","physical"],"correctIndex":2,"explanation":"Technical. Firewalls and encryption enforce protection through technology. The tell: technical = implemented in hardware/software; managerial = policy and risk decisions; operational = day-to-day human processes; physical = tangible barriers like locks and fences."},{"id":"q004","domain":"D1","family":"control-categories","question":"A facility protects its server room with cipher door locks, steel perimeter fencing, and a posted guard. Which control category do these controls belong to?","options":["physical","technical","operational","managerial"],"correctIndex":0,"explanation":"Physical. Locks, fencing, and guards are tangible barriers protecting the facility. The tell: physical = tangible barriers; technical = hardware/software controls; operational = human processes like training; managerial = policy and risk decisions."},{"id":"q005","domain":"D1","family":"control-types","question":"A parking garage installs bright lighting and posts signs warning that the area is patrolled and recorded. Which control type is primarily at work?","options":["preventive","deterrent","detective","corrective"],"correctIndex":1,"explanation":"Deterrent. Signs and lighting discourage an attacker before an act without physically stopping them. The tell: deterrent = discourages, preventive = actually stops it, detective = finds it after, corrective = restores after."},{"id":"q006","domain":"D1","family":"control-types","question":"A legacy server cannot be patched, so the team wraps it in extra network monitoring and tighter access rules until it is retired. Which control type is the extra monitoring?","options":["deterrent","corrective","directive","compensating"],"correctIndex":3,"explanation":"Compensating. Extra monitoring substitutes because the primary fix, patching, is not feasible. The tell: compensating = alternate when the primary control is not possible, corrective = restores after an event, directive = mandates behavior, deterrent = discourages."},{"id":"q007","domain":"D1","family":"control-types","question":"Which control type identifies and records an incident after it has occurred, such as an IDS alert or reviewed camera footage?","options":["corrective","preventive","detective","directive"],"correctIndex":2,"explanation":"Detective. It finds and records an incident after it happens. The tell: detective = finds it after, corrective = fixes/restores after, preventive = stops it before, directive = mandates behavior."},{"id":"q008","domain":"D1","family":"control-types","question":"An acceptable use policy that mandates how employees must behave on company systems is an example of which control type?","options":["directive","preventive","deterrent","compensating"],"correctIndex":0,"explanation":"Directive. An acceptable use policy mandates required behavior. The tell: directive = mandates behavior, preventive = stops it before it happens, deterrent = discourages, compensating = alternate when the primary control is not feasible."},{"id":"q009","domain":"D1","family":"control-types","question":"A door lock and a firewall access rule both stop an unauthorized person from getting in before any damage is done. Which control type is this?","options":["detective","preventive","corrective","deterrent"],"correctIndex":1,"explanation":"Preventive. A lock and an access rule stop the action before harm occurs. The tell: preventive = stops it before; detective = finds it after; corrective = fixes/restores after; deterrent = discourages the attempt."},{"id":"q010","domain":"D1","family":"control-types","question":"After malware wipes a file server, the team restores the data from backup and applies the missing patch to return operations to normal. Which control type does the restore represent?","options":["corrective","preventive","compensating","detective"],"correctIndex":0,"explanation":"Corrective. Restoring from backup fixes and returns operations to normal after the incident. The tell: corrective = fixes/restores after; preventive = stops it before; compensating = an alternate control when the primary is not feasible; detective = finds the incident."},{"id":"q011","domain":"D1","family":"control-types","question":"A SIEM reviews the previous night's collected logs each morning and surfaces a suspicious login that already occurred. Which control type is at work?","options":["deterrent","directive","detective","corrective"],"correctIndex":2,"explanation":"Detective. Reviewing collected logs surfaces an event that already happened. The tell: detective = finds it after; deterrent = discourages beforehand; directive = mandates behavior via policy; corrective = restores after."},{"id":"q012","domain":"D1","family":"cia-nonrepudiation","question":"Every outbound contract is digitally signed so a sender cannot later deny having approved it. Which principle does this serve?","options":["integrity","availability","non-repudiation","confidentiality"],"correctIndex":2,"explanation":"Non-repudiation. A digital signature means the sender cannot later deny approving the message. The tell: non-repudiation = cannot deny you did it, integrity = unaltered, availability = uptime, confidentiality = secrecy."},{"id":"q013","domain":"D1","family":"cia-nonrepudiation","question":"A backup system stores a SHA-256 hash of each file so any later alteration is detected. Which principle is this protecting?","options":["integrity","confidentiality","availability","non-repudiation"],"correctIndex":0,"explanation":"Integrity. A stored hash detects any later alteration of the file. The tell: integrity = unaltered/hashing, confidentiality = secrecy/encryption, availability = uptime, non-repudiation = cannot deny."},{"id":"q014","domain":"D1","family":"cia-nonrepudiation","question":"Which principle is served by redundant servers and reliable backups that keep a service reachable when a component fails?","options":["confidentiality","availability","integrity","non-repudiation"],"correctIndex":1,"explanation":"Availability. Redundant servers and reliable backups keep the service reachable. The tell: availability = uptime, confidentiality = secrecy, integrity = unaltered, non-repudiation = cannot deny."},{"id":"q015","domain":"D1","family":"cia-nonrepudiation","question":"A hospital encrypts patient records so that only authorized clinicians can read them and outsiders cannot. Which principle is this protecting?","options":["confidentiality","integrity","availability","non-repudiation"],"correctIndex":0,"explanation":"Confidentiality. Encrypting records keeps them secret from unauthorized readers. The tell: confidentiality = secrecy via encryption; integrity = unaltered via hashing; availability = uptime via redundancy; non-repudiation = cannot deny an action."},{"id":"q016","domain":"D1","family":"cia-nonrepudiation","question":"Detailed audit logs tie every database change to a specific user account so no one can credibly deny making a change. Which principle does this support?","options":["integrity","availability","non-repudiation","confidentiality"],"correctIndex":2,"explanation":"Non-repudiation. Audit logs tie each change to a user so it cannot be credibly denied. The tell: non-repudiation = cannot deny you did it; integrity = data unaltered; availability = service reachable; confidentiality = data kept secret."},{"id":"q017","domain":"D1","family":"aaa","question":"A RADIUS server records each user's login time, commands run, and session duration for later audit and billing. Which AAA component is this?","options":["identification","authentication","accounting","authorization"],"correctIndex":2,"explanation":"Accounting. Recording login times, commands, and session duration is the accounting function. The tell: accounting = records what you did, authentication = prove who you are, authorization = what you may do, identification = who you claim to be."},{"id":"q018","domain":"D1","family":"aaa","question":"Which AAA component determines what resources a user is permitted to access after their identity has been proven?","options":["authentication","authorization","accounting","identification"],"correctIndex":1,"explanation":"Authorization. It determines what resources a proven user may access. The tell: authorization = what you are allowed to do, authentication = prove who you are, accounting = records what you did, identification = the claimed identity."},{"id":"q019","domain":"D1","family":"aaa","question":"Before granting entry, a system verifies a user's claimed identity by checking their password and fingerprint. Which AAA component is this?","options":["accounting","authentication","authorization","identification"],"correctIndex":1,"explanation":"Authentication. Verifying the user's claimed identity with a password and fingerprint proves who they are. The tell: authentication = prove who you are; authorization = what you may access; accounting = recording what you did; identification = merely claiming an identity before it is proven."},{"id":"q020","domain":"D1","family":"aaa","question":"After John logs in successfully, the system checks his role and permits him to open only the finance folder. Which AAA component makes that determination?","options":["authorization","authentication","accounting","identification"],"correctIndex":0,"explanation":"Authorization. Checking the role and permitting only the finance folder decides what the user may access. The tell: authorization = what you are allowed to do; authentication = proving identity; accounting = logging actions; identification = asserting an identity."},{"id":"q021","domain":"D1","family":"zero-trust","question":"In a zero trust architecture, which component evaluates policy and renders the actual decision to grant or deny access?","options":["Policy Engine","Policy Administrator","Policy Enforcement Point","control plane"],"correctIndex":0,"explanation":"Policy Engine. It evaluates policy and renders the grant or deny decision. The tell: Policy Engine = makes the decision, Policy Administrator = relays the access token, Policy Enforcement Point = the gate that allows/blocks, control plane = where decisions live."},{"id":"q022","domain":"D1","family":"zero-trust","question":"A device sits in the connection path and either opens or drops a user's session based on the token it receives. Which zero trust component is this?","options":["Policy Administrator","Policy Engine","Policy Enforcement Point","data plane"],"correctIndex":2,"explanation":"Policy Enforcement Point. It sits in the path and opens or drops the session based on the token. The tell: Policy Enforcement Point = the gate, Policy Administrator = relays the token, Policy Engine = makes the decision, data plane = where traffic flows."},{"id":"q023","domain":"D1","family":"zero-trust","question":"Which zero trust component generates and relays the access token that tells the enforcement point to allow a session?","options":["Policy Enforcement Point","Policy Administrator","Policy Engine","threat scope reduction"],"correctIndex":1,"explanation":"Policy Administrator. It generates and relays the access token that instructs the enforcement point. The tell: Policy Administrator = relays the token, Policy Enforcement Point = the gate, Policy Engine = makes the decision, threat scope reduction = shrinking the attack surface."},{"id":"q024","domain":"D1","family":"zero-trust","question":"In a zero trust architecture, which term names the logical area where policy decisions are made and managed, separate from where subject traffic actually flows?","options":["data plane","adaptive identity","implicit trust zones","control plane"],"correctIndex":3,"explanation":"Control plane. Zero trust policy decisions are made and managed in the control plane. The tell: control plane = where decisions live, data plane = where subject traffic flows, adaptive identity = risk-based identity checks, implicit trust zones = areas assumed trusted, which zero trust removes."},{"id":"q025","domain":"D1","family":"zero-trust","question":"Which zero trust term names the layer where the subject's actual traffic and application sessions flow, as opposed to where access decisions are made?","options":["control plane","Policy Engine","Policy Administrator","data plane"],"correctIndex":3,"explanation":"Data plane. This is where the subject's actual traffic and sessions flow, separate from where decisions are made. The tell: data plane = where traffic/subjects flow; control plane = where policy decisions live; Policy Engine = renders the grant/deny decision; Policy Administrator = relays the access token."},{"id":"q026","domain":"D1","family":"zero-trust","question":"A zero trust system tightens its authentication requirements when a user connects from an unusual location or device, adjusting trust based on context. Which zero trust concept is this?","options":["threat scope reduction","implicit trust zones","adaptive identity","policy-driven access control"],"correctIndex":2,"explanation":"Adaptive identity. Trust requirements change based on context like location and device. The tell: adaptive identity = adjusts trust on context; threat scope reduction = shrink what a compromised account can reach; implicit trust zones = areas assumed trusted; policy-driven access control = access governed by defined policy."},{"id":"q027","domain":"D1","family":"zero-trust","question":"Limiting each user's access to only the minimal set of resources needed shrinks what an attacker can reach if that account is compromised. Which zero trust concept does this describe?","options":["threat scope reduction","adaptive identity","control plane","Policy Enforcement Point"],"correctIndex":0,"explanation":"Threat scope reduction. Limiting each user to the minimal resources shrinks the blast radius of a compromise. The tell: threat scope reduction = minimize what an attacker can reach; adaptive identity = context-based trust; control plane = where decisions are managed; Policy Enforcement Point = the gate that allows or blocks the session."},{"id":"q028","domain":"D1","family":"physical-security","question":"A data center wants to prevent a vehicle from being driven through its glass lobby entrance. Which control best addresses this?","options":["bollards","fencing","access control vestibule","lighting"],"correctIndex":0,"explanation":"Bollards. Short sturdy posts stop a vehicle from being driven into the entrance. The tell: bollards = stop vehicles, fencing = perimeter boundary, access control vestibule = one person at a time, lighting = deters and illuminates."},{"id":"q029","domain":"D1","family":"physical-security","question":"To stop a second person from slipping in behind an authorized employee, a facility installs a double-door enclosure that admits only one person at a time. Which control is this?","options":["security guard","access badge","access control vestibule","bollards"],"correctIndex":2,"explanation":"Access control vestibule. A double-door enclosure passing one person at a time stops a second person from slipping in. The tell: access control vestibule = one-at-a-time double door, security guard = human control, access badge = a credential, bollards = stop vehicles."},{"id":"q030","domain":"D1","family":"physical-security","question":"An alarm system detects an intruder in a dark warehouse by picking up the body heat they emit. Which sensor type is this?","options":["pressure sensor","infrared sensor","microwave sensor","ultrasonic sensor"],"correctIndex":1,"explanation":"Infrared sensor. It detects an intruder by the body heat they emit. The tell: infrared sensor = detects heat/body; pressure sensor = detects weight/step; microwave sensor = detects motion via reflected waves; ultrasonic sensor = detects motion via reflected sound."},{"id":"q031","domain":"D1","family":"physical-security","question":"To review who entered the loading dock after a theft, investigators pull recorded camera footage covering the area. Which physical control provided this?","options":["lighting","security guard","video surveillance","access badge"],"correctIndex":2,"explanation":"Video surveillance. Recorded camera footage lets investigators review who entered after the fact. The tell: video surveillance = recorded/monitored cameras; lighting = deters and improves visibility; security guard = a human presence; access badge = a credential to open a door."},{"id":"q032","domain":"D1","family":"deception","question":"A team plants a fake set of admin credentials inside a config file; any use of them triggers an immediate alert. Which deception technique is this?","options":["honeypot","honeyfile","honeytoken","honeynet"],"correctIndex":2,"explanation":"Honeytoken. Fake credentials that fire an alert when used are a bait record. The tell: honeytoken = bait credential/record, honeypot = one decoy system, honeyfile = a bait file, honeynet = a whole decoy network."},{"id":"q033","domain":"D1","family":"deception","question":"Which deception technology is an entire network of decoy systems built to lure and study attackers?","options":["honeynet","honeypot","honeyfile","honeytoken"],"correctIndex":0,"explanation":"Honeynet. It is an entire network of decoy systems. The tell: honeynet = a whole decoy network, honeypot = one decoy system, honeyfile = a bait file, honeytoken = a bait credential."},{"id":"q034","domain":"D1","family":"deception","question":"Security engineers deploy a single decoy server exposed to the internet purely to attract attackers and study their techniques. Which deception technology is this?","options":["honeypot","honeynet","honeyfile","honeytoken"],"correctIndex":0,"explanation":"Honeypot. A single decoy system deployed to attract and study attackers. The tell: honeypot = one decoy system; honeynet = a whole decoy network; honeyfile = a bait file; honeytoken = a bait credential/record that alerts when used."},{"id":"q035","domain":"D1","family":"deception","question":"A team plants a document named 'passwords.xlsx' on a share; opening or copying it triggers an alert because no legitimate user should touch it. Which deception technique is this?","options":["honeynet","honeytoken","honeyfile","honeypot"],"correctIndex":2,"explanation":"Honeyfile. A bait document that should never be touched, so access triggers an alert. The tell: honeyfile = a bait file; honeytoken = a bait credential/record; honeynet = a whole decoy network; honeypot = a single decoy system."},{"id":"q036","domain":"D1","family":"change-management","question":"Before deploying a firmware upgrade, the change ticket documents the exact steps to revert to the previous version if the upgrade fails. Which element is this?","options":["impact analysis","backout plan","maintenance window","test results"],"correctIndex":1,"explanation":"Backout plan. It documents the exact steps to revert if the change fails. The tell: backout plan = how to undo, impact analysis = what could break, maintenance window = approved time to change, test results = proof it was validated."},{"id":"q037","domain":"D1","family":"change-management","question":"Which change-management element is the approved, scheduled period during which a change may be implemented with the least disruption?","options":["impact analysis","approval process","backout plan","maintenance window"],"correctIndex":3,"explanation":"Maintenance window. It is the approved scheduled period to implement a change with least disruption. The tell: maintenance window = approved time to change, impact analysis = what could break, approval process = who signs off, backout plan = how to undo."},{"id":"q038","domain":"D1","family":"change-management","question":"Before approving a database schema change, the review board documents every downstream system that could break and the likely effect on each. Which change-management element is this?","options":["backout plan","impact analysis","test results","maintenance window"],"correctIndex":1,"explanation":"Impact analysis. Documenting what could break and the effect on each system before approval is impact analysis. The tell: impact analysis = what could break; backout plan = how to undo; test results = evidence the change works; maintenance window = the approved time to make the change."},{"id":"q039","domain":"D1","family":"change-management","question":"The team keeps every revision of its firewall configuration files in a repository so any change can be tracked and rolled back to a prior version. Which change-management practice is this?","options":["version control","standard operating procedure","approval process","impact analysis"],"correctIndex":0,"explanation":"Version control. Keeping every revision of config files so changes can be tracked and rolled back is version control. The tell: version control = track revisions; standard operating procedure = the repeatable documented procedure; approval process = authorization to proceed; impact analysis = what could break."},{"id":"q040","domain":"D1","family":"crypto-key-handling","question":"A corporate laptop stores its full-disk-encryption key and verifies boot integrity using a dedicated crypto chip soldered onto its motherboard. Which component is this?","options":["TPM","HSM","secure enclave","key management system"],"correctIndex":0,"explanation":"TPM. A crypto chip soldered to one device's motherboard handles that device's boot integrity and disk key. The tell: TPM = chip built into one endpoint, HSM = appliance serving many systems, secure enclave = isolated region on the CPU, key management system = software key lifecycle."},{"id":"q041","domain":"D1","family":"crypto-key-handling","question":"A bank needs a tamper-resistant hardware appliance to generate and store thousands of cryptographic keys for its payment servers. Which solution fits?","options":["TPM","key escrow","HSM","secure enclave"],"correctIndex":2,"explanation":"HSM. A dedicated tamper-resistant appliance generates and stores keys at scale for many servers. The tell: HSM = appliance for many systems, TPM = chip in one endpoint, key escrow = a third party holds key copies, secure enclave = isolated CPU region."},{"id":"q042","domain":"D1","family":"crypto-key-handling","question":"A company deposits a copy of its encryption keys with a trusted third party so data can be recovered if the keys are lost or a court orders access. Which arrangement is this?","options":["key escrow","key management system","HSM","TPM"],"correctIndex":0,"explanation":"Key escrow. A trusted third party holds a copy of keys for recovery or legal access. The tell: key escrow = a third party holds key copies, key management system = software lifecycle, HSM = a hardware appliance, TPM = a chip in one endpoint."},{"id":"q043","domain":"D1","family":"crypto-key-handling","question":"A smartphone stores fingerprint templates and cryptographic keys inside an isolated coprocessor region kept separate from the main CPU and OS. Which component is this?","options":["TPM","secure enclave","HSM","key escrow"],"correctIndex":1,"explanation":"Secure enclave. An isolated coprocessor region on the CPU keeps keys and biometrics apart from the OS. The tell: secure enclave = isolated region on the processor, TPM = a discrete chip on the motherboard, HSM = a standalone appliance, key escrow = a third party holds copies."},{"id":"q044","domain":"D1","family":"crypto-key-handling","question":"A cloud team needs a software service to automate creating, rotating, and revoking encryption keys across dozens of applications. Which fits best?","options":["HSM","TPM","secure enclave","key management system"],"correctIndex":3,"explanation":"Key management system. A software service automates the create, rotate, and revoke lifecycle across many apps. The tell: key management system = software key lifecycle, HSM = a hardware appliance, TPM = a chip in one endpoint, secure enclave = an isolated CPU region."},{"id":"q045","domain":"D1","family":"crypto-key-handling","question":"An architect must choose between a component built into a single endpoint for that device's disk key and a networked appliance serving keys to many servers. Which fits the single endpoint?","options":["HSM","TPM","key management system","key escrow"],"correctIndex":1,"explanation":"TPM. The component built into a single endpoint for that device's disk key is the TPM, not the networked appliance. The tell: TPM = built into one endpoint, HSM = an appliance serving many servers, key management system = software lifecycle, key escrow = a third party holds copies."},{"id":"q046","domain":"D1","family":"crypto-key-handling","question":"An employee leaves the company, and the organization must lawfully retrieve the decryption key protecting that employee's encrypted files. Which arrangement is designed for this?","options":["HSM","secure enclave","key escrow","TPM"],"correctIndex":2,"explanation":"Key escrow. It is the arrangement designed for recovery and lawful retrieval of a key. The tell: key escrow = held for recovery/legal access, HSM = a hardware appliance, secure enclave = an isolated CPU region, TPM = a chip in one endpoint."},{"id":"q047","domain":"D1","family":"crypto-key-handling","question":"Which term describes a dedicated, tamper-resistant hardware appliance that offloads and accelerates cryptographic operations for many systems at once?","options":["TPM","secure enclave","key escrow","HSM"],"correctIndex":3,"explanation":"HSM. A dedicated tamper-resistant appliance that offloads and accelerates crypto for many systems is an HSM. The tell: HSM = an appliance for many systems, TPM = a chip in one endpoint, secure enclave = an isolated CPU region, key escrow = a third party holds copies."},{"id":"q048","domain":"D1","family":"crypto-key-handling","question":"Which component is an isolated region inside the main processor that protects keys and biometric data even if the operating system is compromised?","options":["key management system","secure enclave","TPM","HSM"],"correctIndex":1,"explanation":"Secure enclave. An isolated region inside the main processor protects keys and biometrics even if the OS is compromised. The tell: secure enclave = isolated region on the processor, key management system = software lifecycle, TPM = a discrete motherboard chip, HSM = a standalone appliance."},{"id":"q049","domain":"D1","family":"crypto-key-handling","question":"A security team requires that every application encryption key be rotated automatically every 90 days and revoked immediately if compromised, all handled by one software service. Which solution provides this?","options":["key escrow","HSM","TPM","key management system"],"correctIndex":3,"explanation":"Key management system. A software service that handles the key lifecycle, including scheduled rotation and revocation, is a KMS. The tell: key management system = software key lifecycle, key escrow = a third party holds copies, HSM = a hardware appliance, TPM = a chip in one endpoint."},{"id":"q050","domain":"D1","family":"crypto-key-handling","question":"Windows BitLocker seals the drive's encryption key to a chip on the motherboard so the drive only unlocks if the machine boots in its known-good state. Which component is this?","options":["HSM","secure enclave","key management system","TPM"],"correctIndex":3,"explanation":"TPM. A chip on one device's motherboard that seals the disk key to the machine's known-good boot state. The tell: TPM = crypto chip built into one endpoint's motherboard; HSM = a networked appliance serving keys at scale; secure enclave = an isolated coprocessor region on the CPU; key management system = software handling the key lifecycle."},{"id":"q051","domain":"D1","family":"crypto-key-handling","question":"Which component is a dedicated crypto chip on a single device's motherboard that stores platform measurements to attest the system booted untampered?","options":["key escrow","TPM","HSM","key management system"],"correctIndex":1,"explanation":"TPM. A per-endpoint motherboard chip that stores boot measurements to attest an untampered boot. The tell: TPM = per-endpoint motherboard chip for boot integrity and disk keys; key escrow = a third party holding key copies; HSM = an appliance generating/storing keys for many systems; key management system = software for the key lifecycle."},{"id":"q052","domain":"D1","family":"crypto-key-handling","question":"A certificate authority keeps its root signing key inside a FIPS-validated hardware appliance that signs certificates without the key ever leaving the device. Which component is this?","options":["HSM","TPM","key escrow","secure enclave"],"correctIndex":0,"explanation":"HSM. A dedicated tamper-resistant appliance that signs without the key ever leaving the device. The tell: HSM = hardware appliance generating/storing keys at scale; TPM = a chip inside one endpoint; key escrow = a third party holding key copies; secure enclave = an isolated region on a CPU."},{"id":"q053","domain":"D1","family":"crypto-key-handling","question":"An enterprise must generate and manage keys centrally for hundreds of servers, not just secure one machine's boot. Which fits, as opposed to a per-machine motherboard chip?","options":["TPM","secure enclave","HSM","key management system"],"correctIndex":2,"explanation":"HSM. Central key generation and management for hundreds of servers calls for a networked appliance, not a per-machine chip. The tell: HSM = appliance serving keys to many systems; TPM = a chip securing just one endpoint's boot/disk key; secure enclave = an isolated coprocessor on a CPU; key management system = the software lifecycle service."},{"id":"q054","domain":"D1","family":"crypto-key-handling","question":"A firm worries encrypted archives will be unrecoverable if a key is destroyed, so it arranges for a trusted third party to hold a recovery copy of the master key. Which arrangement is this?","options":["HSM","key management system","TPM","key escrow"],"correctIndex":3,"explanation":"Key escrow. A trusted third party holds a recovery copy of the keys so encrypted data is not lost if a key is destroyed. The tell: key escrow = a third party holds key copies for recovery/legal access; HSM = an appliance that guards keys in active use; key management system = software that rotates/revokes keys; TPM = a per-endpoint chip."},{"id":"q055","domain":"D1","family":"crypto-key-handling","question":"Which term specifically means a third party holding a copy of keys for later recovery or lawful access, rather than a hardware appliance that generates and guards keys in active use?","options":["HSM","key escrow","secure enclave","TPM"],"correctIndex":1,"explanation":"Key escrow. It is a third party holding key copies for later recovery or lawful access, not a device that guards keys in use. The tell: key escrow = third-party copy for recovery; HSM = hardware appliance generating/storing keys; secure enclave = isolated CPU region; TPM = per-endpoint motherboard chip."},{"id":"q056","domain":"D1","family":"crypto-key-handling","question":"A cloud team wants one central service that controls which applications may use each key, logs every key use, and handles rotation and revocation across services. Which solution is this?","options":["key management system","HSM","key escrow","TPM"],"correctIndex":0,"explanation":"Key management system. One software service controls which apps use each key, logs usage, and handles rotation and revocation. The tell: key management system = software for the full key lifecycle; HSM = the hardware appliance performing crypto; key escrow = a third-party recovery copy; TPM = a per-endpoint chip."},{"id":"q057","domain":"D1","family":"crypto-key-handling","question":"Which option orchestrates create, rotate, and revoke across many applications in software, whereas a separate hardware device actually performs the cryptographic operations?","options":["HSM","TPM","key management system","secure enclave"],"correctIndex":2,"explanation":"Key management system. It orchestrates the key lifecycle in software, while the appliance performs the crypto. The tell: key management system = software lifecycle orchestration; HSM = hardware that generates/stores and performs operations; TPM = a per-endpoint chip; secure enclave = an isolated CPU region."},{"id":"q058","domain":"D1","family":"crypto-key-handling","question":"On a modern phone, payment tokens and the keys protecting them sit in a hardware region isolated from the main processor and OS, so on-device malware cannot extract them. Which component is this?","options":["TPM","HSM","key management system","secure enclave"],"correctIndex":3,"explanation":"Secure enclave. An isolated hardware region on the phone's processor holds payment tokens and their keys beyond the reach of on-device malware. The tell: secure enclave = isolated coprocessor region on a CPU/phone; TPM = a discrete motherboard chip on one endpoint; HSM = a networked appliance for many systems; key management system = software for the key lifecycle."},{"id":"q059","domain":"D1","family":"crypto-key-handling","question":"A payment processor needs a certified, tamper-responsive hardware module that generates keys and performs PIN encryption, zeroizing its keys if the case is opened. Which component is this?","options":["TPM","HSM","secure enclave","key escrow"],"correctIndex":1,"explanation":"HSM. A certified tamper-responsive hardware module generates keys and performs PIN encryption, zeroizing keys if opened. The tell: HSM = a dedicated hardware appliance for keys/crypto at scale; TPM = a chip inside one endpoint; secure enclave = an isolated region on a CPU; key escrow = a third-party key copy."},{"id":"q060","domain":"D1","family":"crypto-methods","question":"To prevent precomputed rainbow-table attacks, each stored password has a unique random value added before it is hashed. What is this technique?","options":["hashing","salting","key stretching","symmetric"],"correctIndex":1,"explanation":"Salting. A unique random value added to each password before hashing defeats precomputed rainbow tables. The tell: salting = random per-password value, key stretching = make brute forcing expensive, hashing = a one-way fingerprint, symmetric = one shared key."},{"id":"q061","domain":"D1","family":"crypto-methods","question":"A developer runs each password through bcrypt with many iterations so that brute forcing becomes computationally expensive. What is this technique?","options":["salting","hashing","key exchange","key stretching"],"correctIndex":3,"explanation":"Key stretching. Running passwords through bcrypt with many iterations makes brute forcing expensive. The tell: key stretching = make weak secrets costly to crack, salting = random per-password value, hashing = a one-way fingerprint, key exchange = agree on a shared key."},{"id":"q062","domain":"D1","family":"crypto-methods","question":"Diffie-Hellman lets two parties agree on a shared secret over an untrusted channel without ever transmitting the secret itself. What is this process called?","options":["key exchange","asymmetric","symmetric","hashing"],"correctIndex":0,"explanation":"Key exchange. Diffie-Hellman lets two parties agree on a shared secret over an untrusted channel. The tell: key exchange = safely agree on a shared key, asymmetric = a public/private key pair, symmetric = one shared key for bulk data, hashing = a one-way fingerprint."},{"id":"q063","domain":"D1","family":"crypto-methods","question":"A VPN encrypts a large bulk data transfer quickly using a single shared secret key that both ends already hold. Which cryptographic method is this?","options":["asymmetric encryption","symmetric encryption","key exchange","hashing"],"correctIndex":1,"explanation":"Symmetric encryption. One shared key encrypts bulk data quickly at both ends. The tell: symmetric = one shared key, fast, bulk data; asymmetric = a public/private key pair; key exchange = safely agreeing on a shared key; hashing = a one-way integrity fingerprint."},{"id":"q064","domain":"D1","family":"crypto-methods","question":"A system uses a public/private key pair so anyone can encrypt to the holder but only the holder's private key can decrypt. Which method is this?","options":["asymmetric encryption","symmetric encryption","salting","key stretching"],"correctIndex":0,"explanation":"Asymmetric encryption. A public/private key pair lets anyone encrypt but only the private key decrypts. The tell: asymmetric = public/private key pair; symmetric = one shared key; salting = a random per-password value against rainbow tables; key stretching = making a weak password expensive to brute force."},{"id":"q065","domain":"D1","family":"pki-signatures","question":"To send a confidential file that only the intended recipient can open, the sender encrypts it with which key?","options":["the recipient's public key","the recipient's private key","the sender's public key","the sender's private key"],"correctIndex":0,"explanation":"The recipient's public key. Encrypting for confidentiality uses the recipient's public key so only their private key can open it. The tell: encrypt for confidentiality = recipient's public key, recipient's private key = what only they hold to decrypt, sender's private key = used to sign, sender's public key = used to verify a signature."},{"id":"q066","domain":"D1","family":"pki-signatures","question":"To prove a message came from her and was not altered, Maria signs it with which key?","options":["the sender's public key","the sender's private key","the recipient's public key","the recipient's private key"],"correctIndex":1,"explanation":"The sender's private key. Signing for integrity and non-repudiation uses the sender's own private key, which anyone verifies with her public key. The tell: sign = sender's private key, sender's public key = verifies the signature, recipient's public key = encrypts for confidentiality, recipient's private key = decrypts."},{"id":"q067","domain":"D1","family":"pki-signatures","question":"Which technology links records into hashed, chained blocks so that altering one block breaks the chain?","options":["open public ledger","digital signature","blockchain","hashing"],"correctIndex":2,"explanation":"Blockchain. It links records into hashed chained blocks so altering one breaks the chain. The tell: blockchain = chained hashed blocks, open public ledger = the visible record of those transactions, digital signature = a private-key signed hash, hashing = a one-way fingerprint."},{"id":"q068","domain":"D1","family":"pki-signatures","question":"A hash of a message encrypted with the sender's private key, providing both integrity and non-repudiation, is known as what?","options":["blockchain","hashing","open public ledger","digital signature"],"correctIndex":3,"explanation":"Digital signature. A message hash encrypted with the sender's private key gives integrity plus non-repudiation. The tell: digital signature = a signed hash for integrity and non-repudiation; blockchain = chained hashed blocks; hashing = a one-way fingerprint only; open public ledger = the public record of blockchain transactions."},{"id":"q069","domain":"D1","family":"pki-signatures","question":"To verify that a digitally signed document truly came from Raj, a recipient checks the signature using which key?","options":["Raj's private key","Raj's public key","the recipient's private key","the recipient's public key"],"correctIndex":1,"explanation":"Raj's public key. A signature is verified with the signer's public key, since only his private key could have created it. The tell: sign with the sender's private key; verify with the sender's public key; encrypting for secrecy uses the recipient's public key; the recipient's private key only decrypts messages sent to them."},{"id":"q070","domain":"D1","family":"obfuscation","question":"An attacker conceals stolen data inside the pixels of an ordinary-looking JPEG image to sneak it past inspection. Which technique is this?","options":["tokenization","data masking","encryption","steganography"],"correctIndex":3,"explanation":"Steganography. Hiding stolen data inside the pixels of an image conceals data within other media. The tell: steganography = hide data inside media, tokenization = swap for a vaulted token, data masking = show a partial value, encryption = reversible with a key."},{"id":"q071","domain":"D1","family":"obfuscation","question":"A payment system replaces each stored credit-card number with a random value that maps back to the real number only through a secure vault. Which technique is this?","options":["data masking","steganography","tokenization","encryption"],"correctIndex":2,"explanation":"Tokenization. Replacing a card number with a random token that maps back only through a vault is tokenization. The tell: tokenization = token maps back via a vault, data masking = irreversibly shows a partial value, steganography = hide data inside media, encryption = reversible with a key."},{"id":"q072","domain":"D1","family":"obfuscation","question":"A support portal displays a customer's card as XXXX-XXXX-XXXX-1234; the hidden digits are permanently obscured and cannot be recovered from what is shown. Which technique is this?","options":["tokenization","data masking","steganography","encryption"],"correctIndex":1,"explanation":"Data masking. The shown value is permanently obscured and cannot be reversed from what is displayed. The tell: data masking = show a partial/scrambled value that cannot be reversed; tokenization = swap for a token that maps back via a vault; steganography = hide data inside other media; encryption = reversible with a key."},{"id":"q073","domain":"D1","family":"obfuscation","question":"An insider hides a stolen spreadsheet's contents inside the inaudible portions of an MP3 audio file to move it past data-loss inspection. Which technique is this?","options":["data masking","tokenization","steganography","encryption"],"correctIndex":2,"explanation":"Steganography. The data is concealed inside an audio file's inaudible portions to hide its very existence. The tell: steganography = hide data inside other media; data masking = show a partial value; tokenization = swap for a vaulted token; encryption = scramble reversibly with a key."},{"id":"q074","domain":"D1","family":"encryption-levels","question":"A DBA must encrypt the individual table rows holding VIP customers' data so each entry is protected separately, while the rest of the table stays readable. Which encryption level is this?","options":["database","volume","file","record"],"correctIndex":3,"explanation":"Record. Encrypting individual rows or entries inside a database is record-level encryption. The tell: record = a single row/entry within the database, database = encrypt the whole database, volume = a logical volume, file = individual files."},{"id":"q075","domain":"D1","family":"encryption-levels","question":"Which encryption level protects an entire physical drive, including the operating system and swap space, and unlocks at boot?","options":["partition","volume","full-disk","file"],"correctIndex":2,"explanation":"Full-disk. It protects the entire physical drive including the OS and swap, unlocking at boot. The tell: full-disk = the entire drive, partition = one partition, volume = a logical volume, file = individual files."},{"id":"q076","domain":"D1","family":"encryption-levels","question":"A user encrypts only a few specific sensitive documents in a folder, leaving the rest of the disk readable. Which encryption level is this?","options":["full-disk encryption","volume encryption","database encryption","file-level encryption"],"correctIndex":3,"explanation":"File-level encryption. Only specific documents are encrypted while the rest of the disk stays readable. The tell: file = individual files; full-disk = the entire drive; volume = a logical volume; database = the whole database."},{"id":"q077","domain":"D1","family":"encryption-levels","question":"A company encrypts its entire customer database so the whole data store is protected as a unit, not just individual rows. Which encryption level is this?","options":["record-level encryption","file-level encryption","database encryption","partition encryption"],"correctIndex":2,"explanation":"Database encryption. The entire data store is protected as a unit rather than single rows. The tell: database = the whole database; record = a single row/field inside it; file = individual files; partition = one partition of the drive."},{"id":"q078","domain":"D1","family":"certificates","question":"A browser needs to verify in real time whether one specific certificate has been revoked, without downloading a large list. Which mechanism does this?","options":["CRL","OCSP","CSR","wildcard"],"correctIndex":1,"explanation":"OCSP. It checks one certificate's revocation status in real time without downloading a list. The tell: OCSP = real-time single-cert check, CRL = a downloaded batch list that can be stale, CSR = the request sent to a CA, wildcard = covers subdomains."},{"id":"q079","domain":"D1","family":"certificates","question":"A company wants a single certificate that secures mail.example.com, shop.example.com, and any other subdomain. Which certificate type fits?","options":["wildcard","self-signed","root of trust","CRL"],"correctIndex":0,"explanation":"Wildcard. A single wildcard certificate secures all subdomains of a domain. The tell: wildcard = covers *.domain subdomains, self-signed = no external trust, root of trust = the anchor CA, CRL = a list of revoked certs."},{"id":"q080","domain":"D1","family":"certificates","question":"Which item does an administrator generate and submit to a certificate authority to request a signed certificate?","options":["CRL","OCSP","CSR","root of trust"],"correctIndex":2,"explanation":"CSR. The certificate signing request is what an admin generates and submits to a CA. The tell: CSR = the request sent to a CA, CRL = a list of revoked certs, OCSP = a real-time revocation check, root of trust = the anchor CA."},{"id":"q081","domain":"D1","family":"certificates","question":"A client periodically downloads a published list of all revoked certificates, which may already be hours out of date. Which mechanism is this?","options":["OCSP","CSR","wildcard","CRL"],"correctIndex":3,"explanation":"CRL. A periodically downloaded list of revoked certificates that may be hours stale is a CRL. The tell: CRL = a downloaded batch list, OCSP = a real-time single-cert check, CSR = the request sent to a CA, wildcard = covers subdomains."},{"id":"q082","domain":"D1","family":"certificates","question":"A developer generates a certificate and signs it with their own key for an internal test server, so no external authority vouches for it and browsers warn users. Which certificate type is this?","options":["self-signed certificate","wildcard certificate","third-party certificate","root of trust"],"correctIndex":0,"explanation":"Self-signed certificate. The developer signed it with their own key, so no external authority vouches for it and clients warn. The tell: self-signed = you signed it yourself, no external trust; third-party = a trusted CA vouches for it; wildcard = covers all subdomains of a domain; root of trust = the anchor CA a chain terminates at."},{"id":"q083","domain":"D1","family":"certificates","question":"In a certificate chain, which element is the anchor certificate authority that the chain ultimately terminates at and that clients inherently trust?","options":["certificate signing request","root of trust","OCSP","wildcard certificate"],"correctIndex":1,"explanation":"Root of trust. It is the anchor certificate authority a chain ultimately terminates at and that clients inherently trust. The tell: root of trust = the trust anchor at the top of the chain; certificate signing request = the request sent to a CA; OCSP = real-time single-cert revocation check; wildcard = covers all subdomains."},{"id":"q084","domain":"D1","family":"certificates","question":"Which entity validates a requester's identity and issues the signed digital certificate that others will trust?","options":["certificate signing request","certificate revocation list","root of trust","certificate authority"],"correctIndex":3,"explanation":"Certificate authority. It validates the requester's identity and issues the signed certificate others trust. The tell: certificate authority = the trusted issuer; certificate signing request = the request you submit to it; certificate revocation list = a downloaded list of revoked certs; root of trust = the anchor CA the chain terminates at."},{"id":"q085","domain":"D2","family":"threat-actors","question":"A loosely organized group breaches a city government website and posts manifestos protesting a new policy, seeking publicity rather than money. Which threat actor is this?","options":["hacktivist","nation-state actor","organized crime","insider threat"],"correctIndex":0,"explanation":"hacktivist. A political or philosophical message, not profit, drives the attack. The tell: hacktivist = political/philosophical statement; nation-state = state-resourced espionage or war; organized crime = financial gain; insider threat = trusted internal person abusing access."},{"id":"q086","domain":"D2","family":"threat-actors","question":"Which threat actor is best characterized by deep funding, long-term persistence, and an espionage or wartime mission carried out on behalf of a government?","options":["organized crime","nation-state actor","hacktivist","unskilled attacker"],"correctIndex":1,"explanation":"nation-state actor. Heavy resources plus espionage or war intent point to an APT-style government sponsor. The tell: nation-state = state resources, espionage/war; organized crime = money-motivated crews; hacktivist = ideological messaging; unskilled attacker = borrows others' tools with little skill."},{"id":"q087","domain":"D2","family":"threat-actors","question":"A marketing team spins up an unapproved cloud database to move faster, bypassing IT entirely but with no malicious intent. Which category fits?","options":["insider threat","unskilled attacker","shadow IT","organized crime"],"correctIndex":2,"explanation":"shadow IT. Unsanctioned internal technology adopted without approval, not out of malice. The tell: shadow IT = unsanctioned internal tech, no malicious intent; insider threat = trusted person acting against the org; unskilled attacker = runs premade scripts; organized crime = external profit-driven group."},{"id":"q088","domain":"D2","family":"threat-actors","question":"A well-funded criminal syndicate deploys ransomware across hospital networks purely to extort large payouts. Which threat actor is this?","options":["hacktivist","unskilled attacker","nation-state","organized crime"],"correctIndex":3,"explanation":"organized crime. The driving motive is financial gain through extortion. The tell: organized crime = motivated by financial gain; hacktivist = pushing a political or social message; unskilled attacker = runs others' tools with little skill; nation-state = state-resourced espionage or wartime operations."},{"id":"q089","domain":"D2","family":"threat-actors","question":"A trusted internal employee who abuses their legitimate access to steal or sabotage company data is best classified as which threat actor?","options":["shadow IT","unskilled attacker","insider threat","organized crime"],"correctIndex":2,"explanation":"insider threat. A trusted internal person misusing granted access. The tell: insider threat = a trusted internal person abusing access; shadow IT = unsanctioned internal tech with no malicious intent; unskilled attacker = uses others' tools with low skill; organized crime = an external group after financial gain."},{"id":"q090","domain":"D2","family":"social-eng-phish","question":"An employee receives a text message claiming to be from their bank with a link to verify the account before it is locked. Which technique is this?","options":["phishing","vishing","spear phishing","smishing"],"correctIndex":3,"explanation":"smishing. The lure arrives over SMS text messaging. The tell: smishing = SMS text; phishing = email; vishing = voice call; spear phishing = a targeted email aimed at a specific individual."},{"id":"q091","domain":"D2","family":"social-eng-phish","question":"An attacker phones the help desk pretending to be a traveling executive and talks the agent into resetting a password over the call. Which technique is this?","options":["vishing","smishing","phishing","spear phishing"],"correctIndex":0,"explanation":"vishing. The manipulation happens through a live voice call. The tell: vishing = voice call; smishing = SMS text; phishing = email; spear phishing = a targeted email to one chosen person."},{"id":"q092","domain":"D2","family":"social-eng-phish","question":"Which term describes a broad, untargeted fraudulent email blast sent to thousands of recipients hoping some reveal credentials?","options":["smishing","phishing","vishing","spear phishing"],"correctIndex":1,"explanation":"phishing. Generic mass email designed to harvest credentials is classic phishing. The tell: phishing = broad email; smishing = SMS text; vishing = voice call; spear phishing = narrowly targeted email at a specific individual."},{"id":"q093","domain":"D2","family":"social-eng-phish","question":"Which social engineering technique relies on fraudulent voice phone calls to trick victims into revealing sensitive information?","options":["smishing","vishing","phishing","spear phishing"],"correctIndex":1,"explanation":"vishing. The attack is carried out over a voice call. The tell: vishing = voice call; smishing = SMS text message; phishing = email; spear phishing = a phishing email aimed at one specific target."},{"id":"q094","domain":"D2","family":"social-eng-phish","question":"Classic phishing is delivered primarily through which channel?","options":["email","an SMS text message","a voice phone call","an instant-messaging app"],"correctIndex":0,"explanation":"email. Phishing in its traditional form arrives by email. The tell: phishing = email delivery; smishing = SMS text message; vishing = voice call; instant messaging is a separate message-based channel."},{"id":"q095","domain":"D2","family":"misinformation","question":"A user shares an outdated safety article believing it is still current, unaware the facts changed, and passes it on with no intent to mislead. What is this?","options":["disinformation","malinformation","misinformation","influence campaign"],"correctIndex":2,"explanation":"misinformation. False content spread by honest mistake, with no intent to deceive. The tell: misinformation = false, spread WITHOUT intent to deceive; disinformation = false, spread deliberately to manipulate; malinformation = true info weaponized out of context; influence campaign = coordinated effort to sway opinion."},{"id":"q096","domain":"D2","family":"misinformation","question":"A disgruntled former employee knowingly fabricates false stories about the company's finances and posts them online, intending to deceive investors. What is this?","options":["misinformation","malinformation","influence campaign","disinformation"],"correctIndex":3,"explanation":"disinformation. The content is false and it is spread deliberately to deceive. The tell: disinformation = false, spread deliberately to deceive; misinformation = false, spread by honest error; malinformation = real info leaked or twisted to harm; influence campaign = a coordinated multi-channel effort to sway opinion."},{"id":"q097","domain":"D2","family":"misinformation","question":"Which term specifically means false information circulated WITHOUT any intent to deceive, essentially an honest error passed along?","options":["misinformation","disinformation","malinformation","influence campaign"],"correctIndex":0,"explanation":"misinformation. The defining trait is the absence of intent to deceive. The tell: misinformation = no intent to deceive; disinformation = deliberate deception; malinformation = accurate info used maliciously; influence campaign = organized push to shape beliefs."},{"id":"q098","domain":"D2","family":"misinformation","question":"Which term means false information deliberately spread to deceive or manipulate an audience?","options":["misinformation","malinformation","disinformation","influence campaign"],"correctIndex":2,"explanation":"disinformation. It is false and shared with deliberate intent to deceive. The tell: disinformation = false, spread deliberately to manipulate; misinformation = false, spread by honest mistake; malinformation = true info weaponized out of context; influence campaign = a coordinated multi-channel effort to sway opinion."},{"id":"q099","domain":"D2","family":"misinformation","question":"A company secretly plants fake negative reviews it knows are untrue to damage a competitor's sales. What is this?","options":["influence campaign","disinformation","misinformation","malinformation"],"correctIndex":1,"explanation":"disinformation. Knowingly false content spread to mislead and harm. The tell: disinformation = deliberate falsehood to deceive; influence campaign = a broad coordinated push across many channels; misinformation = an honest error passed along; malinformation = genuine information twisted to harm."},{"id":"q100","domain":"D2","family":"misinformation","question":"Which statement correctly distinguishes misinformation from disinformation?","options":["Misinformation is spread without intent to deceive, while disinformation is spread deliberately to deceive.","Misinformation is deliberate, while disinformation is accidental.","Both always require intent to deceive.","Disinformation is only ever shared by mistake."],"correctIndex":0,"explanation":"misinformation lacks intent while disinformation is deliberate. Intent to deceive is the dividing line. The tell: misinformation = false info spread WITHOUT intent to deceive; disinformation = false info spread deliberately to manipulate; malinformation = true info weaponized; influence campaign = a coordinated effort to shape opinion."},{"id":"q101","domain":"D2","family":"impersonation","question":"An attacker compromises the CEO's mailbox and emails the finance team an urgent request to wire funds to a new vendor account. Which technique is this?","options":["impersonation","business email compromise (BEC)","pretexting","brand impersonation"],"correctIndex":1,"explanation":"business email compromise (BEC). A compromised or spoofed internal executive account is used to request a fraudulent transfer. The tell: BEC = compromised/spoofed internal exec email demanding wires or gift cards; impersonation = simply posing as someone; pretexting = inventing a backstory; brand impersonation = faking a trusted company's look."},{"id":"q102","domain":"D2","family":"impersonation","question":"A caller invents a detailed cover story, claiming to be a new external auditor who needs access to meet a looming compliance deadline, to justify the request. Which technique is this?","options":["impersonation","brand impersonation","pretexting","business email compromise (BEC)"],"correctIndex":2,"explanation":"pretexting. A fabricated, believable backstory is built to justify the ask. The tell: pretexting = invented scenario to legitimize the request; impersonation = just claiming to be someone; brand impersonation = mimicking a company's identity; BEC = fraudulent internal executive email."},{"id":"q103","domain":"D2","family":"impersonation","question":"Attackers build fake emails and a lookalike site that copy a well-known company's logos, colors, and styling to fool that company's customers. Which technique is this?","options":["impersonation","pretexting","business email compromise (BEC)","brand impersonation"],"correctIndex":3,"explanation":"brand impersonation. Copying a trusted company's visual identity to deceive its customers. The tell: brand impersonation = faking a company's look and feel; impersonation = posing as an individual; pretexting = a fabricated justifying story; BEC = spoofed internal executive email."},{"id":"q104","domain":"D2","family":"impersonation","question":"An attacker emails staff simply claiming to be the new IT technician, with no elaborate cover story, and asks them to install a remote tool. Which technique is this?","options":["brand impersonation","pretexting","impersonation","business email compromise (BEC)"],"correctIndex":2,"explanation":"impersonation. Plainly posing as someone else to gain trust, without an elaborate backstory. The tell: impersonation = pretend to be someone (help desk, IT tech); pretexting = invent a detailed backstory to justify the ask; brand impersonation = mimic a trusted company's look; BEC = a spoofed or compromised internal executive email requesting payments."},{"id":"q105","domain":"D2","family":"impersonation","question":"Business email compromise (BEC) is best characterized by which of the following?","options":["a spoofed or compromised internal executive email requesting urgent payments","a fake lookalike of a consumer brand's website","an invented backstory used to justify a request","casually posing as a coworker in a hallway"],"correctIndex":0,"explanation":"a spoofed or compromised internal executive email requesting urgent payments. BEC abuses executive email to push fraudulent transfers. The tell: BEC = compromised or spoofed exec email seeking wires or gift cards; brand impersonation = faking a company's public look; pretexting = a fabricated backstory; impersonation = simply posing as a person."},{"id":"q106","domain":"D2","family":"social-eng-other","question":"Attackers compromise a popular industry news site that their target's engineers visit daily, planting malware to infect those specific visitors. Which attack is this?","options":["watering hole","typosquatting","phishing","brand impersonation"],"correctIndex":0,"explanation":"watering hole. Compromising a site the target group already frequents to reach them indirectly. The tell: watering hole = poison a site the targets already visit; typosquatting = register a misspelled lookalike domain; phishing = fraudulent email lure; brand impersonation = mimic a trusted company."},{"id":"q107","domain":"D2","family":"social-eng-other","question":"A user fat-fingers a domain and lands on a malicious lookalike site the attacker registered under a common misspelling of a popular address. Which attack is this?","options":["watering hole","typosquatting","phishing","impersonation"],"correctIndex":1,"explanation":"typosquatting. Registering a misspelled lookalike domain to catch mistyped traffic. The tell: typosquatting = misspelled lookalike domain; watering hole = compromise a site the targets already visit; phishing = fraudulent email; impersonation = posing as a person."},{"id":"q108","domain":"D2","family":"social-eng-other","question":"Which technique registers domains that are common misspellings or near-variants of a legitimate address to capture mistyped traffic?","options":["watering hole","brand impersonation","typosquatting","phishing"],"correctIndex":2,"explanation":"typosquatting. It relies on registering misspelled lookalike domains. The tell: typosquatting = misspelled lookalike domain; watering hole = compromise a site the targets already visit; brand impersonation = mimic a trusted company; phishing = fraudulent email lure."},{"id":"q109","domain":"D2","family":"social-eng-other","question":"In a watering hole attack, how does the attacker reach the intended victims?","options":["by compromising a legitimate site the target group routinely visits","by registering a misspelled lookalike domain","by sending fraudulent email to each victim directly","by placing a phone call to each victim"],"correctIndex":0,"explanation":"by compromising a legitimate site the target group routinely visits. The attacker poisons a trusted site rather than contacting victims directly. The tell: watering hole = poison a site the targets already frequent; typosquatting = a misspelled lookalike domain; phishing = fraudulent email; voice calls belong to vishing, a different channel."},{"id":"q110","domain":"D2","family":"attack-vectors","question":"An attacker scatters infected USB drives in the company parking lot, hoping a curious employee plugs one into a workstation. Which vector is being used?","options":["open service ports","default credentials","removable device","message-based vector"],"correctIndex":2,"explanation":"removable device. The USB drive is the delivery vector into the network. The tell: removable device = USB or media plugged in; open service ports = an exposed listening service; default credentials = unchanged out-of-box password; message-based = lure delivered via email, SMS, or IM."},{"id":"q111","domain":"D2","family":"attack-vectors","question":"A newly deployed network switch is breached because its out-of-the-box admin password was never changed. Which vector was exploited?","options":["open service ports","unsecure networks","removable device","default credentials"],"correctIndex":3,"explanation":"default credentials. The factory login was left in place and abused. The tell: default credentials = unchanged out-of-box password; open service ports = exposed listening service; unsecure networks = untrusted or open connectivity; removable device = USB or media vector."},{"id":"q112","domain":"D2","family":"attack-vectors","question":"A monitoring deployment installs no software on the endpoints it watches, giving a smaller footprint but less direct control. Which model is described?","options":["agentless","client-based","file-based vector","open service ports"],"correctIndex":0,"explanation":"agentless. No installed software means a lighter footprint but reduced control. The tell: agentless = no installed software; client-based = requires an installed agent that can itself be compromised; file-based = malicious file as the vector; open service ports = exposed listening service."},{"id":"q113","domain":"D2","family":"attack-vectors","question":"Which attack vector refers to an exposed, listening network service that is directly reachable and can be attacked?","options":["default credentials","open service ports","removable device","unsecure networks"],"correctIndex":1,"explanation":"open service ports. An e
