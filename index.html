ppens."},{"id":"q474","domain":"D4","family":"ir-process","question":"The team has removed the malware and closed the vulnerability that allowed it in, and systems are now clean. According to the incident response lifecycle, which phase follows?","options":["containment","lessons learned","recovery","eradication"],"correctIndex":2,"explanation":"Recovery. After eradication removes the threat, recovery restores systems to normal operation. The tell: eradication = remove the threat/artifacts; recovery = restore to normal operations; containment = stop the spread; lessons learned = post-incident improvement review."},{"id":"q475","domain":"D4","family":"ir-process","question":"Two weeks after operations returned to normal, the team meets to document what went well, what failed, and how to improve their playbooks and tooling for next time. Which phase is this?","options":["preparation","recovery","analysis","lessons learned"],"correctIndex":3,"explanation":"Lessons learned. The post-incident review to improve future response is lessons learned. The tell: lessons learned = post-incident review to improve; preparation = plans/tools before an incident; recovery = restore to normal operations; analysis = confirm and scope the incident."},{"id":"q476","domain":"D4","family":"ir-process","question":"Before any incident occurs, a team develops response playbooks, assembles forensic tools, and trains staff on their roles. Which incident response phase does this readiness work belong to?","options":["detection","preparation","analysis","recovery"],"correctIndex":1,"explanation":"Preparation. Building plans, tools, and training ahead of any event is the preparation phase, which comes first. The tell: order matters here. Preparation = readiness before an event; detection = first noticing the event; analysis = confirming and scoping it; recovery = restoring normal operations. Preparation precedes them all."},{"id":"q477","domain":"D4","family":"ir-process","question":"A monitoring alert flags unusual outbound traffic from a server, and this is the first point at which anyone realizes something may be wrong. Which incident response phase is this?","options":["preparation","analysis","detection","containment"],"correctIndex":2,"explanation":"Detection. The first awareness that an event may be occurring is the detection phase. The tell: order matters here. Detection = notice the event; analysis = confirm and scope it, which comes right after detection; containment = stop the spread, which comes later; preparation = readiness before anything happens."},{"id":"q478","domain":"D4","family":"ir-process","question":"Following an incident, systems have been fully restored, validated, and returned to normal production. According to the incident response lifecycle, which phase comes next?","options":["lessons learned","containment","eradication","detection"],"correctIndex":0,"explanation":"Lessons learned. Once recovery returns operations to normal, the final phase is the lessons-learned review. The tell: order matters here. The sequence is preparation, detection, analysis, containment, eradication, recovery, then lessons learned; containment and eradication both precede recovery, so only lessons learned can follow it."},{"id":"q479","domain":"D4","family":"ir-testing","question":"Even though no alerts have fired, analysts proactively search the environment for signs of an attacker who may have evaded existing detection tools. What activity is this?","options":["threat hunting","root cause analysis","tabletop","simulation"],"correctIndex":0,"explanation":"Threat hunting. Proactively searching for threats that evaded detection is threat hunting. The tell: threat hunting = proactive search for undetected threats; root cause analysis = find the underlying cause after an incident; tabletop = talk through the plan; simulation = act out the scenario."},{"id":"q480","domain":"D4","family":"ir-testing","question":"After resolving an outage caused by a breach, the team works backward through the evidence to determine the single underlying failure that allowed it to happen. Which activity is this?","options":["threat hunting","simulation","root cause analysis","tabletop"],"correctIndex":2,"explanation":"Root cause analysis. Determining the underlying cause after an incident is root cause analysis. The tell: root cause analysis = find the underlying cause post-incident; threat hunting = proactively search for hidden threats; simulation = act out a scenario; tabletop = discussion-based walkthrough."},{"id":"q481","domain":"D4","family":"ir-testing","question":"Which incident response exercise is a discussion-based walkthrough of the response plan in which participants talk through their actions and no live systems are touched?","options":["simulation","threat hunting","root cause analysis","tabletop"],"correctIndex":3,"explanation":"Tabletop. A discussion-only walkthrough that touches no systems is a tabletop exercise. The tell: tabletop = talk through the plan; simulation = act out the scenario with real controlled steps; threat hunting = proactively search for undetected threats; root cause analysis = determine the underlying cause after an incident."},{"id":"q482","domain":"D4","family":"ir-testing","question":"To test readiness, the team runs a controlled but realistic mock intrusion, actually executing the response steps against a staging environment rather than only discussing them. Which exercise is this?","options":["tabletop","root cause analysis","simulation","threat hunting"],"correctIndex":2,"explanation":"Simulation. Executing the response steps in a controlled, realistic scenario is a simulation. The tell: simulation = perform the steps in a controlled scenario; tabletop = discussion only, no systems touched; root cause analysis = find the underlying cause after the fact; threat hunting = proactively search for threats that evaded detection."},{"id":"q483","domain":"D4","family":"forensics","question":"Each time a seized hard drive changes hands, an investigator signs a form recording who took it, when, and why, creating an unbroken documented trail for court. What is this record?","options":["legal hold","chain of custody","acquisition","e-discovery"],"correctIndex":1,"explanation":"Chain of custody. The documented record of who handled evidence and when is chain of custody. The tell: chain of custody = documented handling trail; legal hold = preserve data for anticipated litigation; acquisition = collect/image the evidence; e-discovery = locate and produce electronic evidence for legal process."},{"id":"q484","domain":"D4","family":"forensics","question":"Anticipating a lawsuit, the legal team orders that all emails and files belonging to certain employees must not be deleted or altered, even if normal retention would purge them. What is this directive?","options":["legal hold","preservation","chain of custody","acquisition"],"correctIndex":0,"explanation":"Legal hold. Preserving data because litigation is anticipated is a legal hold. The tell: legal hold = preserve data for anticipated litigation; preservation = protect collected evidence from alteration; chain of custody = documented handling trail; acquisition = collect/image the evidence."},{"id":"q485","domain":"D4","family":"forensics","question":"Which forensic step is the actual collection of evidence, such as making a bit-for-bit forensic image of a suspect drive?","options":["e-discovery","reporting","legal hold","acquisition"],"correctIndex":3,"explanation":"Acquisition. Collecting or imaging the evidence is acquisition. The tell: acquisition = collect/image the evidence; e-discovery = locate and produce electronic evidence for legal process; reporting = document findings; legal hold = preserve data for anticipated litigation."},{"id":"q486","domain":"D4","family":"forensics","question":"During active litigation, an organization must locate, collect, and produce relevant electronic records such as emails and documents for the opposing legal team. Which forensic process is this?","options":["legal hold","chain of custody","preservation","e-discovery"],"correctIndex":3,"explanation":"E-discovery. Locating and producing electronic records for a legal proceeding is e-discovery. The tell: e-discovery = find and produce electronic evidence for legal process; legal hold = the order to preserve data because litigation is anticipated; chain of custody = the documented evidence-handling trail; preservation = protecting evidence from alteration."},{"id":"q487","domain":"D4","family":"forensics","question":"Which forensic activity ensures that collected evidence is protected from any alteration, tampering, or degradation after it has been obtained?","options":["acquisition","reporting","preservation","e-discovery"],"correctIndex":2,"explanation":"Preservation. Protecting obtained evidence from any alteration is preservation. The tell: preservation = keep evidence unaltered after collection; acquisition = the initial collection or imaging of evidence; reporting = documenting the findings and conclusions; e-discovery = locating and producing records for legal process."},{"id":"q488","domain":"D4","family":"forensics","question":"Having finished the investigation, a forensic analyst compiles a formal document detailing the methods used, the evidence examined, and the conclusions reached, suitable for presentation in court. Which forensic step is this?","options":["reporting","acquisition","chain of custody","legal hold"],"correctIndex":0,"explanation":"Reporting. Compiling the documented methods, evidence, and conclusions is the reporting step. The tell: reporting = document findings and conclusions; acquisition = collect or image the evidence; chain of custody = record who handled evidence and when; legal hold = preserve data because litigation is anticipated."},{"id":"q489","domain":"D4","family":"log-sources","question":"An analyst needs to see the full raw contents of network traffic - every byte of the packets - to reconstruct exactly what data left the network. Which source provides this?","options":["metadata","packet capture","firewall log","network log"],"correctIndex":1,"explanation":"Packet capture. Full raw packet content is a packet capture. The tell: packet capture = full raw traffic content; metadata = data about the data (headers, timestamps); firewall log = allow/deny by connection; network log = flow/traffic records."},{"id":"q490","domain":"D4","family":"log-sources","question":"Which log source consists of data about the data - such as an email's headers, timestamps, and sender/recipient fields - rather than the message body itself?","options":["packet capture","endpoint log","metadata","firewall log"],"correctIndex":2,"explanation":"Metadata. Data about the data, like headers and timestamps, is metadata. The tell: metadata = data about the data (headers, timestamps); packet capture = full raw traffic content; endpoint log = activity on a host; firewall log = allow/deny by connection."},{"id":"q491","domain":"D4","family":"log-sources","question":"An analyst wants to see which connections were permitted or denied by source address, destination address, and port. Which log source records this?","options":["endpoint log","firewall log","application log","metadata"],"correctIndex":1,"explanation":"Firewall log. A record of connections allowed or denied by source, destination, and port comes from the firewall log. The tell: firewall log = allow or deny decisions per connection; endpoint log = activity on one host; application log = events emitted by a specific application; metadata = data about data such as headers and timestamps."},{"id":"q492","domain":"D4","family":"log-sources","question":"Which log source records authentication and audit events, such as successful and failed sign-ins and account changes, on a specific host's operating system?","options":["network log","firewall log","OS security log","packet capture"],"correctIndex":2,"explanation":"OS security log. Host authentication and audit events are recorded in the operating system security log. The tell: OS security log = auth and audit events on a host; network log = traffic and flow records; firewall log = allow or deny per connection; packet capture = full raw contents of traffic."},{"id":"q493","domain":"D5","family":"governance-hierarchy","question":"A security document reads: 'Step 1 - open the admin console. Step 2 - navigate to Users. Step 3 - disable the account and log the ticket number.' Which governance document type is this?","options":["Policy","Standard","Procedure","Guideline"],"correctIndex":2,"explanation":"Procedure. Numbered step-by-step instructions telling someone exactly how to perform a task are a procedure. The tell: policy = high-level mandatory what/why, standard = specific mandatory requirement (the how much, such as AES-256), procedure = the ordered how-to steps, guideline = recommended non-mandatory best practice."},{"id":"q494","domain":"D5","family":"governance-hierarchy","question":"Which governance document type is a recommended best practice that staff are encouraged to follow but are not required to obey?","options":["Guideline","Policy","Standard","Procedure"],"correctIndex":0,"explanation":"Guideline. A guideline offers advisory, non-mandatory recommendations. The tell: guideline = optional recommendation, policy = mandatory high-level statement of intent, standard = mandatory specific requirement (how much), procedure = mandatory step-by-step how-to."},{"id":"q495","domain":"D5","family":"governance-hierarchy","question":"Executives publish a one-page statement declaring that all company data must be protected and that security is every employee's responsibility, giving no technical specifics. Which document type is this?","options":["Standard","Policy","Guideline","Procedure"],"correctIndex":1,"explanation":"Policy. A broad mandatory statement of intent with no implementation detail is a policy. The tell: policy = high-level mandatory what/why, standard = the specific mandatory spec that supports it, guideline = optional advice, procedure = step-by-step how."},{"id":"q496","domain":"D5","family":"governance-hierarchy","question":"A mandatory rule requires that stored passwords use a defined hashing work factor and that disk encryption use AES-256. This specific, required document that supports the broader security policy is a:","options":["Guideline","Procedure","Policy","Standard"],"correctIndex":3,"explanation":"Standard. A standard is the mandatory specific requirement (the exact how much) that backs a policy. The tell: standard = specific mandatory spec (AES-256), policy = high-level mandatory intent, guideline = optional recommendation, procedure = ordered how-to steps."},{"id":"q497","domain":"D5","family":"governance-hierarchy","question":"A required specification states that all wireless access points must use WPA3 and that VPN connections must use a named approved cipher suite. This mandatory technical specification that supports the broader security policy is a:","options":["policy","procedure","guideline","standard"],"correctIndex":3,"explanation":"Standard. A mandatory specific technical requirement (WPA3, a named cipher suite) that supports a broader policy is a standard. The tell: policy = high-level mandatory intent (what and why); standard = the specific required spec (how much); procedure = ordered steps (how); guideline = recommended, not mandatory."},{"id":"q498","domain":"D5","family":"governance-hierarchy","question":"A new analyst is handed a numbered document telling exactly how to enroll a user's hardware token, in sequence, so the task is done the same way every time. Which document type is this?","options":["procedure","standard","guideline","policy"],"correctIndex":0,"explanation":"Procedure. A numbered, ordered set of steps done the same way every time is a procedure. The tell: procedure = step-by-step how-to; standard = required spec; guideline = optional recommendation; policy = high-level mandatory statement of intent."},{"id":"q499","domain":"D5","family":"governance-hierarchy","question":"Which governance document is the high-level, mandatory statement of management intent that says what the organization will do and why, without listing specific settings or steps?","options":["guideline","procedure","policy","standard"],"correctIndex":2,"explanation":"Policy. A high-level mandatory statement of management intent (what and why) with no specific settings is a policy. The tell: policy = the what and why; standard = the specific required spec; procedure = the ordered how-to steps; guideline = a non-mandatory recommendation."},{"id":"q500","domain":"D5","family":"policies","question":"A hurricane floods the corporate headquarters. The plan that keeps order fulfillment, payroll, and customer support functioning from alternate locations while the building is unusable is the:","options":["Disaster recovery policy","Business continuity policy","Incident response policy","Acceptable use policy"],"correctIndex":1,"explanation":"Business continuity policy. Business continuity keeps the whole business operating during a disruption, spanning people and processes, not just IT. The tell: business continuity = keep the business running (broad, proactive), disaster recovery = restore IT systems after a disaster (technical subset, reactive), incident response = handle security incidents, acceptable use = rules for using company systems."},{"id":"q501","domain":"D5","family":"policies","question":"After a fire destroys the server room, the team follows a documented plan to rebuild servers, restore databases from backup, and bring the IT systems back online. This plan is the:","options":["Business continuity policy","Change management policy","Disaster recovery policy","Incident response policy"],"correctIndex":2,"explanation":"Disaster recovery policy. Disaster recovery focuses specifically on restoring IT systems and data after a disaster. The tell: disaster recovery = restore IT systems (technical, reactive), business continuity = keep the whole business running (broad, proactive), change management = control modifications, incident response = handle security incidents."},{"id":"q502","domain":"D5","family":"policies","question":"Which policy defines what employees may and may not do with company laptops, email, and internet access?","options":["Acceptable use policy","Incident response policy","Business continuity policy","SDLC policy"],"correctIndex":0,"explanation":"Acceptable use policy. The AUP sets the rules for permitted use of company systems and resources. The tell: acceptable use = rules for using systems, incident response = handling security incidents, business continuity = keeping the business running, SDLC = secure software development process."},{"id":"q503","domain":"D5","family":"policies","question":"A policy defines the phases the security team follows once a breach is confirmed: preparation, detection, containment, eradication, and recovery. Which policy is this?","options":["Business continuity policy","Disaster recovery policy","Acceptable use policy","Incident response policy"],"correctIndex":3,"explanation":"Incident response policy. It governs how security incidents are detected, contained, and remediated through defined phases. The tell: incident response = handle security incidents, business continuity = keep the business running, disaster recovery = restore IT systems after a disaster, acceptable use = rules for using systems."},{"id":"q504","domain":"D5","family":"policies","question":"An ice storm knocks out the main office for a week. Management activates the plan that shifts staff to remote work, reroutes phone lines, and keeps invoicing and shipping running so the company still operates. Which policy is this?","options":["disaster recovery","business continuity","incident response","acceptable use policy"],"correctIndex":1,"explanation":"Business continuity. Keeping the business operating (invoicing, shipping, staff working) during a disruption is business continuity. The tell: business continuity = keep the whole business running during disruption (broad); disaster recovery = restore IT systems after a disaster (technical subset); incident response = handle a security incident; acceptable use policy = rules for using company systems."},{"id":"q505","domain":"D5","family":"policies","question":"After a lightning strike destroys the storage array, technicians follow a documented plan focused solely on rebuilding the affected servers, restoring the network, and recovering data from backups to bring technology back online. Which policy is this?","options":["business continuity","incident response","change management","disaster recovery"],"correctIndex":3,"explanation":"Disaster recovery. A plan focused solely on restoring servers, network, and data from backup after a disaster is disaster recovery. The tell: disaster recovery = restore IT systems (reactive, technical); business continuity = keep the business running overall; incident response = respond to a breach; change management = control production changes."},{"id":"q506","domain":"D5","family":"policies","question":"A policy requires that every proposed modification to production systems go through approval, impact analysis, a test, and a backout plan before it is applied. Which policy governs this?","options":["change management","SDLC","incident response","information security"],"correctIndex":0,"explanation":"Change management. Requiring approval, impact analysis, testing, and a backout plan before modifying production is the change management policy. The tell: change management = control changes to production; SDLC = secure software development lifecycle; incident response = handle security incidents; information security = the overarching security policy."},{"id":"q507","domain":"D5","family":"standards-procedures","question":"The SOC keeps a document titled 'Phishing Report Response' that lays out exactly what to do, in order, when a phishing report arrives. This scenario-specific procedure is a:","options":["Playbook","Onboarding procedure","Change management procedure","Password standard"],"correctIndex":0,"explanation":"Playbook. A playbook is the procedure written for one specific scenario. The tell: playbook = procedure for a specific situation, onboarding = grant access to a new hire, change management procedure = control system modifications, password standard = the required password spec."},{"id":"q508","domain":"D5","family":"standards-procedures","question":"When an employee resigns, HR triggers the procedure that revokes all system access and disables the person's accounts. This procedure is:","options":["Onboarding","Offboarding","Change management procedure","Access control standard"],"correctIndex":1,"explanation":"Offboarding. Offboarding is the exit procedure that removes access when someone leaves. The tell: offboarding = revoke access at exit, onboarding = grant access for a new hire, change management procedure = control system modifications, access control standard = the required access spec."},{"id":"q509","domain":"D5","family":"standards-procedures","question":"On a new hire's first day, IT follows the defined process to create accounts, assign role group memberships, and grant the access the person needs to start work. This procedure is:","options":["offboarding","onboarding","playbook","change management procedure"],"correctIndex":1,"explanation":"Onboarding. Creating accounts and granting access for a new hire on day one is the onboarding procedure. The tell: onboarding = grant access for a new hire; offboarding = revoke access at exit; playbook = procedure for a specific scenario; change management procedure = steps to control production changes."},{"id":"q510","domain":"D5","family":"standards-procedures","question":"A document specifies the exact minimum password length, the required character types, and the reuse limits that all accounts must meet. This required specification is a:","options":["encryption standard","playbook","password standard","offboarding procedure"],"correctIndex":2,"explanation":"Password standard. A required specification of minimum length, character types, and reuse limits is the password standard. The tell: password standard = required password spec; encryption standard = required crypto spec; playbook = scenario procedure; offboarding procedure = access removal at exit."},{"id":"q511","domain":"D5","family":"external-governance","question":"A retailer must comply with PCI DSS because it processes card payments. PCI DSS is enforced by the payment card brands rather than any government. This is an example of which governance source?","options":["Regulatory","Industry","Legal","National"],"correctIndex":1,"explanation":"Industry. PCI DSS is a sector framework imposed by an industry body, not a government. The tell: industry = sector frameworks like PCI DSS, regulatory = government rules with enforcement, legal = laws and contracts, national = country-scope jurisdiction."},{"id":"q512","domain":"D5","family":"external-governance","question":"A government agency issues enforceable rules and can levy penalties on organizations that fail to comply. This category of external governance is:","options":["Industry","Legal","Regulatory","Local"],"correctIndex":2,"explanation":"Regulatory. Regulatory governance is government-created rules carrying enforcement and penalties. The tell: regulatory = government rules with enforcement, industry = sector frameworks (PCI DSS), legal = laws and contracts, local = a jurisdiction scope rather than a source type."},{"id":"q513","domain":"D5","family":"external-governance","question":"A company must honor the terms written into a signed contract and comply with laws such that a breach could lead to a lawsuit. This category of external governance, grounded in laws and contracts, is:","options":["regulatory","industry","global","legal"],"correctIndex":3,"explanation":"Legal. Governance based on laws and signed contracts, where a breach can bring a lawsuit, is legal. The tell: legal = laws and contracts; regulatory = government rules with enforcement penalties; industry = sector frameworks like PCI DSS; global = worldwide jurisdiction scope."},{"id":"q514","domain":"D5","family":"external-governance","question":"A multinational must follow the European Union's GDPR for data on EU residents while also meeting the rules of every other country it operates in. Governance at this worldwide, cross-country scope is:","options":["global","national","local/regional","industry"],"correctIndex":0,"explanation":"Global. Governance that spans multiple countries worldwide (GDPR plus every other country's rules) is global scope. The tell: global = worldwide, crosses many countries; national = one country; local/regional = a state or municipality; industry = a sector framework, not a jurisdiction."},{"id":"q515","domain":"D5","family":"data-roles","question":"A marketing company decides which customer data to collect and for what purposes, then hires an outside email vendor to run the campaigns. Under GDPR, the marketing company is the:","options":["Data processor","Data controller","Data custodian","Data owner"],"correctIndex":1,"explanation":"Data controller. The controller decides why and how personal data is processed. The tell: controller = decides the why and how (GDPR), processor = acts on the data for the controller, custodian = hands-on technical care, owner = accountable senior person who sets classification."},{"id":"q516","domain":"D5","family":"data-roles","question":"An email vendor sends marketing messages using only the customer data and instructions supplied by its client company and makes no decisions about why or how the personal data is used. Under GDPR, the vendor is the:","options":["Data processor","Data controller","Data owner","Data custodian"],"correctIndex":0,"explanation":"Data processor. The processor acts on personal data solely on behalf of and under instruction from the controller. The tell: processor = acts for the controller, controller = decides the why and how, owner = accountable senior person setting classification, custodian = day-to-day technical protection."},{"id":"q517","domain":"D5","family":"data-roles","question":"Which role provides the hands-on technical protection of data day to day - running backups, applying access controls, and maintaining systems - without deciding classification or purpose?","options":["Data owner","Data controller","Data custodian/steward","Data processor"],"correctIndex":2,"explanation":"Data custodian/steward. The custodian handles the operational, technical safeguarding of data. The tell: custodian/steward = hands-on technical care, owner = accountable senior person who sets classification, controller = decides why and how, processor = acts for the controller."},{"id":"q518","domain":"D5","family":"data-roles","question":"A senior vice president is formally accountable for a customer dataset and sets its classification level and the rules for who may access it, though technical staff perform the hands-on work. This role is the:","options":["data controller","data owner","data processor","data custodian"],"correctIndex":1,"explanation":"Data owner. The accountable senior person who sets classification and access rules (while others do the hands-on work) is the data owner. The tell: data owner = accountable, sets classification and rules; data controller = decides why and how data is processed; data processor = acts on the controller's instructions; data custodian = hands-on technical protection."},{"id":"q519","domain":"D5","family":"data-roles","question":"A payroll bureau calculates and issues paychecks strictly according to the instructions and data provided by its client and makes no independent decisions about why the personal data is used. Under GDPR this bureau is the:","options":["data controller","data custodian","data processor","data owner"],"correctIndex":2,"explanation":"Data processor. A bureau that processes personal data strictly on its client's instructions, making no decisions about purpose, is the data processor. The tell: data processor = acts on behalf of the controller; data controller = decides why and how; data custodian = hands-on technical care; data owner = accountable senior person over the data."},{"id":"q520","domain":"D5","family":"data-roles","question":"A hospital determines which patient information it collects, the purposes for processing it, and the means used, then engages a cloud analytics vendor to crunch the numbers on its behalf. Under GDPR the hospital is the:","options":["data processor","data custodian","data owner","data controller"],"correctIndex":3,"explanation":"Data controller. The organization that determines the purposes and means of processing (then hires a vendor to execute) is the data controller. The tell: data controller = decides why and how; data processor = acts for the controller; data owner = accountable senior person setting classification; data custodian = day-to-day technical protection."},{"id":"q521","domain":"D5","family":"risk-assessment-types","question":"Automated tooling constantly watches the environment and updates risk scores in real time as configurations change. This risk assessment cadence is:","options":["Ad hoc","Recurring","Continuous","One-time"],"correctIndex":2,"explanation":"Continuous. Continuous assessment is ongoing automated monitoring with no defined stop. The tell: continuous = ongoing automated monitoring, ad hoc = as-needed triggered by an event, recurring = on a fixed schedule, one-time = a single point assessment."},{"id":"q522","domain":"D5","family":"risk-assessment-types","question":"After a competitor suffers a major breach, the CISO orders an unplanned risk assessment prompted specifically by that event. This assessment type is:","options":["Ad hoc","Recurring","Continuous","One-time"],"correctIndex":0,"explanation":"Ad hoc. An ad hoc assessment is performed as needed in response to a specific trigger. The tell: ad hoc = as-needed, triggered by an event, recurring = on a fixed schedule, continuous = ongoing automated monitoring, one-time = a single planned point assessment."},{"id":"q523","domain":"D5","family":"risk-assessment-types","question":"Company policy requires a full risk assessment every year on the same date regardless of whether anything has happened. This fixed-schedule cadence is:","options":["recurring","ad hoc","one-time","continuous"],"correctIndex":0,"explanation":"Recurring. A risk assessment run on a fixed schedule (yearly, same date) regardless of events is recurring. The tell: recurring = fixed schedule; ad hoc = triggered by a specific event; one-time = a single point assessment with no repeat; continuous = ongoing automated monitoring."},{"id":"q524","domain":"D5","family":"risk-assessment-types","question":"Before launching a brand-new product line, the firm commissions a single risk assessment for that specific launch, with no plan to repeat it. This assessment type is:","options":["recurring","continuous","ad hoc","one-time"],"correctIndex":3,"explanation":"One-time. A single assessment for one specific launch with no plan to repeat is a one-time assessment. The tell: one-time = single, no repeat; recurring = on a fixed schedule; continuous = ongoing automated; ad hoc = event-triggered as needed."},{"id":"q525","domain":"D5","family":"qual-quant","question":"An analyst calculates that a server failure costs $40,000 per event and occurs about twice a year, producing an $80,000 estimated annual loss. This dollars-and-math approach to risk is:","options":["Qualitative","Quantitative","Semi-quantitative","Hybrid"],"correctIndex":1,"explanation":"Quantitative. Quantitative analysis uses objective dollar figures and math such as SLE, ARO, and ALE. The tell: quantitative = numbers and money, qualitative = subjective high/medium/low ratings, semi-quantitative = scored ranges rather than pure dollars, hybrid = blends both approaches."},{"id":"q526","domain":"D5","family":"qual-quant","question":"A team rates each risk as High, Medium, or Low on a likelihood-versus-impact matrix based on expert judgment, using no monetary figures at all. This approach is:","options":["Qualitative","Quantitative","Hybrid","Semi-quantitative"],"correctIndex":0,"explanation":"Qualitative. Qualitative analysis relies on subjective ratings and judgment rather than money. The tell: qualitative = subjective labels (high/medium/low), quantitative = objective dollars and math, hybrid = blends both, semi-quantitative = numeric scoring of ranges rather than dollars."},{"id":"q527","domain":"D5","family":"qual-quant","question":"Which risk analysis method relies on subjective ratings and expert opinion rather than objective monetary calculation?","options":["Quantitative","Semi-quantitative","Qualitative","Hybrid"],"correctIndex":2,"explanation":"Qualitative. By definition qualitative analysis uses judgment-based ratings, not calculated dollar values. The tell: qualitative = subjective labels and judgment, quantitative = objective dollars and math, semi-quantitative = scored numeric ranges, hybrid = blends both."},{"id":"q528","domain":"D5","family":"qual-quant","question":"An analyst multiplies an asset's value by an exposure factor and an annual rate of occurrence to produce a specific dollar figure for expected yearly loss. This numeric, money-based approach is:","options":["qualitative","quantitative","semi-quantitative","hybrid rating"],"correctIndex":1,"explanation":"Quantitative. Producing a specific dollar figure from asset value, exposure factor, and ARO is quantitative analysis. The tell: quantitative = objective numbers and money (SLE, ALE, ARO); qualitative = subjective labels and judgment; semi-quantitative = ranking scales without true dollar figures; hybrid rating = a blend, still not pure money math."},{"id":"q529","domain":"D5","family":"qual-quant","question":"A committee assigns each risk a color rating of red, amber, or green based on the members' expert judgment, using no dollar amounts at all. This approach is:","options":["semi-quantitative","quantitative","qualitative","hybrid analysis"],"correctIndex":2,"explanation":"Qualitative. Assigning red, amber, or green by expert judgment with no dollar amounts is qualitative analysis. The tell: qualitative = subjective labels and judgment; quantitative = objective dollars and math; semi-quantitative = scored scales short of real money; hybrid analysis = a mix, still not pure monetary calculation."},{"id":"q530","domain":"D5","family":"qual-quant","question":"Which risk analysis method produces objective results expressed in monetary terms using formulas such as SLE, ARO, and ALE?","options":["quantitative","qualitative","semi-quantitative","subjective scoring"],"correctIndex":0,"explanation":"Quantitative. A method giving objective monetary results via SLE, ARO, and ALE formulas is quantitative. The tell: quantitative = numbers and money; qualitative = subjective ratings; semi-quantitative = numeric scales that are not real dollar figures; subjective scoring = judgment-based, not monetary."},{"id":"q531","domain":"D5","family":"risk-math","question":"An asset is valued at $200,000. A fire is expected to destroy 25% of its value in a single event. What is the single loss expectancy (SLE)?","options":["$100,000","$25,000","$200,000","$50,000"],"correctIndex":3,"explanation":"$50,000. SLE = Asset Value x Exposure Factor = $200,000 x 0.25 = $50,000. The tell: SLE = loss from ONE event (AV x EF), exposure factor = the 25% of value lost per event, ARO = how many times per year, ALE = SLE x ARO for the yearly expected loss."},{"id":"q532","domain":"D5","family":"risk-math","question":"A warehouse is valued at $500,000. A flood would destroy 40% of it and is expected once every 2 years. What is the annualized loss expectancy (ALE)?","options":["$200,000","$250,000","$1,000,000","$100,000"],"correctIndex":3,"explanation":"$100,000. SLE = $500,000 x 0.40 = $200,000; once every 2 years means ARO = 1/2 = 0.5; ALE = SLE x ARO = $200,000 x 0.5 = $100,000. The tell: ARO = occurrences per year (once every 2 years = 0.5, not 2), SLE = the $200,000 single-event loss, exposure factor = the 40%, ALE = SLE x ARO annualized."},{"id":"q533","domain":"D5","family":"risk-math","question":"A risk assessment lists a server's single loss expectancy as $40,000 and its annualized loss expectancy as $10,000. How often is the loss event expected to occur?","options":["Once every 4 years","Four times per year","Once every 10 years","Twice per year"],"correctIndex":0,"explanation":"Once every 4 years. ARO = ALE / SLE = $10,000 / $40,000 = 0.25, and an ARO of 0.25 means the event is expected once every 4 years. The tell: ARO = expected occurrences per year (ALE divided by SLE); SLE = the loss from one event; ALE = the expected yearly loss; an ARO below 1 means less often than once a year."},{"id":"q534","domain":"D5","family":"risk-math","question":"A data center flood is expected to occur once every 5 years. What is the annualized rate of occurrence (ARO)?","options":["0.2","5","1","0.5"],"correctIndex":0,"explanation":"0.2. ARO for a once-every-N-years event is 1/N, so 1/5 = 0.2 occurrences per year. The tell: ARO = occurrences per year (once every 5 years = 0.2, not 5), SLE = loss from one event, exposure factor = percent of asset lost per event, ALE = SLE x ARO."},{"id":"q535","domain":"D5","family":"risk-math","question":"A facility is valued at $1,200,000. An event destroys 15% of its value each time it occurs, and it happens about 3 times per year. What is the annualized loss expectancy (ALE)?","options":["$180,000","$540,000","$360,000","$60,000"],"correctIndex":1,"explanation":"$540,000. SLE = $1,200,000 x 0.15 = $180,000; ARO = 3; ALE = $180,000 x 3 = $540,000. The tell: SLE = the $180,000 single-event loss, exposure factor = the 15%, ARO = 3 events per year, ALE = SLE x ARO. Stopping at $180,000 forgets to multiply by ARO."},{"id":"q536","domain":"D5","family":"risk-math","question":"A laptop fleet component is valued at $60,000. Theft destroys 30% of that value per incident and occurs about twice a year. What is the annualized loss expectancy (ALE)?","options":["$18,000","$72,000","$36,000","$9,000"],"correctIndex":2,"explanation":"$36,000. SLE = $60,000 x 0.30 = $18,000; ARO = 2; ALE = $18,000 x 2 = $36,000. The tell: SLE = the $18,000 single-event loss (AV x EF), exposure factor = the 30%, ARO = 2 events per year, ALE = SLE x ARO for the annual figure."},{"id":"q537","domain":"D5","family":"risk-math","question":"A database server is valued at $80,000. A ransomware event is expected to destroy 45% of its value in a single occurrence. What is the single loss expectancy (SLE)?","options":["$18,000","$36,000","$44,000","$80,000"],"correctIndex":1,"explanation":"SLE = $36,000. SLE = asset value x exposure factor = $80,000 x 0.45 = $36,000. The tell: SLE is the loss from ONE event (AV x EF); $80,000 is the full asset value; $44,000 is the value remaining after the loss, not the loss; ALE would multiply this SLE by an ARO."},{"id":"q538","domain":"D5","family":"risk-math","question":"A storage array is valued at $250,000. A power surge destroys 20% of its value each time it occurs and is expected once every 4 years. What is the annualized loss expectancy (ALE)?","options":["$50,000","$62,500","$200,000","$12,500"],"correctIndex":3,"explanation":"ALE = $12,500. SLE = $250,000 x 0.20 = $50,000; ARO for once every 4 years = 1/4 = 0.25; ALE = SLE x ARO = $50,000 x 0.25 = $12,500. The tell: $50,000 is the SLE (one event); ALE is the yearly figure after applying ARO; once every 4 years means ARO = 0.25, not 4."},{"id":"q539","domain":"D5","family":"risk-math","question":"A risk report shows a single loss expectancy of $30,000 and an annualized loss expectancy of $90,000. What is the annualized rate of occurrence (ARO)?","options":["0.33","2","3","1.5"],"correctIndex":2,"explanation":"ARO = 3. Rearranging ALE = SLE x ARO gives ARO = ALE / SLE = $90,000 / $30,000 = 3 times per year. The tell: ARO is how many times per year; SLE ($30,000) is the single-event loss; ALE ($90,000) is the yearly loss; dividing ALE by SLE isolates the ARO."},{"id":"q540","domain":"D5","family":"probability-impact","question":"A risk analysis estimates that if a data breach occurs, the resulting harm - lawsuits, regulatory fines, and lost customers - would be severe. The dimension of risk being described here is the:","options":["Probability","Likelihood","Exposure factor","Impact"],"correctIndex":3,"explanation":"Impact. Impact is the magnitude of harm that results if the risk materializes. The tell: impact = size of the harm if it happens, probability = statistical chance it happens, likelihood = a qualitative chance rating, exposure factor = percent of an asset lost per event."},{"id":"q541","domain":"D5","family":"probability-impact","question":"In a quantitative risk model, the percentage of an asset's value that would be lost in a single event is called the:","options":["Probability","Likelihood","Exposure factor","Impact"],"correctIndex":2,"explanation":"Exposure factor. The exposure factor is the fraction of asset value lost in one event. The tell: exposure factor = percent of the asset lost per event, probability = statistical chance of occurrence, likelihood = qualitative chance rating, impact = magnitude of harm if it occurs."},{"id":"q542","domain":"D5","family":"probability-impact","question":"A team rates the chance of a phishing attack succeeding this year as 'high' based on expert judgment rather than a computed statistic. This qualitative rating of chance is the:","options":["probability","likelihood","impact","exposure factor"],"correctIndex":1,"explanation":"Likelihood. A subjective 'high' rating of an event's chance based on judgment is likelihood. The tell: likelihood = qualitative chance rating; probability = statistical, numerically computed chance; impact = magnitude of harm if it happens; exposure factor = percent of an asset lost per event."},{"id":"q543","domain":"D5","family":"probability-impact","question":"In a quantitative model, the statistical, numerically computed chance that a given event will occur is called the:","options":["probability","likelihood","exposure factor","impact"],"correctIndex":0,"explanation":"Probability. The statistical, numerically computed chance an event occurs is probability. The tell: probability = computed statistical chance; likelihood = subjective chance rating; exposure factor = percent of asset value lost; impact = severity of harm."},{"id":"q544","domain":"D5","family":"risk-register","question":"The security team tracks 'number of overdue critical patches' as a metric that, when it climbs, warns that a particular risk is rising. In the risk register, this metric is a:","options":["Key risk indicator (KRI)","Risk owner","Risk threshold","Risk appetite"],"correctIndex":0,"explanation":"Key risk indicator (KRI). A KRI is a measurable early-warning metric that signals increasing risk. The tell: KRI = a metric that warns risk is rising, risk owner = the person accountable for the risk, risk threshold = the level at which action is required, risk appetite = the overall risk the org is willing to accept."},{"id":"q545","domain":"D5","family":"risk-register","question":"Each entry in the risk register names one accountable manager who is responsible for monitoring and treating that specific risk. That named individual is the:","options":["Key risk indicator (KRI)","Risk threshold","Risk appetite","Risk owner"],"correctIndex":3,"explanation":"Risk owner. The risk owner is the person accountable for managing a specific register entry. The tell: risk owner = the accountable person for that risk, KRI = a warning metric, risk threshold = the level at which action is triggered, risk appetite = the org's overall willingness to take risk."},{"id":"q546","domain":"D5","family":"risk-register","question":"The register states that once the number of unpatched critical systems exceeds ten, the risk becomes unacceptable and treatment must begin immediately. This preset level that triggers action is the:","options":["key risk indicator","risk owner","risk threshold","risk tolerance"],"correctIndex":2,"explanation":"Risk threshold. The preset level (more than ten unpatched systems) at which action must begin is the risk threshold. The tell: risk threshold = the level that triggers action; key risk indicator = a metric warning that risk is rising; risk owner = the accountable person; risk tolerance = acceptable variance around a risk."},{"id":"q547","domain":"D5","family":"risk-register","question":"Which risk register element is a measurable metric that provides an early warning that the level of a particular risk is increasing?","options":["risk threshold","risk owner","risk tolerance","key risk indicator"],"correctIndex":3,"explanation":"Key risk indicator. A measurable metric giving early warning that a risk is increasing is a key risk indicator. The tell: key risk indicator = early-warning metric; risk threshold = the level that triggers action; risk owner = the accountable person; risk tolerance = acceptable variance before acting."},{"id":"q548","domain":"D5","family":"risk-appetite","question":"A fintech startup pursues aggressive expansion and is willing to take on significant risk to capture market share quickly. Which risk appetite posture is this?","options":["Expansionary","Conservative","Neutral","Risk tolerance"],"correctIndex":0,"explanation":"Expansionary. A high willingness to take on risk for reward is an expansionary appetite. The tell: expansionary = high appetite for reward, conservative = low appetite and risk-averse, neutral = a balanced middle stance, risk tolerance = the acceptable variance around a specific risk before acting."},{"id":"q549","domain":"D5","family":"risk-appetite","question":"Which term describes the broad, overall amount of risk an organization is willing to pursue in exchange for reward?","options":["Risk tolerance","Risk appetite","Conservative","Neutral"],"correctIndex":1,"explanation":"Risk appetite. It is the organization's overall willingness to take on risk for reward. The tell: risk appetite = overall willingness, risk tolerance = acceptable variance around one specific risk, conservative = a low-appetite stance, neutral = a balanced stance."},{"id":"q550","domain":"D5","family":"risk-appetite","question":"A bank sets its appetite but specifies that any single trading desk may deviate no more than 2 percent from its risk limit before action is required. That 2 percent boundary is an example of what?","options":["Risk tolerance","Expansionary posture","Risk appetite","Conservative posture"],"correctIndex":0,"explanation":"Risk tolerance. The acceptable variance around a specific risk before you must act is tolerance. The tell: risk tolerance = allowable deviation on a specific risk, expansionary posture = a high-appetite label, risk appetite = broad overall willingness, conservative posture = a low-appetite label."},{"id":"q551","domain":"D5","family":"risk-appetite","question":"A regulated pension fund minimizes risk-taking and accepts only ventures with near-certain outcomes to protect beneficiaries. Which risk appetite posture is this?","options":["expansionary","conservative","neutral","risk tolerance"],"correctIndex":1,"explanation":"Conservative. A low appetite that accepts only near-certain outcomes to protect beneficiaries is a conservative posture. The tell: expansionary = high appetite chasing reward, neutral = balanced, risk tolerance = the acceptable variance around one specific risk, not overall willingness."},{"id":"q552","domain":"D5","family":"risk-appetite","question":"A mid-size firm balances growth against caution, taking measured risks without strongly favoring aggression or restraint. Which risk appetite posture best fits?","options":["expansionary","risk tolerance","neutral","conservative"],"correctIndex":2,"explanation":"Neutral. Balancing growth against caution without favoring either extreme is a neutral appetite. The tell: expansionary = high risk-seeking for reward, conservative = low and risk-averse, risk tolerance = allowable deviation on a single risk before acting."},{"id":"q553","domain":"D5","family":"risk-appetite","question":"Which term describes the acceptable variance around a specific risk before an organization must act, rather than its overall willingness to take on risk?","options":["risk appetite","risk tolerance","expansionary appetite","neutral appetite"],"correctIndex":1,"explanation":"Risk tolerance. Tolerance is the acceptable variance around a specific risk before action, not broad willingness. The tell: risk appetite = overall willingness to pursue risk for reward, expansionary appetite = high, neutral appetite = balanced."},{"id":"q554","domain":"D5","family":"risk-strategies","question":"A company buys a cyber-insurance policy so that a data-breach payout is covered by the insurer rather than the business. Which risk strategy is this?","options":["Accept","Mitigate","Transfer","Avoid"],"correctIndex":2,"explanation":"Transfer. Shifting the financial impact to an insurer is risk transfer. The tell: transfer = shift risk to another party via insurance or outsourcing, accept = live with it and do nothing, mitigate = reduce it with controls, avoid = stop the activity entirely."},{"id":"q555","domain":"D5","family":"risk-strategies","question":"After a review, management cancels a planned overseas payment feature altogether because the fraud exposure is too high to justify. Which strategy did they choose?","options":["Avoid","Mitigate","Transfer","Accept"],"correctIndex":0,"explanation":"Avoid. Eliminating the activity so the risk cannot occur is avoidance. The tell: avoid = stop doing the activity entirely, mitigate = keep doing it but add controls, transfer = hand the risk to a third party, accept = proceed and absorb the risk."},{"id":"q556","domain":"D5","family":"risk-strategies","question":"To lower the chance of ransomware, a firm deploys endpoint protection, network segmentation, and offline backups while continuing normal operations. Which strategy is this?","options":["Accept","Avoid","Mitigate","Transfer"],"correctIndex":2,"explanation":"Mitigate. Reducing likelihood or impact with controls while continuing the activity is mitigation. The tell: mitigate = reduce risk with controls, avoid = discontinue the activity, transfer = offload to another party, accept = take no action at all."},{"id":"q557","domain":"D5","family":"risk-strategies","question":"A low-impact reporting bug would cost more to fix than it could ever cause in damage, so leadership signs off to leave it as-is and move on. Which strategy is this?","options":["Mitigate","Accept","Transfer","Avoid"],"correctIndex":1,"explanation":"Accept. Knowingly taking no action and living with a documented low risk is acceptance. The tell: accept = live with it and add no control, mitigate = add controls to reduce it, transfer = insure or outsource it, avoid = stop the activity."},{"id":"q558","domain":"D5","family":"risk-strategies","question":"A retailer outsources all payment card handling to a payment processor, and the contract makes the processor liable for losses from any card-data breach on its platform. Which risk strategy does this represent?","options":["Transfer","Avoid","Accept","Mitigate"],"correctIndex":0,"explanation":"Transfer. The contract shifts liability for the loss to a third party, which is risk transfer. The tell: transfer = another party assumes the loss (insurance, or outsourcing with a liability shift), avoid = stop the activity entirely, accept = absorb the loss yourself, mitigate = reduce the risk with controls you operate."},{"id":"q559","domain":"D5","family":"risk-strategies","question":"Which strategy reduces the probability or impact of a risk by applying safeguards while the organization continues the activity?","options":["Accept","Transfer","Avoid","Mitigate"],"correctIndex":3,"explanation":"Mitigate. Applying safeguards to cut probability or impact is mitigation. The tell: mitigate = reduce with controls, accept = do nothing and absorb it, transfer = offload to a third party, avoid = stop the activity."},{"id":"q560","domain":"D5","family":"risk-strategies","question":"A research lab receives permanent, documented approval excusing its entire class of legacy scanners from the encryption-at-rest requirement for as long as those devices remain in service. What is this arrangement best called?","options":["Exception","Accept","Avoid","Exemption"],"correctIndex":3,"explanation":"Exemption. A standing, pre-approved pass from a requirement is an exemption. The tell: exemption = ongoing pre-approved pass from a rule, exception = a one-off approved deviation, accept = broadly live with the risk, avoid = discontinue the activity."},{"id":"q561","domain":"D5","family":"risk-strategies","question":"For a single migration weekend, a manager requests and receives one-time approval to run a service without the usual logging agent installed. What is this documented one-off deviation called?","options":["Exemption","Exception","Transfer","Mitigate"],"correctIndex":1,"explanation":"Exception. A single approved deviation for one instance is an exception. The tell: exception = one-off approved deviation, exemption = standing pre-approved pass, transfer = move risk to a third party, mitigate = reduce risk with controls."},{"id":"q562","domain":"D5","family":"risk-strategies","question":"Transferring a risk keeps the activity going but shifts the loss to someone else. Which strategy instead removes the risk by discontinuing the activity completely?","options":["Accept","Mitigate","Avoid","Transfer"],"correctIndex":2,"explanation":"Avoid. Discontinuing the activity so the risk disappears is avoidance. The tell: avoid = stop the activity entirely, transfer = shift the loss but keep going, accept = keep going and absorb it, mitigate = keep going but reduce it with controls."},{"id":"q563","domain":"D5","family":"risk-strategies","question":"Unlike mitigation, which lowers a risk with controls, which strategy involves consciously choosing to take no action and simply absorb the potential loss?","options":["Accept","Avoid","Transfer","Mitigate"],"correctIndex":0,"explanation":"Accept. Choosing to absorb the loss with no control is acceptance. The tell: accept = take no action and absorb it, avoid = stop the activity, transfer = offload the loss to another party, mitigate = add controls to reduce it."},{"id":"q564","domain":"D5","family":"risk-strategies","question":"To cut the impact of stolen laptops, a firm enables full-disk encryption and remote wipe on every device while staff keep using them normally. Which risk strategy is this?","options":["mitigate","avoid","accept","transfer"],"correctIndex":0,"explanation":"Mitigate. Adding encryption and remote wipe reduces impact while the activity continues, which is mitigation. The tell: avoid = stop the activity entirely, accept = take no action and live with it, transfer = shift the loss to a third party."},{"id":"q565","domain":"D5","family":"risk-strategies","question":"Because a new drone-delivery pilot carries unacceptable liability, the board decides never to launch the program at all. Which strategy is this?","options":["transfer","mitigate","accept","avoid"],"correctIndex":3,"explanation":"Avoid. Choosing never to launch the program removes the risk by not doing the activity, which is avoidance. The tell: transfer = shift the loss to another party, mitigate = reduce it with controls while proceeding, accept = knowingly live with it."},{"id":"q566","domain":"D5","family":"risk-strategies","question":"A small firm signs a contract making its cloud provider contractually liable for losses caused by outages of the hosted platform. Which risk strategy does shifting that loss represent?","options":["transfer","mitigate","accept","avoid"],"correctIndex":0,"explanation":"Transfer. Making the provider contractually liable shifts the loss to a third party, which is transference, not mitigation. The tell: mitigate = reduce risk with your own controls, accept = absorb the loss yourself, avoid = stop using the service entirely."},{"id":"q567","domain":"D5","family":"risk-strategies","question":"Leadership reviews a minor cosmetic defect in an internal tool, decides any harm would be trivial, and formally chooses to take no action. Which strategy is this?","options":["transfer","avoid","accept","mitigate"],"correctIndex":2,"explanation":"Accept. Formally choosing to take no action and live with a trivial risk is acceptance. The tell: transfer = shift the loss to a third party, avoid = stop the activity, mitigate = reduce it with controls."},{"id":"q568","domain":"D5","family":"risk-strategies","question":"A hospital grants its entire fleet of legacy imaging workstations a permanent, standing waiver from the multifactor-login standard for as long as those units stay in service. What is this arrangement?","options":["exception","accept","mitigate","exemption"],"correctIndex":3,"explanation":"Exemption. A permanent, standing waiver from a requirement for a whole class of devices is an exemption. The tell: exception = a one-off approved deviation, accept = live with a risk generally, mitigate = reduce it with controls."},{"id":"q569","domain":"D5","family":"risk-strategies","question":"For a single quarterly close, finance receives a documented one-off approval to bypass the usual dual-approval control on one report. What is this deviation called?","options":["exemption","exception","accept","avoid"],"correctIndex":1,"explanation":"Exception. A documented one-off approval to bypass a control for a single event is an exception. The tell: exemption = a standing, ongoing pass from a requirement, accept = generally live with a risk, avoid = stop the activity."},{"id":"q570","domain":"D5","family":"risk-strategies","question":"Which risk strategy keeps an activity running but shifts the financial consequences of a loss onto a third party such as an insurer or outsourcer?","options":["accept","transfer","mitigate","avoid"],"correctIndex":1,"explanation":"Transfer. Keeping the activity but shifting financial consequences to an insurer or outsourcer is transference. The tell: accept = absorb the loss yourself, mitigate = reduce it with controls, avoid = discontinue the activity."},{"id":"q571","domain":"D5","family":"risk-strategies","question":"Which strategy eliminates a risk entirely by ceasing the activity that creates it?","options":["mitigate","accept","avoid","transfer"],"correctIndex":2,"explanation":"Avoid. Eliminating a risk by ceasing the activity that creates it is avoidance. The tell: mitigate = reduce it while continuing, accept = live with it, transfer = shift it to a third party."},{"id":"q572","domain":"D5","family":"risk-strategies","question":"Rather than leaving a vulnerable service exposed or dropping it, a team adds a web application firewall and tighter access rules so the service keeps running with less exposure. Which strategy is this?","options":["mitigate","accept","avoid","transfer"],"correctIndex":0,"explanation":"Mitigate. Adding a web application firewall and tighter access rules reduces exposure while the service keeps running, which is mitigation. The tell: accept = leave it and absorb the risk, avoid = drop the service, transfer = shift the loss to a third party."},{"id":"q573","domain":"D5","family":"risk-strategies","question":"A company decides a rare, low-cost risk is not worth insuring or fixing and simply budgets to absorb any loss itself. Which strategy is this?","options":["transfer","mitigate","avoid","accept"],"correctIndex":3,"explanation":"Accept. Budgeting to absorb a rare, low-cost loss rather than insuring or fixing it is acceptance. The tell: transfer = shift the loss to a third party, mitigate = reduce it with controls, avoid = stop the activity."},{"id":"q574","domain":"D5","family":"bia","question":"After an outage, a payment system must be back online within 2 hours to avoid unacceptable business harm. Which metric does this 2-hour target represent?","options":["RPO","RTO","MTTR","MTBF"],"correctIndex":1,"explanation":"RTO. The target time to restore service after an outage is the recovery time objective. The tell: RTO = how fast you must restore service, RPO = how much data loss is acceptable, MTTR = average time to repair, MTBF = average uptime between failures."},{"id":"q575","domain":"D5","family":"bia","question":"A database is backed up every 4 hours, and the business states it can tolerate losing at most 4 hours of transactions. Which metric defines that acceptable data-loss window?","options":["RTO","MTBF","RPO","MTTR"],"correctIndex":2,"explanation":"RPO. The maximum tolerable data loss measured back to the last good backup is the recovery point objective. The tell: RPO = acceptable data-loss point, RTO = time to restore service, MTBF = average time between failures, MTTR = average repair time."},{"id":"q576","domain":"D5","family":"bia","question":"Which reliability metric expresses the average time it takes to repair a failed component and return it to service?","options":["MTTR","MTBF","RTO","RPO"],"correctIndex":0,"explanation":"MTTR. Mean time to repair is the average duration to fix a failure. The tell: MTTR = average repair time after a failure, MTBF = average uptime between failures, RTO = restore-time target, RPO = acceptable data loss."},{"id":"q577","domain":"D5","family":"bia","question":"For a repairable server, which metric captures the average operating time between one failure and the next, indicating overall reliability?","options":["MTTR","RPO","RTO","MTBF"],"correctIndex":3,"explanation":"MTBF. Mean time between failures is the average uptime between breakdowns. The tell: MTBF = average time between failures, MTTR = average time to repair one failure, RTO = restore-time target, RPO = tolerable data loss."},{"id":"q578","domain":"D5","family":"bia","question":"A company configures backups so that after any incident it never loses more than 15 minutes of order data. Which metric does this 15-minute limit define?","options":["RTO","MTTR","MTBF","RPO"],"correctIndex":3,"explanation":"RPO. The maximum tolerable data loss, here 15 minutes back to the last good backup, is the recovery point objective. The tell: RTO = how fast you must restore service, MTTR = average time to repair, MTBF = average uptime between failures."},{"id":"q579","domain":"D5","family":"bia","question":"A reliability engineer cites a server's MTBF. What does this value describe?","options":["target time to restore service","average operating time between failures","maximum tolerable data loss","average time to repair a failure"],"correctIndex":1,"explanation":"MTBF. Mean time between failures is the average operating time between one failure and the next. The tell: target time to restore service = RTO, maximum tolerable data loss = RPO, average time to repair a failure = MTTR."},{"id":"q580","domain":"D5","family":"bia","question":"A vendor advertises that its appliances average four hours from failure to being fixed and back in service. Which metric is that four-hour figure?","options":["MTBF","RTO","MTTR","RPO"],"correctIndex":2,"explanation":"MTTR. The average time from failure to being fixed and back in service is mean time to repair. The tell: MTBF = average uptime between failures, RTO = target restore time after an outage, RPO = acceptable data-loss window."},{"id":"q581","domain":"D5","family":"vendor-assessment","question":"Before signing, a bank insists the contract include a provision letting it inspect the vendor's security controls on demand. Which element is this?","options":["Independent assessment","Right-to-audit clause","Supply chain analysis","Due diligence"],"correctIndex":1,"explanation":"Right-to-audit clause. A contractual right to inspect the vendor directly is a right-to-audit clause. The tell: right-to-audit clause = contractual right to inspect the vendor yourself, independent assessment = an outside third party reviews them, supply chain analysis = evaluating the vendor's own suppliers, due diligence = investigating the vendor before signing."},{"id":"q582","domain":"D5","family":"vendor-assessment","question":"A manufacturer evaluates not just its direct vendor but also the smaller upstream firms that supply that vendor's components for hidden risk. Which vendor-assessment activity is this?","options":["Supply chain analysis","Right-to-audit clause","Conflict of interest","Penetration testing"],"correctIndex":0,"explanation":"Supply chain analysis. Assessing the vendor's own upstream suppliers is supply chain analysis. The tell: supply chain analysis = evaluate the vendor's suppliers, right-to-audit clause = a contractual inspection right, conflict of interest = competing loyalties that bias judgment, penetration testing = an authorized simulated attack."},{"id":"q583","domain":"D5","family":"vendor-assessment","question":"A bank asks a prospective vendor to supply a report from an unaffiliated firm that objectively reviewed the vendor's controls. Which vendor-assessment element is this?","options":["right-to-audit clause","penetration testing","independent assessment","supply chain analysis"],"correctIndex":2,"explanation":"Independent assessment. A review by an unaffiliated third-party firm for objectivity is an independent assessment. The tell: right-to-audit clause = your contractual right to inspect the vendor yourself, penetration testing = an authorized simulated attack, supply chain analysis = evaluating the vendor's own upstream suppliers."},{"id":"q584","domain":"D5","family":"vendor-assessment","question":"During vendor selection, a reviewer discloses that her spouse owns shares in one of the bidding firms, which could bias her judgment. Which concern is this?","options":["due diligence","conflict of interest","independent assessment","right-to-audit clause"],"correctIndex":1,"explanation":"Conflict of interest. A reviewer with a personal stake that could bias judgment presents a conflict of interest. The tell: due diligence = investigating the vendor before signing, independent assessment = an objective third-party review, right-to-audit clause = the contractual right to inspect the vendor."},{"id":"q585","domain":"D5","family":"agreements","question":"A managed hosting contract guarantees 99.95 percent uptime and a 30-minute response time, with service credits owed when targets are missed. Which agreement is this?","options":["MOU","MSA","BPA","SLA"],"correctIndex":3,"explanation":"SLA. Measurable targets plus penalties equal a service level agreement. The tell: SLA = metrics with penalties, MOU = non-binding statement of intent, MSA = master framework contract, BPA = business partnership terms."},{"id":"q586","domain":"D5","family":"agreements","question":"Two universities sign a non-binding document expressing their shared intent to collaborate on research, with no enforceable obligations. Which agreement is this?","options":["SLA","MOU","SOW","NDA"],"correctIndex":1,"explanation":"MOU. A non-binding statement of mutual intent is a memorandum of understanding. The tell: MOU = non-binding intent, SLA = enforceable metrics with penalties, SOW = the scope of one specific job, NDA = confidentiality only."},{"id":"q587","domain":"D5","family":"agreements","question":"A company and a consulting firm sign an overarching contract that sets the general legal and commercial terms once, so future individual projects can be added quickly. Which agreement is this?","options":["SOW","MOA","MSA","SLA"],"correctIndex":2,"explanation":"MSA. A master framework contract that future work orders hang off of is a master service agreement. The tell: MSA = master framework for many future jobs, SOW = the specifics of one job, MOA = a formal agreement of roles and responsibilities, SLA = service targets with penalties."},{"id":"q588","domain":"D5","family":"agreements","question":"Under an existing master contract, a document spells out the exact deliverables, timeline, and milestones for one specific website build. Which agreement is this?","options":["MSA","MOU","SOW","BPA"],"correctIndex":2,"explanation":"SOW. The scope, deliverables, and timeline for a single job is a statement of work. The tell: SOW = the specifics of one job, MSA = the master framework it hangs off of, MOU = non-binding intent, BPA = partnership terms."},{"id":"q589","domain":"D5","family":"agreements","question":"Before sharing source code with a contractor, a firm requires them to sign a document that legally bars them from disclosing any confidential information. Which agreement is this?","options":["NDA","MOU","SLA","MOA"],"correctIndex":0,"explanation":"NDA. A pure confidentiality agreement is a non-disclosure agreement. The tell: NDA = confidentiality only, MOU = non-binding intent, SLA = service metrics with penalties, MOA = formal agreement of roles and responsibilities."},{"id":"q590","domain":"D5","family":"agreements","question":"Two firms forming a joint venture sign a document defining each partner's capital contribution, profit split, and decision-making authority. Which agreement is this?","options":["MSA","SLA","SOW","BPA"],"correctIndex":3,"explanation":"BPA. Terms governing a business partnership are a business partners agreement. The tell: BPA = partnership terms such as contributions and profit split, MSA = master framework for service work, SLA = service targets with penalties, SOW = one specific job's scope."},{"id":"q591","domain":"D5","family":"agreements","question":"Two agencies move past a loose understanding and sign a more formal, binding document that assigns specific roles and responsibilities to each party, though no money changes hands. Which agreement is this?","options":["MOU","MOA","NDA","SLA"],"correctIndex":1,"explanation":"MOA. A more formal, binding agreement defining roles and responsibilities, a step past an MOU, is a memorandum of agreement. The tell: MOA = binding roles and responsibilities agreement, MOU = looser non-binding intent, NDA = confidentiality only, SLA = measurable service targets with penalties."},{"id":"q592","domain":"D5","family":"agreements","question":"An IT director is asked to review the SLA in a new cloud contract. What does this document primarily establish?","options":["A non-binding statement of mutual intent to cooperate","Overarching master terms that future projects reference","Measurable service targets and penalties for missing them","The contribution and profit terms of a business partnership"],"correctIndex":2,"explanation":"SLA. A service level agreement sets measurable performance targets and the penalties for failing them. The tell: SLA = numbers plus penalties, MOU = non-binding intent, MSA = master framework contract, BPA = partnership terms."},{"id":"q593","domain":"D5","family":"agreements","question":"Unlike an MOA, which formally binds each party to defined roles and responsibilities, which document records only a general, non-binding statement of mutual intent to cooperate?","options":["MOU","SOW","MOA","MSA"],"correctIndex":0,"explanation":"MOU. A non-binding record of mutual intent is a memorandum of understanding. The tell: MOU = non-binding intent, MOA = more formal binding roles and responsibilities, SOW = one job's scope, MSA = master framework contract."},{"id":"q594","domain":"D5","family":"agreements","question":"A facilities vendor receives a document from a client authorizing one discrete task: replace the badge readers at a single office by June 30 for a fixed price. Which document is this?","options":["MOU","BPA","SOW","NDA"],"correctIndex":2,"explanation":"SOW. A statement of work (or work order) defines the scope, deliverables, and timeline for one specific job. The tell: SOW/WO = one job's scope and schedule, MOU = non-binding intent, BPA = partnership terms, NDA = confidentiality only."},{"id":"q595","domain":"D5","family":"agreements","question":"A cloud storage contract promises 99.99 percent availability with automatic service credits when monthly uptime falls short. Which agreement defines these measurable targets and penalties?","options":["MOU","BPA","SLA","MSA"],"correctIndex":2,"explanation":"SLA. Measurable availability targets with service credits for misses define a service level agreement. The tell: MOU = non-binding intent, BPA = partnership terms, MSA = master framework that SOWs hang off of."},{"id":"q596","domain":"D5","family":"agreements","question":"Two nonprofits sign a document expressing a shared, non-binding intent to cooperate on a food drive, creating no enforceable obligations. Which agreement is this?","options":["MOA","SLA","SOW","MOU"],"correctIndex":3,"explanation":"MOU. A non-binding statement of mutual intent with no enforceable obligations is a memorandum of understanding. The tell: MOA = a binding agreement assigning specific roles, SLA = measurable targets with penalties, SOW = the scope of one specific job."},{"id":"q597","domain":"D5","family":"agreements","question":"Two government agencies sign a binding document that assigns each side specific duties for a shared data-exchange program, though no payment is involved. Which agreement is this?","options":["MOA","MOU","MSA","NDA"],"correctIndex":0,"explanation":"MOA. A binding document assigning each party specific duties, with no money involved, is a memorandum of agreement. The tell: MOU = non-binding intent only, MSA = master commercial framework, NDA = confidentiality only."},{"id":"q598","domain":"D5","family":"agreements","question":"A company and a supplier sign one overarching contract fixing general legal, payment, and liability terms so future projects can proceed without renegotiating basics. Which agreement is this?","options":["SOW","MSA","SLA","BPA"],"correctIndex":1,"explanation":"MSA. One overarching contract fixing general terms so future projects proceed under it is a master service agreement. The tell: SOW = the specific deliverables of one job, SLA = measurable targets with penalties, BPA = partnership terms."},{"id":"q599","domain":"D5","family":"agreements","question":"Beneath an existing master contract, a document lists the precise deliverables, milestones, and completion date for one mobile-app development project. Which document is this?","options":["MSA","SLA","SOW","MOU"],"correctIndex":2,"explanation":"SOW. Precise deliverables, milestones, and a completion date for one project define a statement of work. The tell: MSA = the master framework it hangs off of, SLA = measurable service targets with penalties, MOU = non-binding intent."},{"id":"q600","domain":"D5","family":"agreements","question":"Before entering a due-diligence data room, an investor must sign a document that legally forbids disclosing any confidential information seen inside. Which agreement is this?","options":["BPA","MOA","SLA","NDA"],"correctIndex":3,"explanation":"NDA. A document that legally forbids disclosing confidential information is a non-disclosure agreement. The tell: BPA = partnership terms, MOA = binding roles and responsibilities, SLA = measurable targets with penalties."},{"id":"q601","domain":"D5","family":"agreements","question":"Two entrepreneurs launching a shared business sign a document defining ownership percentages, profit sharing, and how decisions are made. Which agreement is this?","options":["BPA","MOU","MSA","MOA"],"correctIndex":0,"explanation":"BPA. Defining ownership percentages, profit sharing, and decision-making for a joint business is a business partnership agreement. The tell: MOU = non-binding intent, MSA = master commercial framework, MOA = binding roles between parties."},{"id":"q602","domain":"D5","family":"agreements","question":"A maintenance firm receives a document authorizing one discrete task: repaint the lobby of a single branch by August 15 for a fixed fee. Which document is this?","options":["work order","MSA","SLA","MOU"],"correctIndex":0,"explanation":"Work order. Authorizing one discrete task with a fixed scope, deadline, and price is a work order. The tell: MSA = the master framework, SLA = measurable service targets with penalties, MOU = non-binding intent."},{"id":"q603","domain":"D5","family":"agreements","question":"Which agreement records only a general, non-binding statement of mutual intent, unlike an SLA that sets measurable targets and penalties?","options":["SLA","MSA","SOW","MOU"],"correctIndex":3,"explanation":"MOU. A general, non-binding statement of mutual intent, unlike an SLA's measurable targets and penalties, is a memorandum of understanding. The tell: SLA = numbers plus penalties, MSA = master framework SOWs hang off of, SOW = the scope of one specific job."},{"id":"q604","domain":"D5","family":"agreements","question":"Which document is the master framework that individual statements of work hang off of, rather than the scope of one specific job?","options":["SOW","MSA","SLA","BPA"],"correctIndex":1,"explanation":"MSA. The master framework contract that individual statements of work hang off of is a master service agreement. The tell: SOW = the specific scope of one job, SLA = measurable targets with penalties, BPA = partnership terms."},{"id":"q605","domain":"D5","family":"compliance","question":"A hospital that repeatedly violates health-data regulations is barred by the regulator from operating its lab entirely. Which compliance consequence is this?","options":["Loss of license","Fines","Reputational damage","Sanctions"],"correc
